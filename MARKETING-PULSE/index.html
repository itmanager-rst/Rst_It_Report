<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่งงาน Marketing - แต่ละสาขา</title>
    <style>
        * { box-sizing: border-box; font-family: 'Kanit', 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 40px 20px; text-align: center; }
        .container { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #1e293b; margin-bottom: 8px; font-size: 24px; }
        p.subtitle { color: #64748b; margin-bottom: 30px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        .card { 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            padding: 20px; 
            text-decoration: none; 
            color: #334155; 
            font-weight: 600; 
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card:hover { 
            border-color: #2563eb; 
            transform: translateY(-3px); 
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15); 
            color: #2563eb;
        }
        .icon { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>
<body>

<div class="container"> 
    <h1>📁 ระบบส่งงาน / ดูเอกสาร Marketing</h1>

        </a>
