<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root {
      --ink:#16202B; --ink-2:#1F2E3D; --paper:#FFFFFF; --card:#FFFFFF; --panel:#F7F8F6;
      --amber:#E3A23C; --amber-deep:#B87A1E; --green:#2F7A4F; --green-bg:#E3F3E8;
      --rust:#B5433A; --rust-bg:#FBE6E3; --line:#DDE1D8; --text:#16202B; --text-soft:#5B6B78;
    }
    * { box-sizing: border-box; }
    html, body {
      margin:0; padding:0; background: var(--paper); color: var(--text);
      font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', 'Sarabun', system-ui, sans-serif;
    }
    .mono { font-family:'IBM Plex Mono', ui-monospace, monospace; }

    .topbar {
      background: var(--ink); color:#fff; padding:14px 22px; display:flex;
      align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    }
    .topbar-brand { display:flex; align-items:center; gap:10px; }
    .topbar-mark { width:30px; height:30px; border-radius:8px; background:var(--amber);
      display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono';
      font-weight:600; font-size:13px; color:var(--ink); }
    .topbar-title { font-weight:600; font-size:15px; }
    .topbar-sub { font-size:11px; color:#9BA8B4; }

    .main-area { padding:22px 26px 48px; max-width:960px; margin:0 auto; }
    @media (max-width:640px) { .main-area{padding:16px 14px 36px;} .topbar{padding:12px 14px;} }

    .page-title { font-size:19px; font-weight:600; color:var(--ink); margin:0; }
    .page-sub { font-size:13px; color:var(--text-soft); margin:2px 0 0; }

    .btn { display:inline-flex; align-items:center; gap:6px; justify-content:center; font-size:13.5px;
      font-weight:500; padding:9px 16px; border-radius:9px; border:1px solid transparent; cursor:pointer;
      font-family:inherit; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn-primary { background:var(--ink); color:#fff; }
    .btn-primary:hover:not(:disabled) { background:var(--ink-2); }
    .btn-secondary { background:#fff; color:var(--ink); border-color:var(--line); }
    .btn-secondary:hover:not(:disabled) { background:#F6F7F3; }
    .btn-ghost { background:transparent; color:var(--text-soft); border:1px dashed var(--line); }
    .btn-approve { background:var(--green); color:#fff; }
    .btn-approve:hover:not(:disabled) { background:#25693F; }
    .btn-danger { background:#fff; color:var(--rust); border-color:var(--rust-bg); }
    .btn-danger:hover:not(:disabled) { background:var(--rust-bg); }
    .btn-print { background:#fff; color:var(--ink); border:1.5px solid var(--ink); }
    .btn-print:hover:not(:disabled) { background:var(--ink); color:#fff; }

    .back-link { display:inline-flex; align-items:center; gap:4px; font-size:12.5px; color:var(--text-soft);
      background:none; border:none; cursor:pointer; margin-bottom:14px; padding:0; font-family:inherit; }
    .back-link:hover { color:var(--ink); }

    .tab-row { display:flex; gap:4px; background:#E9EBE4; padding:3px; border-radius:10px; flex-wrap:wrap; }
    .tab-btn { font-size:12.5px; padding:7px 13px; border-radius:8px; border:none; background:transparent;
      color:var(--text-soft); cursor:pointer; display:flex; align-items:center; gap:6px; font-family:inherit; }
    .tab-btn--on { background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.06); }

    .search-box { display:flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line);
      border-radius:9px; padding:7px 11px; font-size:13px; color:var(--text-soft); flex:1 1 220px; min-width:0; max-width:340px; }
    .search-box input { border:none; outline:none; font-size:13px; width:100%; background:transparent;
      color:var(--text); font-family:inherit; }

    .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
      padding:50px 20px; color:var(--text-soft); font-size:13.5px; background:#fff; border:1px dashed var(--line);
      border-radius:12px; }

    .rfq-list { display:flex; flex-direction:column; gap:8px; }
    .rfq-row { display:flex; align-items:center; justify-content:space-between; gap:12px; background:#fff;
      border:1px solid var(--line); border-radius:11px; padding:13px 16px; }
    .rfq-row:hover { border-color:#B9C0AF; box-shadow:0 2px 8px rgba(22,32,43,.06); }
    .rfq-row-click { cursor:pointer; text-align:left; background:none; border:none; font-family:inherit; flex:1; min-width:0; }
    .rfq-row-title { font-size:14px; font-weight:600; color:var(--ink); }
    .rfq-row-meta { font-size:12px; color:var(--text-soft); margin-top:3px; }
    .text-soft { color:var(--text-soft); }

    .status-pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 10px;
      font-size:12px; font-weight:500; white-space:nowrap; }
    .status-dot { width:6px; height:6px; border-radius:999px; }

    .item-card, .edit-item-card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
    .item-title { font-size:14.5px; font-weight:600; color:var(--ink); }
    .item-sub { font-size:12px; color:var(--text-soft); margin-top:1px; }
    .save-chip { display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--green);
      background:var(--green-bg); padding:5px 10px; border-radius:999px; white-space:nowrap; }

    .vendor-row { border:1px solid var(--line); border-radius:9px; padding:10px 12px; background:#FBFBF9; margin-bottom:9px; cursor:pointer; }
    .vendor-row:last-child { margin-bottom:0; }
    .vendor-row--chosen { border-color:var(--green); background:var(--green-bg); }
    .vendor-row-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
    .vendor-name { font-size:13.5px; font-weight:600; color:var(--ink); }
    .vendor-total { font-family:'IBM Plex Mono'; font-size:13.5px; font-weight:600; color:var(--ink); white-space:nowrap; }
    .radio-dot { width:14px; height:14px; border-radius:999px; border:2px solid #B9C0AF; flex-shrink:0; display:inline-block; }
    .radio-dot--on { border-color:var(--green); background:var(--green); box-shadow:inset 0 0 0 2.5px #fff; }
    .flag-badge { display:inline-flex; align-items:center; gap:3px; font-size:10.5px; font-weight:700; color:var(--green);
      background:#fff; border:1px solid var(--green); padding:1.5px 7px; border-radius:999px; white-space:nowrap; }
    .chosen-badge { display:inline-flex; align-items:center; gap:3px; font-size:10.5px; font-weight:700; color:#215C3B;
      background:#fff; padding:1.5px 7px; border-radius:999px; white-space:nowrap; }
    .rail { height:7px; background:#E7E9E2; border-radius:4px; overflow:hidden; margin:5px 0 8px; }
    .rail-fill { height:100%; border-radius:4px; }
    .vendor-meta { display:flex; flex-wrap:wrap; gap:11px; font-size:11.5px; color:var(--text-soft); }
    .vendor-meta span { display:inline-flex; align-items:center; gap:4px; }
    .vendor-meta em { font-style:normal; color:var(--amber-deep); margin-left:2px; }

    .field-label { display:block; font-size:12px; font-weight:600; color:var(--text-soft); margin-bottom:5px; }
    .tinput { width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:13.5px;
      font-family:inherit; color:var(--text); background:#fff; outline:none; }
    .tinput:focus { border-color:var(--ink-2); box-shadow:0 0 0 3px rgba(31,46,61,.08); }
    textarea.tinput { resize:vertical; }

    .grid-3 { display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; }
    .grid-4 { display:grid; grid-template-columns:1fr 2.2fr 1fr 1fr; gap:10px; }
    .grid-6 { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; align-items:center; }
    .grid-6 .col-span-2 { grid-column:span 2; }
    .grid-head-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
    @media (max-width:760px) { .grid-3{grid-template-columns:1fr;} .grid-4{grid-template-columns:1fr 1fr;} .grid-6{grid-template-columns:1fr 1fr;} .grid-6 .col-span-2{grid-column:span 2;} .grid-head-3{grid-template-columns:1fr;} }
    @media (max-width:420px) { .grid-4{grid-template-columns:1fr;} .grid-6{grid-template-columns:1fr;} .grid-6 .col-span-2{grid-column:span 1;} .page-title{font-size:17px;} .btn{padding:8px 12px;font-size:12.5px;} }

    .edit-item-label { font-size:12px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; color:var(--amber-deep); }
    .vendor-edit-row { background:#F7F8F4; border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:8px; }
    .vendor-edit-label { font-size:11.5px; font-weight:600; color:var(--text-soft); }
    .vat-check { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-soft); white-space:nowrap; }
    .preview-label { font-size:11px; font-weight:600; color:var(--text-soft); text-transform:uppercase; letter-spacing:.3px; margin-bottom:8px; }

    .icon-btn { background:none; border:none; color:var(--text-soft); cursor:pointer; padding:4px; border-radius:6px; font-size:12px; }
    .icon-btn:hover { color:var(--rust); background:var(--rust-bg); }

    .edit-actions { display:flex; gap:10px; margin-top:22px; padding-top:18px; border-top:1px solid var(--line); flex-wrap:wrap; }
    .hint-text { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--amber-deep); margin-top:9px; }

    .savings-banner { display:flex; align-items:flex-start; gap:10px; background:var(--green-bg); border:1px solid #BEE0C9;
      color:#215C3B; padding:12px 15px; border-radius:10px; margin-bottom:14px; font-size:12.5px; }
    .savings-banner-title { font-weight:700; }
    .savings-banner-sub { color:#3E7A56; margin-top:1px; }

    .error-banner { background:var(--rust-bg); color:#8C332B; font-size:12.5px; padding:10px 14px; border-radius:9px;
      margin-bottom:14px; display:flex; align-items:center; gap:6px; }
    .flex { display:flex; }
    .items-center { align-items:center; }
    .gap-1 { gap:4px; }

    .upload-zone { border:1.5px dashed var(--line); border-radius:12px; padding:16px 18px; background:#fff;
      cursor:pointer; margin-bottom:8px; text-align:center; transition:border-color .12s, background .12s; }
    .upload-zone:hover, .upload-zone--drag { border-color:var(--amber-deep); background:#FBF6EC; }
    .upload-zone-inner { display:flex; flex-direction:column; align-items:center; gap:3px; }
    .upload-icon { font-size:20px; }
    .upload-text { font-size:13px; color:var(--ink); }
    .upload-sub { font-size:11.5px; color:var(--text-soft); }
    .upload-status { font-size:12.5px; padding:9px 13px; border-radius:9px; margin-bottom:16px; display:none; }
    .upload-status--loading { display:block; background:#EEF0EC; color:var(--text-soft); }
    .upload-status--success { display:block; background:var(--green-bg); color:#215C3B; }
    .upload-status--error { display:block; background:var(--rust-bg); color:#8C332B; }

    /* ---------------- Print / ใบเปรียบเทียบราคา ---------------- */
    .print-modal-overlay { position:fixed; inset:0; background:rgba(22,32,43,.55); z-index:1000;
      display:flex; align-items:flex-start; justify-content:center; padding:22px 14px; overflow:auto; }
    .print-modal { background:var(--panel); border-radius:14px; width:100%; max-width:1200px; overflow:hidden;
      display:flex; flex-direction:column; max-height:calc(100vh - 44px); }
    .print-toolbar { background:var(--ink); color:#fff; padding:11px 16px; display:flex; align-items:center;
      justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .print-toolbar-group { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .print-toggle-set { display:flex; background:rgba(255,255,255,.12); border-radius:8px; padding:2px; }
    .print-toggle-btn { background:none; border:none; color:#C9D1D8; font-size:11.5px; padding:6px 11px;
      border-radius:6px; cursor:pointer; font-family:inherit; }
    .print-toggle-btn--on { background:#fff; color:var(--ink); font-weight:600; }
    .print-action-btn { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500;
      padding:7px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.06);
      color:#fff; cursor:pointer; font-family:inherit; }
    .print-action-btn:hover { background:rgba(255,255,255,.16); }
    .print-action-btn--primary { background:var(--amber); border-color:var(--amber); color:var(--ink); font-weight:700; }
    .print-action-btn--primary:hover { background:#EFB25E; }
    .print-close-btn { background:none; border:none; color:#C9D1D8; font-size:18px; cursor:pointer; padding:4px 8px; }
    .print-close-btn:hover { color:#fff; }

    .print-modal-body { overflow:auto; padding:22px; background:#DCE0D8; flex:1; }
    .print-sheet { background:#fff; margin:0 auto; box-shadow:0 4px 18px rgba(0,0,0,.18); padding:12mm 10mm;
      font-family:'Sarabun','IBM Plex Sans Thai','Noto Sans Thai',sans-serif; color:#111; }
    .print-sheet--landscape { width:297mm; min-height:210mm; }
    .print-sheet--portrait { width:210mm; min-height:297mm; }
    .print-sheet--compact { font-size:10.5px; }
    .print-sheet--compact .ps-table th, .print-sheet--compact .ps-table td { padding:3px 5px; }
    .print-sheet:not(.print-sheet--compact) { font-size:12px; }
    .print-sheet:not(.print-sheet--compact) .ps-table th, .print-sheet:not(.print-sheet--compact) .ps-table td { padding:4px 6px; }

    .ps-header { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #111;
      padding-bottom:8px; margin-bottom:10px; }
    .ps-org { font-weight:700; font-size:1.25em; }
    .ps-doc-title { font-weight:700; font-size:1.15em; text-align:right; }
    .ps-doc-sub { text-align:right; color:#444; font-size:.9em; }
    .ps-meta { display:flex; flex-wrap:wrap; gap:4px 22px; font-size:.95em; margin-bottom:10px; color:#222; }
    .ps-refprice { display:flex; gap:18px; flex-wrap:wrap; font-size:.95em; margin-bottom:10px; padding:7px 10px;
      background:#F2F3EE; border:1px solid #ccc; border-radius:6px; }
    .ps-refprice b { font-family:'IBM Plex Mono',monospace; }

    .ps-item-block { margin-bottom:10px; page-break-inside:avoid; }
    .ps-item-title { font-weight:700; margin-bottom:3px; }
    table.ps-table { width:100%; border-collapse:collapse; margin-bottom:4px; }
    .ps-table th, .ps-table td { border:1px solid #999; text-align:left; vertical-align:top; word-break:break-word; }
    .ps-table th { background:#EAECE6; font-weight:700; }
    .ps-table td.num, .ps-table th.num { text-align:right; font-family:'IBM Plex Mono',monospace; }
    .ps-cheapest { background:#E3F3E8 !important; font-weight:700; }
    .ps-chosen-mark { font-size:.85em; color:#215C3B; }

    .ps-summary { page-break-inside:avoid; margin-top:10px; padding:9px 12px; background:#FBF6EC; border:1px solid #DDB876; border-radius:6px; }
    .ps-summary-title { font-weight:700; margin-bottom:3px; }

    .ps-signoff { page-break-inside:avoid; margin-top:20px; display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; }
    .ps-signoff-col { flex:1; min-width:150px; text-align:center; font-size:.92em; }
    .ps-signoff-line { border-bottom:1px dotted #333; height:34px; margin-bottom:4px; }
    .ps-signoff-role { font-weight:700; margin-bottom:2px; }
    .ps-signoff-name { min-height:14px; }
    .ps-signoff-date { color:#555; margin-top:2px; }

    @media print {
      body > *:not(.print-modal-overlay) { display:none !important; }
      .print-modal-overlay { position:static !important; background:none !important; padding:0 !important; display:block !important; }
      .print-modal { max-height:none !important; box-shadow:none !important; border-radius:0 !important; }
      .print-toolbar, .print-modal-body { padding:0 !important; background:none !important; }
      .print-toggle-set, .print-action-btn, .print-close-btn, .print-toolbar-group { display:none !important; }
      .print-sheet { box-shadow:none !important; margin:0 !important; width:auto !important; min-height:0 !important; }
    }
    @media (max-width:760px) {
      .print-modal-body { padding:12px; }
      .print-sheet, .print-sheet--landscape, .print-sheet--portrait { width:100%; min-height:0; padding:14px; }
    }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-mark">QC</div>
      <div>
        <div class="topbar-title">QuoteCompare</div>
        <div class="topbar-sub">ระบบเปรียบเทียบราคาใบเสนอราคาตามใบขอซื้อ · RST GROUP</div>
      </div>
    </div>
  </div>
  <div class="main-area">
    <div id="app-root"><div class="empty-state">กำลังเตรียมระบบ...</div></div>
  </div>

  <style id="print-page-style">@page { size: A4 landscape; margin: 8mm; }</style>
  <div class="print-modal-overlay" id="print-modal-overlay" style="display:none;">
    <div class="print-modal">
      <div class="print-toolbar">
        <div class="print-toolbar-group">
          <div class="print-toggle-set">
            <button type="button" class="print-toggle-btn" id="pt-landscape">แนวนอน</button>
            <button type="button" class="print-toggle-btn" id="pt-portrait">แนวตั้ง</button>
          </div>
          <div class="print-toggle-set">
            <button type="button" class="print-toggle-btn" id="pt-normal">ขนาดปกติ</button>
            <button type="button" class="print-toggle-btn" id="pt-compact">กะทัดรัด</button>
          </div>
        </div>
        <div class="print-toolbar-group">
          <button type="button" class="print-action-btn print-action-btn--primary" id="pt-print-now">🖨️ พิมพ์เอกสาร / เซฟ PDF</button>
          <button type="button" class="print-action-btn" id="pt-print-newtab">🔗 เปิดหน้าต่างพิมพ์แยก</button>
          <button type="button" class="print-action-btn" id="pt-export-xlsx">📊 Excel (.xlsx)</button>
          <button type="button" class="print-close-btn" id="pt-close">✕</button>
        </div>
      </div>
      <div class="print-modal-body">
        <div class="print-sheet print-sheet--landscape" id="print-sheet"></div>
      </div>
    </div>
  </div>

  <script>
  /* ============================= STATE & CONSTANTS ============================= */
  var STATE = {
    view: 'list', index: [], current: null, loadingIndex: true, saving: false, error: '',
    filterStatus: 'all', search: '',
    printOrientation: 'landscape', printDensity: 'normal', printMode: 'comparison', printRecommendation: '', printRecommendationLoading: false
  };

  var STATUS = {
    draft:     { label: 'ฉบับร่าง',    fg:'#5B6B78', bg:'#E7E9E2', dot:'#8B93A1' },
    completed: { label: 'เสร็จสมบูรณ์', fg:'#215C3B', bg:'#E3F3E8', dot:'#2F7A4F' }
  };

  /* ============================= HELPERS ============================= */
  function uid(p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function fmtBaht(n) {
    if (n === '' || n === null || n === undefined || isNaN(n)) return '—';
    return Number(n).toLocaleString('th-TH', { minimumFractionDigits:2, maximumFractionDigits:2 });
  }
  function fmtDate(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'numeric' }); }
    catch (e) { return '—'; }
  }
  function effectivePrice(v) {
    var p = parseFloat(v.unitPrice);
    if (isNaN(p)) return NaN;
    return v.vatIncluded ? p : p * 1.07;
  }
  function vendorLineTotal(item, v) {
    var eff = effectivePrice(v);
    if (isNaN(eff)) return NaN;
    var qty = parseFloat(item.qty) || 1;
    var ship = parseFloat(v.shippingCost) || 0;
    return eff * qty + ship;
  }
  function itemTotals(item) {
    var totals = [];
    item.vendors.forEach(function (v) {
      var t = vendorLineTotal(item, v);
      if (!isNaN(t)) totals.push({ id:v.id, total:t });
    });
    if (totals.length === 0) return { min:null, max:null, minId:null, maxId:null };
    var minT = totals[0], maxT = totals[0];
    totals.forEach(function (t) { if (t.total < minT.total) minT = t; if (t.total > maxT.total) maxT = t; });
    return { min:minT.total, max:maxT.total, minId:minT.id, maxId: totals.length > 1 ? maxT.id : null };
  }
  function computeSavings(rfq) {
    var totalMin = 0, totalMax = 0, counted = false;
    rfq.items.forEach(function (item) {
      var t = itemTotals(item);
      var validCount = item.vendors.filter(function (v) { return !isNaN(vendorLineTotal(item, v)); }).length;
      if (t.min !== null && t.max !== null && validCount >= 2) {
        counted = true; totalMin += t.min; totalMax += t.max;
      }
    });
    if (!counted || totalMax === 0) return null;
    return { totalMin:totalMin, totalMax:totalMax, savings: totalMax-totalMin, pct: (totalMax-totalMin)/totalMax*100 };
  }
  function emptyVendor() {
    return { id: uid('v'), vendorName:'', unitPrice:'', leadTimeDays:'', warrantyMonths:'', paymentTerms:'', shippingCost:'', vatIncluded:true };
  }
  function emptyItem() {
    return { id: uid('i'), code:'', name:'', unit:'หน่วย', qty:'1', vendors:[emptyVendor(), emptyVendor()] };
  }
  function emptyPr(preparedBy) {
    return { id: uid('pr'), title:'', prNumber:'', preparedBy: preparedBy || '', createdAt:new Date().toISOString(),
      status:'draft', items:[emptyItem()], notes:'', completedBy:'', completedAt:'', selections:{}, referencePrice:'' };
  }
  function findItem(rfq, itemId) { for (var i=0;i<rfq.items.length;i++) if (rfq.items[i].id===itemId) return rfq.items[i]; return null; }

  /* ============================= SERVER CALLS ============================= */
  function callServer(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[fnName].apply(runner, args);
    });
  }

  /* ============================= LOCAL PREFS (ไม่ใช่ระบบล็อกอิน — แค่จำชื่อผู้จัดทำล่าสุดให้พิมพ์สะดวกขึ้น) ============================= */
  function getLastPreparerName() { try { return localStorage.getItem('qc_last_preparer') || ''; } catch (e) { return ''; } }
  function setLastPreparerName(n) { try { localStorage.setItem('qc_last_preparer', n); } catch (e) {} }

  /* ============================= DATA ACTIONS ============================= */
  function refreshIndex() {
    STATE.loadingIndex = true;
    return callServer('getIndex').then(function (list) {
      STATE.index = list || [];
      STATE.loadingIndex = false;
    }).catch(function (err) {
      STATE.index = []; STATE.loadingIndex = false; STATE.error = 'โหลดรายการไม่สำเร็จ: ' + (err && err.message ? err.message : err);
    });
  }
  function openRfq(id) {
    STATE.error = '';
    callServer('getRfq', id).then(function (rec) {
      if (rec) {
        STATE.current = rec;
        STATE.view = 'workspace';
        render();
      }
    }).catch(function () {
      STATE.error = 'โหลดข้อมูลรายการนี้ไม่สำเร็จ'; render();
    });
  }
  function startCreate() {
    STATE.current = emptyPr(getLastPreparerName());
    STATE.view = 'workspace';
    render();
  }
  function saveRfqToServer(rec) {
    STATE.saving = true; STATE.error = '';
    return callServer('saveRfq', rec).then(function () {
      STATE.saving = false;
    }).catch(function () {
      STATE.saving = false; STATE.error = 'บันทึกไม่สำเร็จ กรุณาลองใหม่อีกครั้ง';
    });
  }
  function handleSave() {
    if (STATE.current.preparedBy) setLastPreparerName(STATE.current.preparedBy);
    saveRfqToServer(STATE.current).then(function () { return refreshIndex(); })
      .then(function () { render(); });
  }
  function handleSaveAndClose() {
    if (STATE.current.preparedBy) setLastPreparerName(STATE.current.preparedBy);
    saveRfqToServer(STATE.current).then(function () { return refreshIndex(); })
      .then(function () { STATE.view = 'list'; render(); });
  }
  function handleMarkComplete() {
    STATE.current.status = 'completed';
    STATE.current.completedBy = STATE.current.preparedBy || '';
    STATE.current.completedAt = new Date().toISOString();
    saveRfqToServer(STATE.current).then(function () { return refreshIndex(); }).then(function () { render(); });
  }
  function handleReopen() {
    STATE.current.status = 'draft';
    saveRfqToServer(STATE.current).then(function () { return refreshIndex(); }).then(function () { render(); });
  }
  function handleDelete(id, titleText) {
    if (!confirm('ลบใบขอซื้อ "' + (titleText || '(ไม่มีชื่อ)') + '" ใช่หรือไม่? การลบไม่สามารถย้อนกลับได้')) return;
    callServer('deleteRfq', id).then(function () { return refreshIndex(); }).then(function () { render(); });
  }

  /* ============================= RENDER: ROOT ============================= */
  function render() {
    var root = document.getElementById('app-root');
    var errorHtml = STATE.error ? '<div class="error-banner">' + escapeHtml(STATE.error) + '</div>' : '';
    if (STATE.view === 'list') {
      root.innerHTML = errorHtml + listShellHtml();
      wireList();
    } else {
      root.innerHTML = errorHtml + workspaceShellHtml();
      wireWorkspace();
    }
  }

    var s = STATUS[status] || STATUS.draft;
    return '<span class="status-pill" style="background:' + s.bg + ';color:' + s.fg + ';">' +
      '<span class="status-dot" style="background:' + s.dot + ';"></span>' + s.label + '</span>';

      return '<button type="button" class="tab-btn' + (STATE.filterStatus===t[0]?' tab-btn--on':'') + '" data-filter="' + t[0] + '">' + t[1] + '</button>';

          '<div class="rfq-row-meta">' + prLabel + escapeHtml(r.preparedBy||'ไม่ระบุผู้จัดทำ') + ' · ' + fmtDate(r.createdAt) +
            ' · ' + r.itemCount + ' รายการสินค้า · ' + r.vendorCount + ' ผู้ขาย</div>' +
        '</button>' +
        '<div class="flex items-center" style="gap:8px;">' + statusPillHtml(r.status) +

        '</div>' +

  function wireList() {
    var createBtn = document.getElementById('create-rfq-btn');
    if (createBtn) createBtn.addEventListener('click', startCreate);
    document.querySelectorAll('.tab-btn[data-filter]').forEach(function (btn) {
      btn.addEventListener('click', function () { STATE.filterStatus = btn.getAttribute('data-filter'); render(); });
    });
    var searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', function () {
      STATE.search = searchInput.value;
      document.getElementById('rfq-list-container').innerHTML = rfqListHtml();
      wireRfqListButtons();
    });
    wireRfqListButtons();
  }
  function wireRfqListButtons() {
    document.querySelectorAll('[data-open]').forEach(function (btn) {
      btn.addEventListener('click', function () { openRfq(btn.getAttribute('data-open')); });
    });
    document.querySelectorAll('[data-delete]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        handleDelete(btn.getAttribute('data-delete'), btn.getAttribute('data-title'));
      });
    });
    var emptyCreateBtn = document.getElementById('empty-create-btn');
    if (emptyCreateBtn) emptyCreateBtn.addEventListener('click', startCreate);
  }

  /* ============================= ITEM COMPARISON (ใช้ทั้งพรีวิวตอนแก้ไข และหน้าหลัก) ============================= */
  function itemComparisonHtml(item, opts) {
    opts = opts || {};
    var t = itemTotals(item);

    var saveChip = '';
    if (t.min !== null && t.max !== null && t.min !== t.max) {
      saveChip = '<div class="save-chip">↓ ประหยัดสูงสุด ' + fmtBaht(t.max - t.min) + ' บาท (' + (((t.max-t.min)/t.max)*100).toFixed(0) + '%)</div>';
    }
    var rowsHtml = item.vendors.map(function (v) {
      var total = vendorLineTotal(item, v);
      var isMin = t.minId === v.id && !isNaN(total);
      var isMax = t.maxId === v.id && !isNaN(total);
      var chosen = opts.selectedVendorId === v.id;
      var pct = t.max > 0 ? Math.max(8, (isNaN(total)?0:total) / t.max * 100) : 0;
      var barColor = isMin ? '#2F7A4F' : (isMax ? '#B5433A' : '#C7A468');
      var radio = opts.selectable ? '<span class="radio-dot' + (chosen?' radio-dot--on':'') + '"></span>' : '';
      var flag = isMin ? '<span class="flag-badge">🏳 ถูกที่สุด</span>' : '';
      var chosenBadge = chosen ? '<span class="chosen-badge">★ เลือก</span>' : '';
      var clickAttr = opts.selectable ? (' data-select-item="' + item.id + '" data-select-vendor="' + v.id + '"') : '';
      return '<div class="vendor-row' + (chosen?' vendor-row--chosen':'') + '"' + clickAttr + '>' +
        '<div class="vendor-row-top"><div class="flex items-center gap-1" style="min-width:0;">' + radio +
          '<span class="vendor-name">' + escapeHtml(v.vendorName || '(ไม่ระบุผู้ขาย)') + '</span>' + flag + chosenBadge + '</div>' +
          '<div class="vendor-total">' + (isNaN(total) ? '—' : fmtBaht(total) + ' บ.') + '</div></div>' +
        '<div class="rail"><div class="rail-fill" style="width:' + pct + '%;background:' + barColor + ';"></div></div>' +
        '<div class="vendor-meta">' +
          '<span>💰 ' + fmtBaht(v.unitPrice) + ' บ./' + escapeHtml(item.unit||'หน่วย') + (!v.vatIncluded ? '<em>+VAT7%</em>' : '') + '</span>' +
          '<span>🕒 ' + escapeHtml(v.leadTimeDays||'—') + ' วัน</span>' +
          '<span>🛡 ' + escapeHtml(v.warrantyMonths||'—') + ' ด.</span>' +
          '<span>' + escapeHtml(v.paymentTerms || 'ไม่ระบุเงื่อนไข') + '</span>' +
          '<span>🚚 ' + (v.shippingCost ? fmtBaht(v.shippingCost) + ' บ.' : 'ฟรี') + '</span>' +
        '</div></div>';
    }).join('');
    return '<div class="item-card" id="' + (opts.containerId || '') + '">' +
      '<div class="flex items-center" style="justify-content:space-between;gap:12px;margin-bottom:12px;align-items:flex-start;">' +
        '<div><div class="item-title">' + (item.code ? ('[' + escapeHtml(item.code) + '] ') : '') + escapeHtml(item.name || '(ไม่ได้ระบุชื่อสินค้า)') + '</div>' +
        '<div class="item-sub">จำนวน ' + qty.toLocaleString('th-TH') + ' ' + escapeHtml(item.unit || 'หน่วย') + '</div></div>' + saveChip +
      '</div>' + rowsHtml + '</div>';
  }

  function updateItemPreview(itemId) {

  function wirePreviewSelect(itemId) {

  function wireWorkspace() {
    document.getElementById('workspace-back-btn').addEventListener('click', function () { STATE.view = 'list'; render(); });

    prUploadZone.addEventListener('drop', function (e) {

    uploadZone.addEventListener('dragleave', function () { uploadZone.classList.remove('upload-zone--drag'); });
    uploadZone.addEventListener('drop', function (e) {

  function wireItemsSection() {
    document.querySelectorAll('[data-item-field]').forEach(function (el) {
      el.addEventListener('input', function () {
        var item = findItem(STATE.current, el.getAttribute('data-item'));
        if (!item) return;
        item[el.getAttribute('data-item-field')] = el.value;
        updateItemPreview(item.id);
      });
    });
    document.querySelectorAll('[data-field][data-vendor]').forEach(function (el) {
      var handler = function () {
        var item = findItem(STATE.current, el.getAttribute('data-item'));
        if (!item) return;
        var vendor = null;
        for (var i=0;i<item.vendors.length;i++) if (item.vendors[i].id === el.getAttribute('data-vendor')) vendor = item.vendors[i];
        if (!vendor) return;
        var field = el.getAttribute('data-field');
        vendor[field] = el.type === 'checkbox' ? el.checked : el.value;
        updateItemPreview(item.id);
      };
      el.addEventListener(el.type === 'checkbox' ? 'change' : 'input', handler);
    });
    document.querySelectorAll('[data-remove-item]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (STATE.current.items.length <= 1) return;
        var id = btn.getAttribute('data-remove-item');
        STATE.current.items = STATE.current.items.filter(function (it) { return it.id !== id; });
        renderItemsSection();
      });
    });
    document.querySelectorAll('[data-add-vendor]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var item = findItem(STATE.current, btn.getAttribute('data-add-vendor'));
        if (!item) return;
        item.vendors.push(emptyVendor());
        renderItemsSection();
      });
    });
    document.querySelectorAll('[data-remove-vendor]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var parts = btn.getAttribute('data-remove-vendor').split('|');
        var item = findItem(STATE.current, parts[0]);
        if (!item || item.vendors.length <= 1) return;
        item.vendors = item.vendors.filter(function (v) { return v.id !== parts[1]; });
        renderItemsSection();

    Object.keys(STATE.current.selections || {}).forEach(function (itemId) { wirePreviewSelect(itemId); });

  /* ============================= อัปโหลดไฟล์ใบเสนอราคา (PDF / รูปภาพ / Excel / CSV) ============================= */
  function setUploadStatus(msg, type) {
    var el = document.getElementById('upload-status');
    if (!el) return;
    el.className = 'upload-status' + (type ? ' upload-status--' + type : '');
    el.textContent = msg;
  }
  function isExcelOrCsv(file) {
    var name = (file.name || '').toLowerCase();
    return name.endsWith('.xlsx') || name.endsWith('.xls') || name.endsWith('.csv') ||
      file.type === 'text/csv' ||
      file.type === 'application/vnd.ms-excel' ||
      file.type === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  }
  function handleQuoteFile(file) {
    if (!file) return;
    var maxBytes = 15 * 1024 * 1024;
    if (file.size > maxBytes) {
      setUploadStatus('ไฟล์มีขนาดใหญ่เกินไป (จำกัดไม่เกิน 15MB) กรุณาลดขนาดไฟล์หรือถ่ายรูปใหม่', 'error');
      return;
    }
    if (isExcelOrCsv(file)) {
      handleExcelFile(file);
    } else {
      handlePdfOrImageFile(file);
    }
  }
  function handlePdfOrImageFile(file) {
    setUploadStatus('กำลังอ่านข้อมูลจากไฟล์ด้วย AI... อาจใช้เวลาสักครู่', 'loading');
    var reader = new FileReader();
    reader.onload = function () {
      var dataUrl = reader.result;
      var base64 = String(dataUrl).split(',')[1] || '';
      callServer('extractQuoteFromFile', base64, file.type || 'application/pdf', file.name)
        .then(function (extracted) { applyExtractedQuote(extracted); })
        .catch(function (err) { setUploadStatus('อ่านไฟล์ไม่สำเร็จ: ' + (err && err.message ? err.message : err), 'error'); });
    };
    reader.onerror = function () { setUploadStatus('อ่านไฟล์ไม่สำเร็จ กรุณาลองใหม่', 'error'); };
    reader.readAsDataURL(file);
  }
  function handleExcelFile(file) {
    if (typeof XLSX === 'undefined') {
      setUploadStatus('โหลดไลบรารีสำหรับอ่านไฟล์ Excel ไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่', 'error');
      return;
    }
    setUploadStatus('กำลังแปลงไฟล์ตารางแล้วอ่านข้อมูลด้วย AI... อาจใช้เวลาสักครู่', 'loading');
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = new Uint8Array(reader.result);
        var wb = XLSX.read(data, { type: 'array' });
        var csvParts = wb.SheetNames.map(function (name) {
          return 'ชีต: ' + name + '\n' + XLSX.utils.sheet_to_csv(wb.Sheets[name]);
        });
        var csvText = csvParts.join('\n\n');
        if (!csvText.trim()) { setUploadStatus('ไม่พบข้อมูลในไฟล์นี้', 'error'); return; }
        callServer('extractQuoteFromText', csvText, file.name)
          .then(function (extracted) { applyExtractedQuote(extracted); })
          .catch(function (err) { setUploadStatus('อ่านไฟล์ไม่สำเร็จ: ' + (err && err.message ? err.message : err), 'error'); });
      } catch (e) {
        setUploadStatus('แปลงไฟล์ Excel/CSV ไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
      }
    };
    reader.onerror = function () { setUploadStatus('อ่านไฟล์ไม่สำเร็จ กรุณาลองใหม่', 'error'); };
    reader.readAsArrayBuffer(file);
  }
  function isPristineItems(items) {
    return items.length === 1 && !items[0].name.trim() &&
      items[0].vendors.every(function (v) { return !v.vendorName.trim() && v.unitPrice === ''; });
  }
  function applyExtractedQuote(extracted) {
    var rfq = STATE.current;
    var vendorName = ((extracted && extracted.vendorName) || '').trim();
    var extractedItems = (extracted && extracted.items) || [];
    if (extractedItems.length === 0) {
      setUploadStatus('ไม่พบรายการสินค้าในไฟล์นี้ กรุณาตรวจสอบไฟล์หรือกรอกด้วยตนเอง', 'error');
      return;
    }
    if (isPristineItems(rfq.items)) rfq.items = [];

    extractedItems.forEach(function (ei) {
      var name = (ei.name || '').trim();
      var code = (ei.code || '').trim();
      var vendor = emptyVendor();
      vendor.vendorName = vendorName;
      vendor.unitPrice = (ei.unitPrice !== undefined && ei.unitPrice !== null) ? String(ei.unitPrice) : '';
      vendor.leadTimeDays = ei.leadTimeDays ? String(ei.leadTimeDays) : '';
      vendor.warrantyMonths = ei.warrantyMonths ? String(ei.warrantyMonths) : '';
      vendor.shippingCost = ei.shippingCost ? String(ei.shippingCost) : '';
      vendor.paymentTerms = extracted.paymentTerms || '';
      vendor.vatIncluded = ei.vatIncluded !== undefined ? !!ei.vatIncluded : true;

      var match = null;
      if (code) {
        for (var c = 0; c < rfq.items.length; c++) {
          if (rfq.items[c].code && rfq.items[c].code.trim().toLowerCase() === code.toLowerCase()) { match = rfq.items[c]; break; }
        }
      }
      if (!match && name) {
        for (var i = 0; i < rfq.items.length; i++) {
          if (rfq.items[i].name.trim().toLowerCase() === name.toLowerCase()) { match = rfq.items[i]; break; }
        }
      }
      if (match) {
        var blankSlot = null;
        for (var j = 0; j < match.vendors.length; j++) {
          if (!match.vendors[j].vendorName.trim() && match.vendors[j].unitPrice === '') { blankSlot = match.vendors[j]; break; }
        }
        if (blankSlot) {
          vendor.id = blankSlot.id;
          for (var k = 0; k < match.vendors.length; k++) { if (match.vendors[k].id === blankSlot.id) { match.vendors[k] = vendor; break; } }
        } else {
          match.vendors.push(vendor);
        }
        if (!match.code && code) match.code = code;
      } else {
        var newItem = emptyItem();
        newItem.code = code;
        newItem.name = name;
        newItem.unit = ei.unit || 'หน่วย';
        newItem.qty = (ei.qty !== undefined && ei.qty !== null && ei.qty !== 0) ? String(ei.qty) : '1';
        newItem.vendors = [vendor];
        rfq.items.push(newItem);
      }
    });

    if (rfq.items.length === 0) rfq.items.push(emptyItem());
    renderItemsSection();
    setUploadStatus(
      'ดึงข้อมูลสำเร็จ: ผู้ขาย "' + (vendorName || 'ไม่ระบุชื่อ') + '" — ' + extractedItems.length + ' รายการ กรุณาตรวจสอบความถูกต้องก่อนบันทึก',
      'success'
    );
  }

  /* ============================= อัปโหลดใบขอซื้อ (PR) เพื่อดึงรายการสินค้าตั้งต้น ============================= */

      return;
    }
    if (isExcelOrCsv(file)) handlePrExcelFile(file); else handlePrPdfOrImageFile(file);
  }
  function handlePrPdfOrImageFile(file) {
    setPrUploadStatus('กำลังอ่านใบขอซื้อด้วย AI... อาจใช้เวลาสักครู่', 'loading');

        .then(function (extracted) { applyExtractedPr(extracted); })
        .catch(function (err) { setPrUploadStatus('อ่านไฟล์ไม่สำเร็จ: ' + (err && err.message ? err.message : err), 'error'); });
    };

  }
  function handlePrExcelFile(file) {
    if (typeof XLSX === 'undefined') {
      setPrUploadStatus('โหลดไลบรารีสำหรับอ่านไฟล์ Excel ไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่', 'error');
      return;
    }
    setPrUploadStatus('กำลังแปลงไฟล์ตารางแล้วอ่านข้อมูลด้วย AI... อาจใช้เวลาสักครู่', 'loading');
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = new Uint8Array(reader.result);
        var wb = XLSX.read(data, { type: 'array' });
        var csvParts = wb.SheetNames.map(function (name) {
          return 'ชีต: ' + name + '\n' + XLSX.utils.sheet_to_csv(wb.Sheets[name]);
        });
        var csvText = csvParts.join('\n\n');
        if (!csvText.trim()) { setPrUploadStatus('ไม่พบข้อมูลในไฟล์นี้', 'error'); return; }
        callServer('extractPurchaseRequestFromText', csvText, file.name)
          .then(function (extracted) { applyExtractedPr(extracted); })
          .catch(function (err) { setPrUploadStatus('อ่านไฟล์ไม่สำเร็จ: ' + (err && err.message ? err.message : err), 'error'); });
      } catch (e) {
        setPrUploadStatus('แปลงไฟล์ Excel/CSV ไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
      }
    };
    reader.onerror = function () { setPrUploadStatus('อ่านไฟล์ไม่สำเร็จ กรุณาลองใหม่', 'error'); };
    reader.readAsArrayBuffer(file);
  }
  function applyExtractedPr(extracted) {
    var rfq = STATE.current;
    var extractedItems = (extracted && extracted.items) || [];
    if (extractedItems.length === 0) {
      setPrUploadStatus('ไม่พบรายการสินค้าในใบขอซื้อนี้ กรุณาตรวจสอบไฟล์หรือกรอกด้วยตนเอง', 'error');
      return;
    }
    if (extracted.prNumber && !rfq.prNumber.trim()) {
      rfq.prNumber = extracted.prNumber;
      var prEl = document.getElementById('rfq-prnumber-input');
      if (prEl) prEl.value = rfq.prNumber;
    }
    if (extracted.title && !rfq.title.trim()) {
      rfq.title = extracted.title;
      var titleEl = document.getElementById('rfq-title-input');
      if (titleEl) titleEl.value = rfq.title;
    }
    var newItems = extractedItems.map(function (ei) {
      var it = emptyItem();
      it.code = ei.code || '';
      it.name = ei.name || '';
      it.unit = ei.unit || 'หน่วย';
      it.qty = (ei.qty !== undefined && ei.qty !== null && ei.qty !== 0) ? String(ei.qty) : '1';
      return it;
    });
    if (isPristineItems(rfq.items)) rfq.items = newItems;
    else rfq.items = rfq.items.concat(newItems);
    renderItemsSection();
    setPrUploadStatus('ดึงรายการจากใบขอซื้อสำเร็จ: ' + newItems.length + ' รายการ กรุณาตรวจสอบความถูกต้อง แล้วอัปโหลดใบเสนอราคาจาก supplier ในขั้นตอนถัดไป', 'success');
  }

  /* ============================= PRINT / ใบเปรียบเทียบราคา ============================= */
  function vendorGrandTotals(rfq) {
    var totals = {};
    rfq.items.forEach(function (item) {
      item.vendors.forEach(function (v) {
        var t = vendorLineTotal(item, v);
        if (isNaN(t) || !v.vendorName.trim()) return;
        var key = v.vendorName.trim();
        if (!totals[key]) totals[key] = { total: 0, count: 0 };
        totals[key].total += t;
        totals[key].count += 1;
      });
    });
    var list = [];
    Object.keys(totals).forEach(function (k) { list.push({ vendorName: k, total: totals[k].total, count: totals[k].count }); });
    list.sort(function (a, b) { return a.total - b.total; });
    return list;
  }
  function fallbackRecommendation(rfq) {
    var savings = computeSavings(rfq);
    var lines = [];
    rfq.items.forEach(function (item) {
      var t = itemTotals(item);
      if (t.minId) {
        var v = null;
        for (var i = 0; i < item.vendors.length; i++) { if (item.vendors[i].id === t.minId) { v = item.vendors[i]; break; } }
        if (v) lines.push((item.name || '-') + ': ' + (v.vendorName || '-') + ' (' + fmtBaht(t.min) + ' บ.)');
      }
    });
    var head = savings
      ? ('เลือกผู้ขายที่ถูกที่สุดในแต่ละรายการจะประหยัดได้สูงสุด ' + fmtBaht(savings.savings) + ' บาท (' + savings.pct.toFixed(1) + '%) เมื่อเทียบผู้เสนอราคาต่ำสุดกับสูงสุดในทุกรายการ')
      : 'ข้อมูลราคายังไม่เพียงพอสำหรับสรุปการเปรียบเทียบแบบเต็มรูปแบบ กรุณาตรวจสอบราคาผู้ขายในแต่ละรายการ';
    return head + (lines.length ? ('\nผู้ขายที่แนะนำต่อรายการ: ' + lines.join(' / ')) : '');
  }
  function buildRecommendationPrompt(rfq) {
    var lines = ['ชื่อใบขอซื้อ: ' + (rfq.title || '-')];
    rfq.items.forEach(function (item) {
      var qty = parseFloat(item.qty) || 1;
      lines.push('รายการ: ' + (item.name || '-') + ' (' + qty + ' ' + (item.unit || 'หน่วย') + ')');
      item.vendors.forEach(function (v) {
        var total = vendorLineTotal(item, v);
        lines.push('  - ผู้ขาย ' + (v.vendorName || '-') + ': ราคา/หน่วย ' + (v.unitPrice || '-') +
          ' บาท, ส่งมอบ ' + (v.leadTimeDays || '-') + ' วัน, รับประกัน ' + (v.warrantyMonths || '-') +
          ' เดือน, เงื่อนไขชำระเงิน ' + (v.paymentTerms || '-') + ', ยอดรวม ' + (isNaN(total) ? '-' : total.toFixed(2)) + ' บาท');
      });
    });
    if (rfq.referencePrice) lines.push('ราคากลางอ้างอิง: ' + rfq.referencePrice + ' บาท');
    return lines.join('\n');
  }
  function buildPrintSheetHtml(rfq) {
    var savings = computeSavings(rfq);
    var totalItems = rfq.items.length;
    var vTotals = vendorGrandTotals(rfq);

    var itemsHtml = rfq.items.map(function (item, idx) {
      var t = itemTotals(item);
      var qty = parseFloat(item.qty) || 1;
      var rows = item.vendors.map(function (v) {
        var total = vendorLineTotal(item, v);
        var isMin = t.minId === v.id && !isNaN(total);
        var chosen = (rfq.selections && rfq.selections[item.id]) === v.id;
        return '<tr class="' + (isMin ? 'ps-cheapest' : '') + '">' +
          '<td>' + escapeHtml(v.vendorName || '-') + (chosen ? ' <span class="ps-chosen-mark">✓ เลือก</span>' : '') + '</td>' +
          '<td class="num">' + fmtBaht(v.unitPrice) + (!v.vatIncluded ? ' <span style="color:#a15">+VAT</span>' : '') + '</td>' +
          '<td class="num">' + escapeHtml(v.leadTimeDays || '-') + ' วัน</td>' +
          '<td class="num">' + escapeHtml(v.warrantyMonths || '-') + ' ด.</td>' +
          '<td>' + escapeHtml(v.paymentTerms || '-') + '</td>' +
          '<td class="num">' + (v.shippingCost ? fmtBaht(v.shippingCost) : 'ฟรี') + '</td>' +
          '<td class="num"><b>' + (isNaN(total) ? '-' : fmtBaht(total)) + '</b></td>' +
        '</tr>';
      }).join('');
      return '<div class="ps-item-block">' +
        '<div class="ps-item-title">' + (idx + 1) + '. ' + escapeHtml(item.name || '-') + ' (' + qty.toLocaleString('th-TH') + ' ' + escapeHtml(item.unit || 'หน่วย') + ')</div>' +
        '<table class="ps-table"><thead><tr>' +
          '<th>ผู้ขาย</th><th class="num">ราคา/หน่วย (บ.)</th><th class="num">ส่งมอบ</th><th class="num">รับประกัน</th>' +
          '<th>เงื่อนไขชำระเงิน</th><th class="num">ค่าจัดส่ง</th><th class="num">ยอดรวม (บ.)</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    }).join('');

    var vendorSummaryRows = vTotals.map(function (vt) {
      var complete = vt.count === totalItems;
      return '<tr><td>' + escapeHtml(vt.vendorName) + '</td><td class="num">' + vt.count + ' / ' + totalItems + '</td>' +
        '<td class="num">' + (complete ? '<b>' + fmtBaht(vt.total) + '</b>' : fmtBaht(vt.total) + ' (ไม่ครบทุกรายการ)') + '</td></tr>';
    }).join('');
    var vendorSummaryHtml = vTotals.length ? (
      '<div class="ps-item-block"><div class="ps-item-title">สรุปยอดรวมต่อผู้ขาย</div>' +
      '<table class="ps-table"><thead><tr><th>ผู้ขาย</th><th class="num">รายการที่เสนอราคา</th><th class="num">ยอดรวม (บาท)</th></tr></thead>' +
      '<tbody>' + vendorSummaryRows + '</tbody></table></div>') : '';

    var refPrice = parseFloat(rfq.referencePrice);
    var refHtml = '';
    if (!isNaN(refPrice) && refPrice > 0) {
      refHtml = '<div class="ps-refprice"><span>ราคากลาง: <b>' + fmtBaht(refPrice) + ' บาท</b></span>' +
        (savings ? (
          '<span>ราคาต่ำสุดที่เสนอ: <b>' + fmtBaht(savings.totalMin) + ' บาท</b></span>' +
          '<span>' + (refPrice >= savings.totalMin ? 'ต่ำกว่าราคากลาง' : 'สูงกว่าราคากลาง') + ': <b>' +
            fmtBaht(Math.abs(refPrice - savings.totalMin)) + ' บาท (' + (Math.abs(refPrice - savings.totalMin) / refPrice * 100).toFixed(1) + '%)</b></span>'
        ) : '') + '</div>';
    }

    var recoHtml = STATE.printRecommendationLoading
      ? '<div class="ps-summary"><div class="ps-summary-title">ข้อเสนอแนะ</div>กำลังประมวลผล...</div>'
      : (STATE.printRecommendation
          ? '<div class="ps-summary"><div class="ps-summary-title">ข้อเสนอแนะ</div>' + escapeHtml(STATE.printRecommendation).replace(/\n/g, '<br>') + '</div>'
          : '');

    var todayStr = fmtDate(new Date().toISOString());
    return '' +
      '<div class="ps-header">' +
        '<div><div class="ps-org">RST GROUP</div><div style="font-size:.85em;color:#555;">ระบบเปรียบเทียบใบเสนอราคา (QuoteCompare)</div></div>' +
        '<div><div class="ps-doc-title">ใบเปรียบเทียบราคา</div><div class="ps-doc-sub">พิมพ์เมื่อ ' + todayStr + '</div></div>' +
      '</div>' +
      '<div class="ps-meta">' +
        '<span><b>เรื่อง:</b> ' + escapeHtml(rfq.title || '-') + '</span>' +
        (rfq.prNumber ? ('<span><b>เลขที่ใบขอซื้อ:</b> ' + escapeHtml(rfq.prNumber) + '</span>') : '') +
        '<span><b>ผู้จัดทำ:</b> ' + escapeHtml(rfq.preparedBy || '-') + '</span>' +
        '<span><b>วันที่จัดทำ:</b> ' + fmtDate(rfq.createdAt) + '</span>' +
      '</div>' +
      refHtml + itemsHtml + vendorSummaryHtml + recoHtml +
      '<div class="ps-signoff">' +
        '<div class="ps-signoff-col"><div class="ps-signoff-line"></div><div class="ps-signoff-role">ผู้จัดทำ</div>' +
          '<div class="ps-signoff-name">(' + escapeHtml(rfq.preparedBy || '.......................') + ')</div>' +
          '<div class="ps-signoff-date">วันที่ ............/............/............</div></div>' +
        '<div class="ps-signoff-col"><div class="ps-signoff-line"></div><div class="ps-signoff-role">ผู้ตรวจสอบ</div>' +
          '<div class="ps-signoff-name">(.......................)</div>' +
          '<div class="ps-signoff-date">วันที่ ............/............/............</div></div>' +
        '<div class="ps-signoff-col"><div class="ps-signoff-line"></div><div class="ps-signoff-role">ผู้อนุมัติ</div>' +
          '<div class="ps-signoff-name">(.......................)</div>' +
          '<div class="ps-signoff-date">วันที่ ............/............/............</div></div>' +
      '</div>';
  }
  function buildRfqSheetHtml(rfq) {
    var rows = rfq.items.map(function (item, idx) {
      var qty = parseFloat(item.qty) || 1;
      return '<tr><td class="num">' + (idx + 1) + '</td><td>' + escapeHtml(item.code || '-') + '</td>' +
        '<td>' + escapeHtml(item.name || '-') + '</td>' +
        '<td class="num">' + qty.toLocaleString('th-TH') + '</td>' +
        '<td>' + escapeHtml(item.unit || 'หน่วย') + '</td>' +
        '<td class="num"></td><td class="num"></td></tr>';
    }).join('');
    var todayStr = fmtDate(new Date().toISOString());
    return '' +
      '<div class="ps-header">' +
        '<div><div class="ps-org">RST GROUP</div><div style="font-size:.85em;color:#555;">ใบขอราคา (Request for Quotation)</div></div>' +
        '<div><div class="ps-doc-title">ใบขอราคา</div><div class="ps-doc-sub">วันที่ออกเอกสาร ' + todayStr + '</div></div>' +
      '</div>' +
      '<div class="ps-meta">' +
        (rfq.prNumber ? ('<span><b>เลขที่ใบขอซื้ออ้างอิง:</b> ' + escapeHtml(rfq.prNumber) + '</span>') : '') +
        '<span><b>เรื่อง/โครงการ:</b> ' + escapeHtml(rfq.title || '-') + '</span>' +
        '<span><b>ผู้ติดต่อ:</b> ' + escapeHtml(rfq.preparedBy || '-') + '</span>' +
      '</div>' +
      '<div style="margin-bottom:10px;font-size:.95em;line-height:1.6;">' +
        'ทางบริษัทฯ มีความประสงค์ขอราคาสินค้าตามรายการด้านล่างนี้ กรุณาส่งใบเสนอราคากลับมายังผู้ติดต่อข้างต้น ' +
        'พร้อมระบุระยะเวลาส่งมอบ เงื่อนไขการชำระเงิน และระยะเวลารับประกัน (ถ้ามี)' +
      '</div>' +
      '<table class="ps-table"><thead><tr>' +
        '<th class="num">ลำดับ</th><th>รหัสสินค้า</th><th>ชื่อสินค้า</th><th class="num">จำนวน</th><th>หน่วยนับ</th>' +
        '<th class="num">ราคา/หน่วย (บาท)</th><th class="num">จำนวนเงิน (บาท)</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="ps-signoff" style="margin-top:26px;">' +
        '<div class="ps-signoff-col"><div class="ps-signoff-line"></div><div class="ps-signoff-role">ผู้ขอราคา</div>' +
          '<div class="ps-signoff-name">(' + escapeHtml(rfq.preparedBy || '.......................') + ')</div>' +
          '<div class="ps-signoff-date">วันที่ ' + todayStr + '</div></div>' +
        '<div class="ps-signoff-col"><div class="ps-signoff-line"></div><div class="ps-signoff-role">ผู้เสนอราคา (Supplier)</div>' +
          '<div class="ps-signoff-name">(.......................)</div>' +
          '<div class="ps-signoff-date">วันที่ ............/............/............</div></div>' +
      '</div>';
  }
  function updatePrintPageStyle() {
    var size = STATE.printOrientation === 'portrait' ? 'A4 portrait' : 'A4 landscape';
    document.getElementById('print-page-style').textContent = '@page { size: ' + size + '; margin: 8mm; }';
  }
  function applyPrintSheetClasses() {
    var sheet = document.getElementById('print-sheet');
    sheet.className = 'print-sheet print-sheet--' + STATE.printOrientation + (STATE.printDensity === 'compact' ? ' print-sheet--compact' : '');
    document.getElementById('pt-landscape').classList.toggle('print-toggle-btn--on', STATE.printOrientation === 'landscape');
    document.getElementById('pt-portrait').classList.toggle('print-toggle-btn--on', STATE.printOrientation === 'portrait');
    document.getElementById('pt-normal').classList.toggle('print-toggle-btn--on', STATE.printDensity === 'normal');
    document.getElementById('pt-compact').classList.toggle('print-toggle-btn--on', STATE.printDensity === 'compact');
  }
  function renderPrintSheet() {
    if (!STATE.current) return;
    var html = STATE.printMode === 'rfq' ? buildRfqSheetHtml(STATE.current) : buildPrintSheetHtml(STATE.current);
    document.getElementById('print-sheet').innerHTML = html;
    applyPrintSheetClasses();
    updatePrintPageStyle();
  }
  function openPrintModal(rfq, mode) {
    STATE.printMode = mode || 'comparison';
    document.getElementById('print-modal-overlay').style.display = 'flex';
    if (STATE.printMode === 'rfq') {
      renderPrintSheet();
      return;
    }
    STATE.printRecommendation = '';
    STATE.printRecommendationLoading = true;
    renderPrintSheet();
    callServer('generateRecommendation', buildRecommendationPrompt(rfq)).then(function (text) {
      STATE.printRecommendation = text;
      STATE.printRecommendationLoading = false;
      renderPrintSheet();
    }).catch(function () {
      STATE.printRecommendation = fallbackRecommendation(rfq);
      STATE.printRecommendationLoading = false;
      renderPrintSheet();
    });
  }
  function closePrintModal() { document.getElementById('print-modal-overlay').style.display = 'none'; }

  function printOnlyStylesText() {
    return "body{margin:0;font-family:'Sarabun','Noto Sans Thai',sans-serif;background:#fff;}" +
      ".print-sheet{padding:12mm 10mm;color:#111;}" +
      ".print-sheet--landscape{width:297mm;}.print-sheet--portrait{width:210mm;}" +
      ".print-sheet--compact{font-size:10.5px;}" +
      ".print-sheet--compact .ps-table th,.print-sheet--compact .ps-table td{padding:3px 5px;}" +
      ".print-sheet:not(.print-sheet--compact){font-size:12px;}" +
      ".print-sheet:not(.print-sheet--compact) .ps-table th,.print-sheet:not(.print-sheet--compact) .ps-table td{padding:4px 6px;}" +
      ".ps-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:10px;}" +
      ".ps-org{font-weight:700;font-size:1.25em;}.ps-doc-title{font-weight:700;font-size:1.15em;text-align:right;}" +
      ".ps-doc-sub{text-align:right;color:#444;font-size:.9em;}" +
      ".ps-meta{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:.95em;margin-bottom:10px;color:#222;}" +
      ".ps-refprice{display:flex;gap:18px;flex-wrap:wrap;font-size:.95em;margin-bottom:10px;padding:7px 10px;background:#F2F3EE;border:1px solid #ccc;border-radius:6px;}" +
      ".ps-item-block{margin-bottom:10px;page-break-inside:avoid;}.ps-item-title{font-weight:700;margin-bottom:3px;}" +
      "table.ps-table{width:100%;border-collapse:collapse;margin-bottom:4px;}" +
      ".ps-table th,.ps-table td{border:1px solid #999;text-align:left;vertical-align:top;word-break:break-word;}" +
      ".ps-table th{background:#EAECE6;font-weight:700;}" +
      ".ps-table td.num,.ps-table th.num{text-align:right;font-family:monospace;}" +
      ".ps-cheapest{background:#E3F3E8!important;font-weight:700;}.ps-chosen-mark{font-size:.85em;color:#215C3B;}" +
      ".ps-summary{page-break-inside:avoid;margin-top:10px;padding:9px 12px;background:#FBF6EC;border:1px solid #DDB876;border-radius:6px;}" +
      ".ps-summary-title{font-weight:700;margin-bottom:3px;}" +
      ".ps-signoff{page-break-inside:avoid;margin-top:20px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;}" +
      ".ps-signoff-col{flex:1;min-width:150px;text-align:center;font-size:.92em;}" +
      ".ps-signoff-line{border-bottom:1px dotted #333;height:34px;margin-bottom:4px;}" +
      ".ps-signoff-role{font-weight:700;margin-bottom:2px;}.ps-signoff-date{color:#555;margin-top:2px;}";
  }
  function openPrintInNewTab() {
    var sheetEl = document.getElementById('print-sheet');
    var win = window.open('', '_blank');
    if (!win) {
      alert('เบราว์เซอร์บล็อกป๊อปอัป กรุณาอนุญาต popup สำหรับเว็บนี้แล้วลองใหม่อีกครั้ง');
      return;
    }
    var pageStyleText = document.getElementById('print-page-style').textContent;
    var docTitle = STATE.printMode === 'rfq' ? 'ใบขอราคา' : 'ใบเปรียบเทียบราคา';
    win.document.open();
    win.document.write(
      '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + docTitle + '</title>' +
      '<style>' + printOnlyStylesText() + '</style><style>' + pageStyleText + '</style>' +
      '</head><body><div class="' + sheetEl.className + '" style="margin:0 auto;">' + sheetEl.innerHTML + '</div></body></html>'
    );
    win.document.close();
    setTimeout(function () { win.focus(); win.print(); }, 450);
  }
  function exportSheetXlsx() {
    if (typeof XLSX === 'undefined') { alert('โหลดไลบรารีสำหรับสร้างไฟล์ Excel ไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่'); return; }
    var rfq = STATE.current;
    if (STATE.printMode === 'rfq') {
      var rfqRows = [];
      rfqRows.push(['ใบขอราคา: ' + (rfq.title || '-')]);
      rfqRows.push(['เลขที่ใบขอซื้ออ้างอิง', rfq.prNumber || '-', 'ผู้ติดต่อ', rfq.preparedBy || '-']);
      rfqRows.push([]);
      rfqRows.push(['ลำดับ', 'รหัสสินค้า', 'ชื่อสินค้า', 'จำนวน', 'หน่วยนับ', 'ราคา/หน่วย (บาท)', 'จำนวนเงิน (บาท)']);
      rfq.items.forEach(function (item, idx) {
        rfqRows.push([idx + 1, item.code || '', item.name || '', parseFloat(item.qty) || 1, item.unit || 'หน่วย', '', '']);
      });
      var rfqWs = XLSX.utils.aoa_to_sheet(rfqRows);
      rfqWs['!cols'] = [{ wch: 6 }, { wch: 16 }, { wch: 32 }, { wch: 10 }, { wch: 10 }, { wch: 16 }, { wch: 16 }];
      var rfqWb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(rfqWb, rfqWs, 'ใบขอราคา');
      XLSX.writeFile(rfqWb, 'RFQ_' + (rfq.title || rfq.id).replace(/[\\/:*?"<>|]/g, '_') + '.xlsx');
      return;
    }
    var rows = [];
    rows.push(['ใบขอซื้อ: ' + (rfq.title || '-')]);
    rows.push(['เลขที่ใบขอซื้อ', rfq.prNumber || '-', 'ผู้จัดทำ', rfq.preparedBy || '-', 'วันที่จัดทำ', fmtDate(rfq.createdAt)]);
    if (rfq.referencePrice) rows.push(['ราคากลาง (บาท)', rfq.referencePrice]);
    rows.push([]);
    rfq.items.forEach(function (item, idx) {
      var qty = parseFloat(item.qty) || 1;
      var t = itemTotals(item);
      rows.push([(idx + 1) + '. ' + (item.code ? '[' + item.code + '] ' : '') + (item.name || '-') + ' (' + qty + ' ' + (item.unit || 'หน่วย') + ')']);
      rows.push(['ผู้ขาย','ราคา/หน่วย (บาท)','รวม VAT แล้ว','ส่งมอบ (วัน)','รับประกัน (ด.)','เงื่อนไขชำระเงิน','ค่าจัดส่ง (บาท)','ยอดรวม (บาท)','หมายเหตุ']);
      item.vendors.forEach(function (v) {
        var total = vendorLineTotal(item, v);
        rows.push([
          v.vendorName || '-', v.unitPrice || '', v.vatIncluded ? 'ใช่' : 'ไม่ใช่',
          v.leadTimeDays || '', v.warrantyMonths || '', v.paymentTerms || '',
          v.shippingCost || 0, isNaN(total) ? '' : Number(total.toFixed(2)),
          (t.minId === v.id ? 'ถูกที่สุด' : '')
        ]);
      });
      rows.push([]);
    });
    var vTotals = vendorGrandTotals(rfq);
    if (vTotals.length) {
      rows.push(['สรุปยอดรวมต่อผู้ขาย']);
      rows.push(['ผู้ขาย', 'จำนวนรายการที่เสนอราคา', 'จากทั้งหมด', 'ยอดรวม (บาท)']);
      vTotals.forEach(function (vt) { rows.push([vt.vendorName, vt.count, rfq.items.length, Number(vt.total.toFixed(2))]); });
      rows.push([]);
    }
    if (STATE.printRecommendation) { rows.push(['ข้อเสนอแนะ']); rows.push([STATE.printRecommendation]); rows.push([]); }
    rows.push(['ผู้จัดทำ', rfq.preparedBy || '', '', 'ผู้ตรวจสอบ', '', '', 'ผู้อนุมัติ', '']);

    var ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 26 }, { wch: 16 }, { wch: 14 }, { wch: 12 }, { wch: 12 }, { wch: 22 }, { wch: 14 }, { wch: 14 }, { wch: 12 }];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'เปรียบเทียบราคา');
    var filename = 'QuoteCompare_' + (rfq.title || rfq.id).replace(/[\\/:*?"<>|]/g, '_') + '.xlsx';
    XLSX.writeFile(wb, filename);
  }
  function wirePrintModal() {
    document.getElementById('pt-landscape').addEventListener('click', function () { STATE.printOrientation = 'landscape'; renderPrintSheet(); });
    document.getElementById('pt-portrait').addEventListener('click', function () { STATE.printOrientation = 'portrait'; renderPrintSheet(); });
    document.getElementById('pt-normal').addEventListener('click', function () { STATE.printDensity = 'normal'; renderPrintSheet(); });
    document.getElementById('pt-compact').addEventListener('click', function () { STATE.printDensity = 'compact'; renderPrintSheet(); });
    document.getElementById('pt-close').addEventListener('click', closePrintModal);
    document.getElementById('print-modal-overlay').addEventListener('click', function (e) {
      if (e.target.id === 'print-modal-overlay') closePrintModal();
    });
    document.getElementById('pt-print-now').addEventListener('click', function () { window.print(); });
    document.getElementById('pt-print-newtab').addEventListener('click', openPrintInNewTab);
    document.getElementById('pt-export-xlsx').addEventListener('click', exportSheetXlsx);
  }
  wirePrintModal();

  /* ============================= INIT ============================= */
  refreshIndex().then(render);
  </script>
</body>
