function findSavedPlan(id){ return state.productionPlans.find(function(pl){ return pl.id===id; }); }
function planIsDirty(){
  if(!mrpPlanDraft) return false;
  const saved = findSavedPlan(mrpPlanDraft.id);
  if(!saved) return mrpPlanDraft.lines.length>0;
  return JSON.stringify(saved.lines)!==JSON.stringify(mrpPlanDraft.lines);
}
function saveProductionPlan(){
  if(!mrpPlanDraft || !mrpPlanDraft.lines.length) return null;
  const existing = findSavedPlan(mrpPlanDraft.id);
  const record = { id: mrpPlanDraft.id, lines: mrpPlanDraft.lines.map(function(l){ return {productId:l.productId, targetQty:l.targetQty, lotNo:l.lotNo, salesOrderNo:l.salesOrderNo||'', deliveryDate:l.deliveryDate||''}; }), createdDate: existing? existing.createdDate : TODAY, savedAt: TODAY };
  if(existing){ const idx = state.productionPlans.indexOf(existing); state.productionPlans[idx] = record; }
  else state.productionPlans.push(record);

function loadProductionPlan(id){
  const pl = findSavedPlan(id);
  if(!pl) return;
  mrpPlanDraft = { id: pl.id, lines: pl.lines.map(function(l){ return {productId:l.productId, targetQty:l.targetQty, lotNo:l.lotNo, salesOrderNo:l.salesOrderNo||'', deliveryDate:l.deliveryDate||''}; }) };
}
// Sums each line's own BOM requirement (by material) across every line in the plan FIRST, then nets
// the COMBINED total against committed/pending supply once — a material shared by two different
// product lines in the same plan is requested only once, correctly combined (not double-counted).
function computePlanMaterialNeeds(lines){
  const neededByMat = {};
  (lines||[]).forEach(function(ln){
    const p = productById(ln.productId);
    if(!p || !Array.isArray(p.bom)) return;
    p.bom.forEach(function(c){
      const mat = materialById(c.materialId);
      if(!mat) return;
      neededByMat[mat.id] = (neededByMat[mat.id]||0) + bomLineRequirement(p, c, ln.targetQty||0);
    });
  });
  return Object.keys(neededByMat).map(function(matId){
    const mat = materialById(matId);
    const required = neededByMat[matId];
    const reserved = committedDemandForMaterial(matId);
    const incoming = pendingSupplyForMaterial(matId);
    const availableForNewPlan = Math.max(0, (mat.stock||0)-reserved+incoming);
    const shortage = Math.max(0, required-availableForNewPlan);
    // Round K: suggest exactly the shortage — no extra safety-stock padding (e.g. stock=0, need=5 → suggest 5).
    const suggestPO = shortage>0? Math.ceil(shortage) : 0;
    return { mat:mat, required:required, shortage:shortage, suggestPO:suggestPO, reserved:reserved, incoming:incoming, availableForNewPlan:availableForNewPlan };
  }).sort(function(a,b){ return a.mat.id<b.mat.id? -1 : (a.mat.id>b.mat.id? 1 : 0); });
}
function planEstCost(lines){
  return (lines||[]).reduce(function(s, ln){ const p=productById(ln.productId); return p? s+marginInfo(p).cost*(ln.targetQty||0) : s; }, 0);
}

function committedDemandForMaterial(materialId){
  // Materials already required by OTHER open work orders that have not yet had stock withdrawn (w.started===false).
  // These are "reserved" against current stock even though they haven't been deducted yet.
  return state.workOrders.filter(function(w){ return !w.started && w.status!=='เสร็จสิ้น'; }).reduce(function(sum, w){
    const wp = productById(w.productId);
    if(!wp || !Array.isArray(wp.bom)) return sum;
    const line = wp.bom.find(function(c){ return c.materialId===materialId; });
    if(!line) return sum;
    return sum + bomLineRequirement(wp, line, w.targetQty);
  }, 0);
}
function pendingSupplyForMaterial(materialId){
  // Quantities already requested (draft cart + non-rejected PRs) count as incoming supply for planning purposes.
  const inDraft = ui.prDraft.filter(function(d){ return d.materialId===materialId; }).reduce(function(s,d){ return s+(d.qty||0); },0);
  const inPr = state.purchaseRequests.filter(function(r){ return r.status==='รออนุมัติ'||r.status==='อนุมัติแล้ว'; }).reduce(function(sum, r){
    const it = r.items.find(function(x){ return x.materialId===materialId; });
    return sum + (it? (it.qty||0) : 0);
  }, 0);
  return inDraft+inPr;
}
function computeMrpRows(productId, qty){
  const p = productById(productId);
  if(!p || !Array.isArray(p.bom)) return [];
  return p.bom.filter(function(c){ return materialById(c.materialId); }).map(function(c){
    const mat = materialById(c.materialId);
    const required = bomLineRequirement(p, c, qty);
    const reserved = committedDemandForMaterial(mat.id);
    const incoming = pendingSupplyForMaterial(mat.id);
    const availableForNewPlan = Math.max(0, (mat.stock||0)-reserved+incoming);
    const shortage = Math.max(0, required-availableForNewPlan);
    // Round K: suggest exactly the shortage — no extra safety-stock padding (e.g. stock=0, need=5 → suggest 5).
    const suggestPO = shortage>0? Math.ceil(shortage) : 0;
    return { mat:mat, required:required, shortage:shortage, suggestPO:suggestPO, reserved:reserved, incoming:incoming, availableForNewPlan:availableForNewPlan };
  });
}

// Per-PR Excel download — real .xlsx (SheetJS), same writeFile pattern as the BOM/purchase-history
// template downloads, replacing the removed bulk "+ บันทึก PR เข้า Ecount" action.
// Round J: reshaped to match Template_PR.xlsx's own 23-column "1_สร้างใบขอซื้อ" layout exactly —
// same headers/row-shape as ecountPrRows() already builds for the ECOUNT import file at issue-time,
// so both exports (issue-time and this per-row list-tab download) stay identical to one template.
function exportPrExcel(pr){
  if(!xlsxReady()) return;
  const rows = ecountPrRows(pr, pr.ecountMeta||{});
  const ws = XLSX.utils.aoa_to_sheet([ECOUNT_PR_HEADERS].concat(rows));
  ws['!cols'] = ECOUNT_PR_HEADERS.map(function(){ return {wch:16}; });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, pr.id.slice(0,31));
  XLSX.writeFile(wb, pr.id+'.xlsx');
}

function roundUpToLot(p, qty){
  const lot = productLotSize(p);
  if(lot<=1) return qty;
  return Math.ceil((qty||0)/lot)*lot;
}
// Central WO-creation path — used by both the WO page's own "+ สร้างใบสั่งผลิต" form and the MRP
// page's "→ สร้างใบสั่งผลิต" button. When the product's formula is lot-based (lotSize>1), the
// requested quantity is always forced up to the nearest exact multiple of the lot size before the
// WO is saved — moving warehouses/formulas never partially fulfils a lot's worth of material.
function createWorkOrder(opts){
  const p = productById(opts.productId);
  const requestedQty = opts.targetQty||0;
  const finalQty = p? roundUpToLot(p, requestedQty) : requestedQty;
  const id = 'WO-2026-'+String(state.nextWoSeq++).padStart(4,'0');
  const wo = {
    id:id, productId:opts.productId, targetQty:finalQty,
    lotNo: opts.lotNo||('LOT-'+TODAY),
    status:'รอเริ่มผลิต', started:false, created:opts.created||TODAY, due: opts.due||TODAY
  };
  state.workOrders.push(wo);
  return { wo:wo, adjusted: finalQty!==requestedQty, requestedQty:requestedQty };
}

}

function routingTable(p, targetQty){

  steps.forEach(function(s){
    const lines = p.bom.filter(function(c){ return (c.steps||[]).indexOf(s)!==-1; });
    const partsTxt = lines.map(function(c){
      const mat = materialById(c.materialId);
      const need = bomLineRequirement(p, c, targetQty);
      return esc(mat.name)+' ('+fmtNum(need)+' '+mat.unit+')';
    }).join('<br>');
    rows += '<tr><td style="font-weight:700">'+s+'</td><td>'+partsTxt+'</td><td class="mono"></td></tr>';
  });
  return '<table class="print-table"><thead><tr><th>ขั้นตอนผลิต</th><th>วัตถุดิบ/ชิ้นส่วนที่ต้องเบิก</th><th>ผู้เบิก/เวลา</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function subWoId(w, step){ return w.id+'-'+step; }
function subWoMaterialDate(w, step, materialId){
  if(w.matDates && w.matDates[step] && w.matDates[step][materialId]) return w.matDates[step][materialId];
  return w.due;
}
function setSubWoMaterialDate(w, step, materialId, val){
  if(!w.matDates) w.matDates = {};

  w.matDates[step][materialId] = val;

function subWoNote(w, step){ return (w.subWoNotes && w.subWoNotes[step]) || ''; }
function setSubWoNote(w, step, val){ if(!w.subWoNotes) w.subWoNotes = {}; w.subWoNotes[step] = val; }
function subWoOperator(w, step){ return (w.subWoOperator && w.subWoOperator[step]) || ''; }
function setSubWoOperator(w, step, val){ if(!w.subWoOperator) w.subWoOperator = {}; w.subWoOperator[step] = val; }
function subWoSupervisor(w, step){ return (w.subWoSupervisor && w.subWoSupervisor[step]) || ''; }
function setSubWoSupervisor(w, step, val){ if(!w.subWoSupervisor) w.subWoSupervisor = {}; w.subWoSupervisor[step] = val; }
// ---- Extra sub-WO-step "linked sub-order" info (Q2: an extra step may pick a WIP product code and
// carry its own target qty + needed date, functioning as its own mini production order separate
// from the parent WO's main product) ----
function subWoStepInfo(w, step){ return (w.extraStepInfo && w.extraStepInfo[step]) || null; }
function setSubWoStepInfo(w, step, info){ if(!w.extraStepInfo) w.extraStepInfo = {}; w.extraStepInfo[step] = info; }
// Resolves what a sub-WO-step actually needs: for a normal formula step, the parent product's own
// BOM lines tagged with that step (against the WO's targetQty). For an extra step linked to a WIP
// product code (subWoStepInfo), the LINKED product's own full BOM (against that step's own target
// qty) — since the linked item is treated as its own separate sub-production order.
function subWoStepContext(w, step){
  const info = subWoStepInfo(w, step);
  if(info && info.wipProductId){
    const wp = productById(info.wipProductId);
    if(wp){
      const lines = wp.bom.map(function(c){ return { mat: materialById(c.materialId), need: bomLineRequirement(wp, c, info.targetQty||0) }; }).filter(function(l){ return !!l.mat; });
      return { product: wp, targetQty: info.targetQty||0, neededDate: info.neededDate||w.due, lines: lines, isExtra: true };
    }
  }
  const p = productById(w.productId);
  const lines = p.bom.filter(function(c){ return (c.steps||[]).indexOf(step)!==-1; }).map(function(c){ return { mat: materialById(c.materialId), need: bomLineRequirement(p, c, w.targetQty) }; });
  return { product: p, targetQty: w.targetQty, neededDate: w.due, lines: lines, isExtra: false };
}
// ---- Per-sub-WO-step material issue (Q1: material withdrawal moves from one whole-WO deduction to
// N independent per-step events, each trackable/printable/ECOUNT-syncable on its own) ----
// Round K: derives a per-step material-issue status from the ACTUAL lines vs what's been physically
// deducted so far (w.issuedMaterialIds), instead of the old plain issued/not-issued boolean — a
// step's issue slip can now be saved with only SOME lines selected (partial withdrawal) when stock is
// short on the rest. 'none' = nothing withdrawn yet, 'partial' = some but not all lines withdrawn,
// 'full' = every line this step needs has been withdrawn (by this step, or shared with another step).
function subWoIssueStatus(w, step){
  const ctx = subWoStepContext(w, step);
  if(!ctx.lines.length) return 'none';
  const issuedIds = w.issuedMaterialIds || [];
  const issuedCount = ctx.lines.filter(function(l){ return l.mat && issuedIds.indexOf(l.mat.id)!==-1; }).length;
  if(issuedCount<=0) return 'none';
  return issuedCount>=ctx.lines.length ? 'full' : 'partial';
}
function subWoMaterialIssued(w, step){ return subWoIssueStatus(w, step)==='full'; }
// Deducts stock for this step's material lines and records the step as "issued". Materials shared
// across multiple steps of the SAME WO (a BOM line tagged with several steps) are only ever
// physically deducted once — tracked via w.issuedMaterialIds — so issuing step A then step B never
// double-counts a material both steps reference; step B's own status still becomes "issued".
// Round K: `selectedMatIds`, when passed, restricts this call to only that subset of the step's
// material lines (partial withdrawal — e.g. some lines are short on stock and left for later).
// Omitting it (the bulk "เบิกวัตถุดิบ" path) keeps the old behaviour of issuing everything still
// pending for this step.
function issueSubWoMaterial(w, step, selectedMatIds){
  if(subWoMaterialIssued(w, step)) return;
  const ctx = subWoStepContext(w, step);
  if(!w.issuedMaterialIds) w.issuedMaterialIds = [];
  ctx.lines.forEach(function(l){
    if(!l.mat) return;
    if(w.issuedMaterialIds.indexOf(l.mat.id)!==-1) return;
    if(selectedMatIds && selectedMatIds.indexOf(l.mat.id)===-1) return;
    l.mat.stock = Math.max(0, l.mat.stock-l.need);
    state.stockLog.push({date:TODAY, materialId:l.mat.id, type:'OUT', qty:l.need, ref:subWoId(w,step)});
    w.issuedMaterialIds.push(l.mat.id);
  });
  if(!w.stepIssue) w.stepIssue = {};
  w.stepIssue[step] = {issued:true, issuedAt:TODAY, ecountSynced:false};
  if(!w.started){ w.started = true; w.status='กำลังผลิต'; }
}
/* Header row for the ECOUNT material-issue import format, following the same shape convention as

const ECOUNT_ISSUE_HEADERS = ['วันที่','เลขที่ใบสั่งผลิตย่อย','เลขที่ใบสั่งผลิต','ขั้นตอนผลิต','รหัสวัตถุดิบ','ชื่อวัตถุดิบ','จำนวนที่เบิก','หน่วย'];
function ecountIssueRows(w, step, ctx){

// Same apiConfigured()-attempt pattern as the PR "ออก PR" flow (issuePrBtn handler): tries a live
// push to the Apps Script backend, but ALWAYS marks the step's local "saved" state regardless of
// network outcome — the physical stock deduction and step status already happened synchronously in
// issueSubWoMaterial, so a user is never blocked from printing/continuing just because ECOUNT is
// unreachable. ecountSynced only reflects whether the background push itself succeeded.
function pushMaterialIssueToEcount(w, step){
  const ctx = subWoStepContext(w, step);
  const rows = ecountIssueRows(w, step, ctx);
  function markSynced(msg, kind){
    if(w.stepIssue && w.stepIssue[step]) w.stepIssue[step].ecountSynced = true;
    saveState();
    toast(msg, kind||'good');
    render();
  }
  if(apiConfigured()){
    fetch(config.sheetApiUrl, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'ecountMaterialIssue', woId:w.id, step:step, subWoId:subWoId(w,step), headers:ECOUNT_ISSUE_HEADERS, rows:rows}) })
      .then(function(r){ return r.json(); })
      .then(function(res){ markSynced(res.ok? 'บันทึกใบเบิกจ่ายวัตถุดิบ '+subWoId(w,step)+' และส่งข้อมูลเข้า ECOUNT แล้ว' : 'บันทึกใบเบิกจ่ายวัตถุดิบแล้ว แต่ ECOUNT แจ้งว่า: '+res.message, res.ok?'good':'warning'); })
      .catch(function(err){ markSynced('บันทึกใบเบิกจ่ายวัตถุดิบแล้ว แต่เชื่อมต่อ ECOUNT ไม่สำเร็จ: '+err, 'warning'); });
  } else {
    markSynced('บันทึกใบเบิกจ่ายวัตถุดิบ '+subWoId(w,step)+' แล้ว (ยังไม่ได้เชื่อมต่อ ECOUNT — ไปที่ตั้งค่า > การเชื่อมต่อ เพื่อเชื่อมจริง)', 'good');
  }
}

        ? '<span class="pill warning" style="font-size:10px;margin-left:6px">⚠ เบิกบางส่วน</span> <button type="button" class="btn-link mono" data-act="export-sub-wo-issue" data-wo="'+w.id+'" data-step="'+esc(s)+'" style="background:none;border:none;padding:0;color:var(--accent);font-size:10px;cursor:pointer;text-decoration:underline">⇩ Excel ใบจ่าย</button>'
        : '<span class="pill neutral" style="font-size:10px;margin-left:6px">ยังไม่บันทึกใบจ่าย</span>';
    const extraTag = ctx.isExtra? '<div class="helptext">🔗 '+esc(ctx.product.id)+' — '+esc(ctx.product.name)+'</div>' : '';
    // vertical-align:top so the sub-WO number sits at the TOP of its merged (rowspan) cell — the
    // table's default td vertical-align is "middle", which would otherwise center it in the
    // middle of the span whenever a step has more than one material line.
    const stepCell = '<td rowspan="'+rowspan+'" style="vertical-align:top"><button type="button" class="btn-link mono" data-act="view-sub-wo" data-step="'+esc(s)+'" style="background:none;border:none;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline">'+esc(subWoId(w,s))+'</button>'+withdrawBtn+'<div style="margin-top:4px">'+issuedBadge+'</div><div class="helptext">'+esc(s)+'</div>'+extraTag+'</td>';
    // หัวหน้างาน replaces the old redundant "เปิด" button here (the sub-WO id above is already the
    // click-to-open link) — sourced from the same operators roster configured at ตั้งค่า > ผู้ปฏิบัติงาน.
    const supOptions = '<option value="">— เลือกหัวหน้างาน —</option>'+state.operators.map(function(o){ return '<option value="'+esc(o)+'"'+(subWoSupervisor(w,s)===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('');
    const supervisorCell = editable
      ? '<div style="margin-bottom:6px"><label class="helptext" style="display:block;margin-bottom:2px">หัวหน้างาน</label><select class="subwo-supervisor-select" data-step="'+esc(s)+'" style="font-size:11.5px;padding:3px 4px">'+supOptions+'</select></div>'
      : '<div class="helptext" style="margin-bottom:6px">หัวหน้างาน: '+(subWoSupervisor(w,s)? esc(subWoSupervisor(w,s)) : '— ยังไม่ระบุ —')+'</div>';
    // vertical-align:top on all three rowspan cells (ผลิตแล้ว/เป้าหมาย/รายละเอียด+ปุ่ม) so a
    // multi-material-line step keeps everything lined up with the FIRST row instead of centering
    // in the middle of the merged span — same fix already applied to stepCell above.
    const tailCells = '<td class="num mono" rowspan="'+rowspan+'" style="vertical-align:top">'+fmtNum(done)+'</td><td class="num mono" rowspan="'+rowspan+'" style="vertical-align:top">'+fmtNum(ctx.targetQty)+'</td>'+
      '<td rowspan="'+rowspan+'" style="vertical-align:top">'+supervisorCell+'<div class="btn-row"><button type="button" class="btn sm" data-act="print-sub-wo" data-wo="'+w.id+'" data-step="'+esc(s)+'">🖨 ใบสั่งผลิต</button></div></td>';
    if(!lines.length){
      rows += '<tr>'+stepCell+'<td class="mono">—</td><td class="helptext">— ไม่มีวัตถุดิบเฉพาะขั้นตอนนี้ —</td><td class="num mono">—</td>'+tailCells+'</tr>';
    } else {
      lines.forEach(function(l, li){
        rows += '<tr>'+(li===0?stepCell:'')+
          '<td class="mono">'+esc(l.mat.id)+'</td><td>'+esc(l.mat.name)+'</td><td class="num mono">'+fmtNum(l.need)+' '+esc(l.mat.unit)+'</td>'+
          (li===0?tailCells:'')+'</tr>';
      });
    }
  });
  return rows;
}
function renderWoDetail(w){

  const card = el('<div class="card" style="margin-top:12px"></div>');

  infoGrid.innerHTML = costLine('สินค้า', esc(p.name)) + costLine('Lot No.', esc(w.lotNo)) +
    costLine('จำนวนเป้าหมาย', fmtNum(w.targetQty)+' '+p.unit) + costLine('กำหนดส่งมอบ', fmtDateThai(w.due));
  card.appendChild(infoGrid);
  card.appendChild(el('<div class="section-title" style="display:flex;justify-content:space-between;align-items:center">ใบสั่งงานย่อยตามขั้นตอนผลิต'+(editable? '<button type="button" class="btn sm" id="addSubWoStepBtn">+ เพิ่มใบสั่งงานย่อย-ขั้นตอน</button>' : '')+'</div>'));
  const tw = document.createElement('div'); tw.className='table-wrap';
  tw.innerHTML = '<table><thead><tr><th>เลขที่ใบสั่งผลิตย่อย-ขั้นตอน</th><th>รหัสวัตถุดิบ</th><th>วัตถุดิบที่ต้องเบิก</th><th class="th-num">จำนวนเบิก</th><th class="th-num">ผลิตแล้ว</th><th class="th-num">เป้าหมาย</th><th></th></tr></thead><tbody>'+subWoListRows(w)+'</tbody></table>';
  card.appendChild(tw);
  const anyStepUnissued = woActiveSteps(w).some(function(s){ return subWoStepContext(w, s).lines.length && !subWoMaterialIssued(w, s); });
  card.appendChild(el('<div class="btn-row" style="margin-top:16px">'+
    '<button class="btn" id="printWoDetailBtn">🖨 พิมพ์ / PDF</button>'+
    '<button class="btn" id="printReqWoDetailBtn">🖨 พิมพ์ใบเบิกวัตถุดิบ</button>'+
    (editable && anyStepUnissued? '<button class="btn primary" id="requisitionWoDetailBtn">📦 เบิกวัตถุดิบ (ทุกขั้นตอนที่ยังไม่เบิก)</button>' : '')+
  '</div>'));
  wrap.appendChild(card);

  wrap.addEventListener('click', function(e){
    if(e.target.id==='woBackBtn'){ ui.woDetailId=null; ui.subWoStep=null; render(); return; }
    if(e.target.id==='printWoDetailBtn'){ printWorkOrder(w); return; }
    if(e.target.id==='printReqWoDetailBtn'){ printMaterialRequisition(w); return; }
    if(e.target.id==='requisitionWoDetailBtn'){ openMaterialRequisitionModal(w); return; }
    if(e.target.id==='addSubWoStepBtn'){ openAddSubWoStepModal(w); return; }
    const subBtn = e.target.closest('[data-act="view-sub-wo"]');
    if(subBtn){ ui.subWoStep = subBtn.dataset.step; render(); return; }
    const issueInlineBtn = e.target.closest('[data-act="issue-sub-wo-inline"]');
    if(issueInlineBtn){ openSaveSubWoIssueModal(w, issueInlineBtn.dataset.step); return; }
    const printSubBtn = e.target.closest('[data-act="print-sub-wo"]');
    if(printSubBtn){ printSubWorkOrder(woById(printSubBtn.dataset.wo), printSubBtn.dataset.step); return; }
    const exportIssueBtn = e.target.closest('[data-act="export-sub-wo-issue"]');
    if(exportIssueBtn){ exportSubWoIssueExcel(woById(exportIssueBtn.dataset.wo), exportIssueBtn.dataset.step); return; }
  });
  wrap.addEventListener('change', function(e){
    if(e.target.classList.contains('subwo-supervisor-select')){
      setSubWoSupervisor(w, e.target.dataset.step, e.target.value);
      saveState();
      return;
    }
  });
  return wrap;
}
function openAddSubWoStepModal(w){
  const current = woActiveSteps(w);
  const avail = state.productionSteps.filter(function(s){ return current.indexOf(s)===-1; });
  if(!avail.length) return toast('ไม่มีขั้นตอนการผลิตอื่นให้เพิ่มแล้ว — ใช้ครบทุกขั้นตอนในระบบแล้ว','warning');
  const wipOptions = state.products.filter(function(p){ return p.wipItem; });
  openModal('เพิ่มใบสั่งงานย่อย-ขั้นตอน — '+w.id,
    '<div class="form-grid">'+
    '<div class="field" style="grid-column:1/-1"><label>เลือกขั้นตอนการผลิตที่จะเพิ่ม</label><select id="addSubWoStepSel">'+avail.map(function(s){ return '<option value="'+esc(s)+'">'+esc(s)+'</option>'; }).join('')+'</select></div>'+
    '<div class="field" style="grid-column:1/-1"><label>รหัสสินค้า (จากคลังสินค้าระหว่างทำ) — เลือกถ้าขั้นตอนนี้มีเป้าหมายผลิตของตัวเอง</label><select id="addSubWoStepWip"><option value="">— ไม่ผูกกับรหัสใด (เป็นข้อมูลอ้างอิงเฉยๆ) —</option>'+wipOptions.map(function(p){ return '<option value="'+p.id+'">'+esc(p.id)+' — '+esc(p.name)+'</option>'; }).join('')+'</select></div>'+
    field('จำนวนที่สั่งผลิต (เป้าหมายของขั้นตอนนี้)','addSubWoStepQty','number',0)+
    field('วันที่ต้องการ','addSubWoStepDate','date',w.due)+
    '</div>'+
    '<p class="helptext" style="margin-top:8px">ถ้าเลือกรหัสสินค้าจากคลังสินค้าระหว่างทำ ขั้นตอนนี้จะกลายเป็นเหมือนใบสั่งผลิตย่อยของตัวเอง มีเป้าหมาย/กำหนดส่งมอบแยกจากสินค้าหลักของ '+w.id+' และวัตถุดิบที่ต้องเบิกจะดึงจากสูตรการผลิตของรหัสนั้นแทน ถ้าไม่เลือก ขั้นตอนนี้จะไม่มีวัตถุดิบผูกอยู่และใช้จำนวนเป้าหมายเดียวกับ '+w.id+' — ต้องการเพิ่มรหัสใหม่? ไปที่หน้า "คลังสินค้าระหว่างทำ" ก่อน แล้วกลับมาเลือกที่นี่ได้</p>',
    '<button class="btn ghost" id="modalCancel">ยกเลิก</button><button class="btn primary" id="confirmAddSubWoStepBtn">+ เพิ่มขั้นตอน</button>'
  );
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('confirmAddSubWoStepBtn').addEventListener('click', function(){
    const step = document.getElementById('addSubWoStepSel').value;
    if(!step) return;
    const wipId = document.getElementById('addSubWoStepWip').value;
    const qty = parseFloat(document.getElementById('addSubWoStepQty').value)||0;
    const neededDate = document.getElementById('addSubWoStepDate').value || w.due;
    if(wipId && qty<=0) return toast('กรุณาระบุจำนวนที่สั่งผลิตมากกว่า 0 เมื่อเลือกรหัสสินค้า','critical');
    if(!w.extraSteps) w.extraSteps=[];
    w.extraSteps.push(step);
    if(wipId) setSubWoStepInfo(w, step, { wipProductId:wipId, targetQty:qty, neededDate:neededDate });
    saveState(); closeModal(); render();
    toast('เพิ่มใบสั่งงานย่อย-ขั้นตอน "'+step+'" เข้า '+w.id+' แล้ว'+(wipId? ' — ผูกกับรหัส '+wipId+' เป้าหมาย '+fmtNum(qty) : ''),'good');
  });
}
function renderSubWoDetail(w, step){

  const p = ctx.product;
  const editable = canEdit('wo');
  const subId = subWoId(w, step);
  const done = producedByStep(w.id, step);

  wrap.appendChild(el('<button class="btn ghost sm" id="subWoBackBtn">← กลับไปที่ '+esc(w.id)+'</button>'));

  card.appendChild(el('<div class="card-head"><div><h2>ใบสั่งผลิตย่อย '+esc(subId)+'</h2><p>'+esc(p.name)+' — '+esc(step)+(ctx.isExtra? ' <span class="pill neutral" style="font-size:11px">🔗 มีเป้าหมาย/กำหนดส่งมอบของตัวเอง</span>' : '')+'</p></div></div>'));

  infoGrid.innerHTML = costLine('อ้างอิงใบสั่งผลิต', esc(w.id)) + costLine('ขั้นตอนผลิต', esc(step)) +
    costLine('จำนวนเป้าหมาย', fmtNum(ctx.targetQty)+' '+p.unit) +
    costLine('ผลิตแล้ว (ขั้นตอนนี้)', fmtNum(done)+' '+p.unit+(defect? ' (ของเสีย '+fmtNum(defect)+')':''));
  if(ctx.isExtra) infoGrid.innerHTML += costLine('วันที่ต้องการ (ของขั้นตอนนี้)', fmtDateThai(ctx.neededDate));
  card.appendChild(infoGrid);
  const opOptions = '<option value="">— เลือกผู้ปฏิบัติงาน —</option>'+state.operators.map(function(o){ return '<option value="'+esc(o)+'"'+(subWoOperator(w,step)===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('');
  const assignGrid = el('<div class="form-grid" style="margin-bottom:14px"></div>');
  assignGrid.innerHTML =
    '<div class="field" style="grid-column:1/-1"><label>รายละเอียดคำสั่งงาน</label>'+
      (editable? '<textarea id="subWoNoteInput" rows="2" placeholder="พิมพ์รายละเอียด/หมายเหตุคำสั่งงานสำหรับขั้นตอนนี้">'+esc(subWoNote(w,step))+'</textarea>'
        : '<p class="helptext">'+(subWoNote(w,step)? esc(subWoNote(w,step)) : '— ไม่มีรายละเอียดเพิ่มเติม —')+'</p>')+
    '</div>'+
    '<div class="field"><label>ผู้ปฏิบัติงาน</label>'+
      (editable? '<select id="subWoOperatorSelect">'+opOptions+'</select>'
        : '<p class="helptext">'+(subWoOperator(w,step)? esc(subWoOperator(w,step)) : '— ยังไม่ระบุ —')+'</p>')+
    '</div>';
  card.appendChild(assignGrid);
  const lines = ctx.lines;
  const tw = document.createElement('div'); tw.className='table-wrap';
  let rows='';
  lines.forEach(function(l, i){
    const dateVal = subWoMaterialDate(w, step, l.mat.id);
    rows += '<tr><td class="num mono">'+(i+1)+'</td><td class="mono">'+esc(l.mat.id)+'</td><td>'+esc(l.mat.name)+'</td>'+
      '<td class="num mono">'+fmtNum(l.need)+' '+l.mat.unit+'</td>'+
      '<td>'+(editable? '<input type="date" class="subwo-date-input" data-mat="'+esc(l.mat.id)+'" value="'+esc(dateVal)+'"/>' : fmtDateThai(dateVal))+'</td></tr>';
  });
  if(!rows) rows = '<tr><td colspan="5" class="helptext" style="padding:16px">— ไม่มีวัตถุดิบเฉพาะขั้นตอนนี้ —</td></tr>';
  tw.innerHTML = '<table><thead><tr><th class="th-num">ลำดับ</th><th>รหัส</th><th>รายการ</th><th class="th-num">จำนวนที่เบิก</th><th>วันที่ต้องการ</th></tr></thead><tbody>'+rows+'</tbody></table>';
  card.appendChild(tw);
  let actionsHtml = '<button class="btn" id="printSubWoDetailBtn">🖨 พิมพ์ใบสั่งผลิต</button>';
  if(lines.length){
    // Round K: a 'partial' step gets BOTH buttons — export what's already been withdrawn, and
    // re-open the modal to issue the lines still pending (short stock / not yet selected).
    if(issueStatus!=='none') actionsHtml += '<button class="btn" id="exportSubWoIssueDetailBtn">⇩ Excel ใบจ่ายสินค้า</button>';
    if(issueStatus!=='full' && editable) actionsHtml += '<button class="btn primary" id="saveSubWoIssueBtn">🧾 '+(issueStatus==='partial'?'เบิกเพิ่มเติม':'บันทึกใบจ่าย')+'</button>';

  card.appendChild(el('<div class="btn-row" style="margin-top:16px">'+actionsHtml+'</div>'));
  if(lines.length){
    if(issueStatus==='full'){
      const info = w.stepIssue[step];
      card.appendChild(el('<p class="pill good" style="margin-top:10px;display:inline-flex;align-items:center;gap:4px">✓ บันทึกใบจ่ายแล้ว เมื่อ '+fmtDateThai(info.issuedAt)+(info.ecountSynced? ' — ส่งข้อมูลเข้า ECOUNT แล้ว' : ' — กำลังส่งข้อมูลเข้า ECOUNT...')+'</p>'));
    } else if(issueStatus==='partial'){
      const info = w.stepIssue[step];
      card.appendChild(el('<p class="pill warning" style="margin-top:10px;display:inline-flex;align-items:center;gap:4px">⚠ เบิกบางส่วนแล้ว เมื่อ '+fmtDateThai(info.issuedAt)+' — ยังมีวัตถุดิบบางรายการค้างเบิก กดปุ่ม "เบิกเพิ่มเติม" เพื่อเบิกส่วนที่เหลือ</p>'));
    } else if(editable){
      card.appendChild(el('<p class="helptext" style="margin-top:8px;color:var(--warning)">⚠ ยังไม่ได้บันทึกใบจ่ายสำหรับขั้นตอนนี้ — กดปุ่ม "บันทึกใบจ่าย" ก่อน เพื่อตัดสต็อกและเปิดใช้งานการดาวน์โหลดใบจ่าย (ป้องกันลืม)</p>'));
    }
  }
  wrap.appendChild(card);

  wrap.addEventListener('change', function(e){
    if(e.target.classList.contains('subwo-date-input')){
      setSubWoMaterialDate(w, step, e.target.dataset.mat, e.target.value);
      saveState();
      return;
    }
    if(e.target.id==='subWoOperatorSelect'){
      setSubWoOperator(w, step, e.target.value);
      saveState();
      return;
    }
  });
  wrap.addEventListener('input', function(e){
    if(e.target.id==='subWoNoteInput'){
      setSubWoNote(w, step, e.target.value);
      saveState();
      return;
    }
  });
  wrap.addEventListener('click', function(e){
    if(e.target.id==='subWoBackBtn'){ ui.subWoStep=null; render(); return; }
    if(e.target.id==='printSubWoDetailBtn'){ printSubWorkOrder(w, step); return; }
    if(e.target.id==='exportSubWoIssueDetailBtn'){ exportSubWoIssueExcel(w, step); return; }
    if(e.target.id==='saveSubWoIssueBtn'){ openSaveSubWoIssueModal(w, step); return; }
  });
  return wrap;
}
function openMaterialRequisitionModal(w){
  const p = productById(w.productId);
  let rows='';
  p.bom.forEach(function(c, i){
    const mat = materialById(c.materialId);
    const need = bomLineRequirement(p, c, w.targetQty);
    const short = need > mat.stock;
    rows += '<tr><td class="num mono">'+(i+1)+'</td><td class="mono">'+mat.id+'</td><td>'+esc(mat.name)+'</td>'+
      '<td class="num mono"'+(short?' style="color:var(--critical);font-weight:700"':'')+'>'+fmtNum(need)+' '+mat.unit+'</td>'+
      '<td class="num mono">'+fmtNum(mat.stock)+' '+mat.unit+'</td></tr>';
  });
  const anyShort = p.bom.some(function(c){ const mat=materialById(c.materialId); const need=bomLineRequirement(p, c, w.targetQty); return need>mat.stock; });
  openModal('ใบเบิกวัตถุดิบ — '+w.id,
    '<p class="helptext">รายการวัตถุดิบตามสูตรการผลิตของ '+esc(p.name)+' × '+fmtNum(w.targetQty)+' '+p.unit+' — กดยืนยันเพื่อตัดสต็อกวัตถุดิบในคลังวัตถุดิบโดยอัตโนมัติ</p>'+
    (anyShort? '<div class="empty-locked" style="border-color:var(--critical);color:var(--critical)">⚠ มีวัตถุดิบไม่พอในคลังบางรายการ (ตัวเลขสีแดง) ระบบจะตัดสต็อกลงเหลือ 0 สำหรับรายการนั้น</div>' : '')+
    '<div class="table-wrap" style="margin-top:10px"><table><thead><tr><th class="th-num">ลำดับ</th><th>รหัส</th><th>วัตถุดิบ</th><th class="th-num">จำนวนที่ต้องเบิก</th><th class="th-num">คงเหลือในคลัง</th></tr></thead><tbody>'+rows+'</tbody></table></div>',
    '<button class="btn ghost" id="modalCancel">ยกเลิก</button><button class="btn primary" id="confirmRequisitionBtn">✓ ยืนยัน (ตัดสต็อกอัตโนมัติ)</button>'
  );
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('confirmRequisitionBtn').addEventListener('click', function(){
    startWorkOrder(w);
    closeModal(); render();

// Bulk "เบิกวัตถุดิบ" for the whole WO at once — issues every sub-WO-step that hasn't already had
// its own material issue saved (see issueSubWoMaterial), so this stays a safe shortcut alongside
// the per-step "บันทึกใบเบิกจ่ายวัตถุดิบ" flow: a step already issued individually is simply

function startWorkOrder(w){
  const already = woActiveSteps(w).every(function(s){ return subWoMaterialIssued(w, s); });

}

// Material issue slip ("ใบจ่ายสินค้า") for ONE sub-WO/step, exported as an Excel file matching the
// company's Template_ใบจ่ายสินค้า.xlsx column layout exactly (Round J) — replaces the old HTML/print
// version (printSubWoMaterialIssue) now that "บันทึกใบจ่าย" is the button of record for this document;
// the sub-WO id itself doubles as the issue-slip number since there's no separate slip-numbering
// sequence in this system.
const SUB_WO_ISSUE_HEADERS = ['วันที่','เปลี่ยนลำดับ','PIC','สถานที่จ่ายสินค้า','โรงงานปลายทาง','เลขที่ใบจ่ายสินค้า','โครงการ','ลำดับงาน','No','รหัสสินค้าจากคำสั่งงาน','รหัสสินค้า','ชื่อสินค้า','จำนวน','หมายเหตุ','หมายเลข Serial/Lot'];
function subWoIssueRows(w, step){
  const ctx = subWoStepContext(w, step);
  const info = w.stepIssue && w.stepIssue[step];
  const dateStr = info && info.issuedAt ? info.issuedAt : TODAY;
  const subId = subWoId(w, step);
  const issuedIds = w.issuedMaterialIds || [];
  // Round K: only lines that have ACTUALLY been withdrawn so far go on the slip — with partial
  // issuance now possible, some of this step's BOM lines may still be pending and shouldn't appear
  // on the printed/exported ใบจ่ายสินค้า as if they'd already left the warehouse.
  const issuedLines = ctx.lines.filter(function(l){ return l.mat && issuedIds.indexOf(l.mat.id)!==-1; });
  return issuedLines.map(function(l, i){
    return [
      dateStr, i+1, subWoOperator(w,step)||'', 'คลังวัตถุดิบ', 'RST ASIA', subId, '', step, i+1,
      w.productId, l.mat.id, l.mat.name, l.need, subWoNote(w,step)||'', w.lotNo||'',
    ];
  });
}
function exportSubWoIssueExcel(w, step){
  if(!xlsxReady()) return;
  const rows = subWoIssueRows(w, step);
  if(!rows.length) return toast('ยังไม่มีวัตถุดิบที่เบิกจริงสำหรับขั้นตอนนี้','warning');
  const ws = XLSX.utils.aoa_to_sheet([SUB_WO_ISSUE_HEADERS].concat(rows));
  ws['!cols'] = SUB_WO_ISSUE_HEADERS.map(function(){ return {wch:16}; });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, subWoId(w,step).slice(0,31));
  XLSX.writeFile(wb, 'ใบจ่ายสินค้า_'+subWoId(w,step)+'.xlsx');
}

/* ======================= VIEW: KANBAN (ติดตามหน้างาน) ======================= */
// Kanban board rows are now the REAL configured production steps (state.productionSteps, set at
// Settings > ขั้นตอนผลิต) rather than a separate hardcoded pipeline — see renderKanban(). QC is
// always the last entry (enforced elsewhere: activeSteps() always appends it), so it doubles as the
// row where the "ส่งมอบเข้าคลัง" delivery action appears once that step's target is reached.
function deliverWoToFG(w){
  if(w.deliveredToFG) return;
  const p = productById(w.productId);
  // WIP-tracked items (p.wipItem) are credited incrementally at every QC daily-log entry instead
  // (see the save-log handler on the shop-floor page) — crediting the full targetQty again here
  // would double-count them, so only true finished-goods items get the batch credit at delivery.
  if(!p.wipItem) p.stock += w.targetQty;
  w.deliveredToFG = true;
  w.status = 'เสร็จสิ้น';
}
// Shared production-logging logic used by BOTH the daily shop-floor log page ("today" tab) and the
// Kanban board's per-stage quantity entry (task 5) — both write into the same state.dailyLogs array,
// so progress recorded on either page is immediately visible on the other (and on the WO-grouped
// progress view, task 8). Returns a toast message string, or null if nothing was entered.
function logProduction(woId, step, qty, def){
  qty = qty||0; def = def||0;
  if(qty<=0 && def<=0) return null;
  state.dailyLogs.push({id:'LOG-'+String(state.nextLogSeq++).padStart(4,'0'), date:TODAY, woId:woId, step:step, qty:qty, defect:def});
  const w = woById(woId);
  const net = Math.max(0, qty-def);
  const info = subWoStepInfo(w, step);
  let msg = 'บันทึกผลผลิตแล้ว';
  if(info && info.wipProductId){
    // Extra sub-WO-step linked to its own WIP product code — credits that product's stock directly
    // and tracks completion against the step's OWN target qty, independent of the parent WO.
    const wp = productById(info.wipProductId);
    if(wp){
      if(net>0) wp.stock += net;
      const stepDone = producedByStep(woId, step);
      msg = 'บันทึกผลผลิตแล้ว — เพิ่มสต็อกคลังสินค้าระหว่างทำของ '+wp.id+' '+fmtNum(net)+' '+wp.unit+(stepDone>=(info.targetQty||0)? ' ('+subWoId(w,step)+' ผลิตครบเป้าหมายของขั้นตอนนี้แล้ว)':'');
    }
  } else if(step==='QC'){
    const p = productById(w.productId);
    const fin = finishedQtyOfWO(w);
    if(p.wipItem){
      // WIP-tracked items credit the WIP warehouse stock immediately on every QC log entry — no
      // need to wait for the whole work order to reach its target quantity.
      if(net>0) p.stock += net;
      if(fin>=w.targetQty && !w.deliveredToFG) deliverWoToFG(w);
      msg = 'บันทึกผลผลิตแล้ว — เพิ่มสต็อกคลังสินค้าระหว่างทำ '+fmtNum(net)+' '+p.unit+(fin>=w.targetQty?' ('+w.id+' ผลิตครบเป้าหมายแล้ว)':'');
    } else if(fin>=w.targetQty && !w.deliveredToFG){
      deliverWoToFG(w);
      msg = w.id+' ผลิตครบเป้าหมาย — เพิ่มสต็อกสินค้าสำเร็จรูป '+fmtNum(w.targetQty)+' '+p.unit;
    }
  }
  saveState();
  return msg;
}
/* Round K: per-log "รับเข้าคลัง Ecount" push — QC is always the LAST production step (see the note
   on renderKanban below), so a QC log entry is the point a batch's finished/WIP output is considered
   received into stock; the physical stock credit already happens synchronously inside logProduction
   above (matching the same synchronous-action / async-ECOUNT-push split used for material issue —
   see pushMaterialIssueToEcount) — this only handles pushing that record to ECOUNT and tracking
   whether the push succeeded, via a flag on the log record itself (l.ecountReceiveSynced) so the
   history tab can show a "บันทึก"/"✓ ส่งแล้ว" state per row. */
const ECOUNT_RECEIVE_HEADERS = ['วันที่','เลขที่ใบสั่งผลิต','ขั้นตอนผลิต','รหัสสินค้า','ชื่อสินค้า','จำนวนที่ผลิต','ของเสีย','จำนวนรับเข้าคลัง (สุทธิ)','หน่วย'];
function pushProductionReceiveToEcount(log){
  const w = woById(log.woId);
  const p = w ? productById(w.productId) : null;
  if(!w || !p) return toast('ไม่พบใบสั่งผลิตหรือสินค้าของรายการนี้','critical');
  const net = Math.max(0, (log.qty||0)-(log.defect||0));
  const rows = [[log.date, w.id, log.step, p.id, p.name, log.qty, log.defect||0, net, p.unit]];
  function markSynced(msg, kind){
    log.ecountReceiveSynced = true;
    saveState();
    toast(msg, kind||'good');
    render();
  }
  if(apiConfigured()){
    fetch(config.sheetApiUrl, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'ecountProductionReceive', logId:log.id, woId:w.id, step:log.step, headers:ECOUNT_RECEIVE_HEADERS, rows:rows}) })
      .then(function(r){ return r.json(); })
      .then(function(res){ markSynced(res.ok? 'บันทึกรับเข้าคลัง '+log.id+' และส่งข้อมูลเข้า ECOUNT แล้ว' : 'บันทึกรับเข้าคลังแล้ว แต่ ECOUNT แจ้งว่า: '+res.message, res.ok?'good':'warning'); })
      .catch(function(err){ markSynced('บันทึกรับเข้าคลังแล้ว แต่เชื่อมต่อ ECOUNT ไม่สำเร็จ: '+err, 'warning'); });
  } else {
    markSynced('บันทึกรับเข้าคลัง '+log.id+' แล้ว (ยังไม่ได้เชื่อมต่อ ECOUNT — ไปที่ตั้งค่า > การเชื่อมต่อ เพื่อเชื่อมจริง)', 'good');
  }
}
function renderKanban(){
  const wrap = document.createElement('div');
  const editable = canEdit('kanban');
  const openWOs = state.workOrders.filter(function(w){ return w.status!=='เสร็จสิ้น' || !w.deliveredToFG; });
  const queued = openWOs.filter(function(w){ return !w.started; });
  const started = openWOs.filter(function(w){ return w.started; });
  // QC is always the last entry of state.productionSteps (enforced elsewhere: activeSteps() always
  // appends it, and it can't be deleted from Settings) — reused here as the row where the delivery
  // action appears, instead of a separate "ส่งมอบเข้าคลัง" stage after it.
  const lastGlobalStep = state.productionSteps[state.productionSteps.length-1];

  const card = el('<div class="card"></div>');
  card.appendChild(el('<div class="card-head"><div><h2>ติดตามหน้างาน (Kanban)</h2><p>แต่ละแถวคือขั้นตอนการผลิตจริงตามที่ตั้งค่าไว้ที่หน้า "ตั้งค่า" — ใบสั่งงานย่อยของใบสั่งผลิตแต่ละใบจะไปแสดงเฉพาะแถวของขั้นตอนตัวเอง (ไม่รวมทุกขั้นตอนไว้การ์ดเดียว) กรอกจำนวนที่ผลิตได้ในแต่ละขั้นตอนได้โดยตรงที่นี่ เมื่อผลิตผ่าน QC ครบเป้าหมายของใบสั่งผลิตแล้ว การ์ดจะถูกนำออกจากบอร์ดให้อัตโนมัติ</p></div></div>'));
  wrap.appendChild(card);

  // ---- Queue row (not started — no sub-WO step has had its materials issued yet, so it doesn't
  // belong to any step-row yet) ----
  const queueRow = el('<div style="margin-bottom:18px"></div>');
  queueRow.appendChild(el('<div class="kanban-col-head" style="border-bottom:1px solid var(--border);padding:2px 4px 8px;margin-bottom:8px"><b>รอเริ่มผลิต</b><span class="pill neutral">'+queued.length+'</span></div>'));
  const queueBoard = el('<div class="kanban-board"></div>');
  if(!queued.length) queueBoard.appendChild(el('<p class="helptext" style="padding:6px">— ไม่มี —</p>'));
  queued.forEach(function(w){
    const p = productById(w.productId);
    const col = el('<div class="kanban-col"></div>');
    const box = el(
      '<div class="kanban-card" data-wo="'+w.id+'">'+
      '<button type="button" class="btn-link mono wo-id" data-act="open-wo" data-wo="'+w.id+'" style="display:block;background:none;border:none;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;font-size:inherit;text-align:left">'+esc(w.id)+'</button>'+
      '<div class="prod-name">'+esc(p.id)+' — '+esc(p.name)+'</div>'+
      '<div class="mono" style="font-size:11.5px;color:var(--text-secondary)">Lot No. '+esc(w.lotNo)+'</div>'+
      '</div>'
    );
    // Material withdrawal now happens per sub-WO-step from the WO detail page (see Round C) and
    // auto-starts the WO the moment any step is issued — so no "เบิกวัตถุดิบ+เริ่มผลิต" button lives
    // here anymore; just point at where that action actually is.
    box.appendChild(el('<p class="helptext" style="margin-top:6px">ไปเบิกวัตถุดิบทีละขั้นตอนที่หน้า "ใบสั่งผลิต (WO)" เพื่อเริ่มผลิต — การ์ดนี้จะไปแสดงในแถวขั้นตอนนั้นให้อัตโนมัติทันทีที่เบิกขั้นตอนแรก</p>'));
    col.appendChild(box);
    queueBoard.appendChild(col);
  });
  queueRow.appendChild(queueBoard);
  wrap.appendChild(queueRow);

  // ---- One row PER CONFIGURED PRODUCTION STEP (state.productionSteps) — a started WO's card shows
  // up independently in EVERY step-row it currently has open (per its own real routing, woActiveSteps),
  // not just a single "current stage"; it drops out of a (non-final) step's row once that step's own
  // target is reached, and stays in the final (QC) row — offering delivery once ready — until delivered.
  state.productionSteps.forEach(function(step){
    const isLast = step===lastGlobalStep;
    const entries = started.filter(function(w){ return woActiveSteps(w).indexOf(step)!==-1; })
      .map(function(w){ return { w:w, ctx: subWoStepContext(w, step) }; })
      .filter(function(e){ return isLast? !e.w.deliveredToFG : producedByStep(e.w.id, step)<e.ctx.targetQty; });
    const stageRow = el('<div style="margin-bottom:18px"></div>');
    stageRow.appendChild(el('<div class="kanban-col-head" style="border-bottom:1px solid var(--border);padding:2px 4px 8px;margin-bottom:8px"><b>'+esc(step)+'</b><span class="pill neutral">'+entries.length+'</span></div>'));
    const stageBoard = el('<div class="kanban-board"></div>');
    if(!entries.length) stageBoard.appendChild(el('<p class="helptext" style="padding:6px">— ไม่มี —</p>'));
    entries.forEach(function(entry){
      const w = entry.w, ctx = entry.ctx;
      const done = producedByStep(w.id, step);
      const pct = ctx.targetQty? Math.min(100, Math.round(done/ctx.targetQty*100)) : 0;
      const canDeliver = done>=ctx.targetQty;
      const col = el('<div class="kanban-col"></div>');
      const box = el(
        '<div class="kanban-card" data-wo="'+w.id+'" data-step="'+esc(step)+'">'+
        '<button type="button" class="btn-link mono wo-id" data-act="open-wo" data-wo="'+w.id+'" style="display:block;background:none;border:none;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;font-size:inherit;text-align:left">'+esc(w.id)+'</button>'+
        '<div style="font-size:11px;margin:3px 0 2px">ใบสั่งงานย่อย: <button type="button" class="btn-link mono" data-act="open-sub-wo" data-wo="'+w.id+'" data-step="'+esc(step)+'" style="background:var(--accent);border:1px solid var(--border-strong);border-radius:5px;padding:1px 5px;color:#fff;font-weight:700;cursor:pointer;font-size:10.5px">'+esc(subWoId(w, step))+'</button></div>'+
        '<div class="prod-name">'+esc(ctx.product.id)+' — '+esc(ctx.product.name)+(ctx.isExtra? ' <span class="helptext">🔗 '+esc(w.productId)+'</span>':'')+'</div>'+
        '<div class="mono" style="font-size:11.5px;color:var(--text-secondary)">Lot No. '+esc(w.lotNo)+'</div>'+
        '<div style="font-size:11.5px;margin-top:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap">วันที่เริ่มผลิต: '+
          (editable? '<input type="date" class="kanbanStartDateInput" data-wo="'+w.id+'" value="'+esc(w.startDate||'')+'" style="padding:2px 4px;border-radius:5px;border:1px solid var(--border-strong);background:var(--surface);font-size:11px"/>'
            : '<span class="mono">'+(w.startDate? fmtDateThai(w.startDate) : '—')+'</span>')+
        '</div>'+
        '<div class="prog-bar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="mono qty-row" style="font-size:11.5px">ผลิตแล้ว<span>'+fmtNum(done)+' / '+fmtNum(ctx.targetQty)+' '+esc(ctx.product.unit)+' ('+pct+'%)</span></div>'+
        '</div>'
      );
      if(editable){
        if(!isLast || !canDeliver){
          box.appendChild(el(
            '<div class="qty-row" style="margin-top:8px;gap:5px;align-items:center;justify-content:flex-start">'+
              '<input type="number" min="0" class="kanbanQtyInput" data-wo="'+w.id+'" data-stage="'+esc(step)+'" style="width:56px;padding:4px 5px;border-radius:5px;border:1px solid var(--border-strong);background:var(--surface);font-size:11.5px" placeholder="จำนวน"/>'+
              '<button type="button" class="btn sm" data-act="kanban-plus20" data-wo="'+w.id+'" data-stage="'+esc(step)+'">+20</button>'+
              '<button type="button" class="btn sm primary" data-act="kanban-save-qty" data-wo="'+w.id+'" data-stage="'+esc(step)+'">บันทึก</button>'+
            '</div>'
          ));
        }
        if(isLast){
          box.appendChild(el('<div class="btn-row"><button type="button" class="btn sm primary" data-act="kanban-deliver" data-wo="'+w.id+'" '+(canDeliver?'':'disabled title="ยังบันทึกผลผลิตผ่าน QC ไม่ครบเป้าหมาย"')+'>✓ ส่งมอบเข้าคลัง</button></div>'));
        }
      }
      col.appendChild(box);
      stageBoard.appendChild(col);
    });
    stageRow.appendChild(stageBoard);
    wrap.appendChild(stageRow);
  });

  if(!editable) wrap.appendChild(el('<div class="empty-locked" style="margin-top:14px">🔒 บทบาทปัจจุบันดูข้อมูลได้อย่างเดียว — สลับเป็น "ฝ่ายผลิต", "หัวหน้ากะ" หรือ "ผู้จัดการโรงงาน" เพื่อบันทึกผลผลิต</div>'));

  wrap.addEventListener('click', function(e){
    const openWoBtn = e.target.closest('[data-act="open-wo"]');
    if(openWoBtn){
      ui.view = 'wo';
      ui.woDetailId = openWoBtn.dataset.wo;
      ui.subWoStep = null;
      render();
      return;
    }
    const openSubWoBtn = e.target.closest('[data-act="open-sub-wo"]');
    if(openSubWoBtn){
      ui.view = 'wo';
      ui.woDetailId = openSubWoBtn.dataset.wo;
      ui.subWoStep = openSubWoBtn.dataset.step;
      render();
      return;
    }
    const deliverBtn = e.target.closest('[data-act="kanban-deliver"]');
    if(deliverBtn){
      const w = woById(deliverBtn.dataset.wo);
      const p = productById(w.productId);
      const fin = finishedQtyOfWO(w);
      if(fin<w.targetQty) return toast('ยังบันทึกผลผลิตผ่าน QC ไม่ครบเป้าหมาย ('+fmtNum(fin)+' / '+fmtNum(w.targetQty)+')','critical');
      deliverWoToFG(w);
      saveState(); render();
      toast(p.wipItem? w.id+' ปิดงานแล้ว — สต็อกคลังสินค้าระหว่างทำถูกบันทึกไว้แล้วตอนบันทึกผลผลิตรายวัน' : w.id+' ส่งมอบเข้าคลังสินค้าสำเร็จรูปแล้ว — เพิ่มสต็อก '+fmtNum(w.targetQty)+' '+p.unit,'good');
      return;
    }
    const plus20Btn = e.target.closest('[data-act="kanban-plus20"]');
    if(plus20Btn){
      const inp = wrap.querySelector('.kanbanQtyInput[data-wo="'+plus20Btn.dataset.wo+'"][data-stage="'+plus20Btn.dataset.stage+'"]');
      if(inp) inp.value = (parseFloat(inp.value)||0)+20;
      return;
    }
    const saveQtyBtn = e.target.closest('[data-act="kanban-save-qty"]');
    if(saveQtyBtn){
      const woId = saveQtyBtn.dataset.wo, stage = saveQtyBtn.dataset.stage;
      const inp = wrap.querySelector('.kanbanQtyInput[data-wo="'+woId+'"][data-stage="'+stage+'"]');
      const qty = parseFloat(inp && inp.value)||0;
      const msg = logProduction(woId, stage, qty, 0);
      if(!msg) return toast('กรุณากรอกจำนวนที่ผลิตได้','critical');
      const w = woById(woId);
      toast(finishedQtyOfWO(w)>=w.targetQty? msg+' — '+w.id+' ผลิตครบเป้าหมายแล้ว':msg, 'good');
      render();
      return;
    }
  });
  wrap.addEventListener('change', function(e){
    if(e.target.classList.contains('kanbanStartDateInput')){
      const w = woById(e.target.dataset.wo);
      if(w){ w.startDate = e.target.value; saveState(); }
      return;
    }
  });

  return wrap;
}

/* ======================= VIEW: SHOP FLOOR DAILY LOG ======================= */
function renderShopfloor(){
  const wrap = document.createElement('div');
  const editable = canEdit('shopfloor');
  const tabs = el('<div class="tabs-row"><button class="tab-btn'+(ui.shopTab==='today'?' active':'')+'" data-tab="today">บันทึกผลผลิตวันนี้</button><button class="tab-btn'+(ui.shopTab==='byWO'?' active':'')+'" data-tab="byWO">สรุปตามใบสั่งงานหลัก</button><button class="tab-btn'+(ui.shopTab==='history'?' active':'')+'" data-tab="history">ประวัติย้อนหลัง</button></div>');
  wrap.appendChild(tabs);

  if(ui.shopTab==='today'){
    const card = el('<div class="card"></div>');
    card.appendChild(el('<div class="card-head"><div><h2>บันทึกยอดผลผลิตรายวัน — '+fmtDateThai(TODAY)+'</h2><p>กรอกจำนวนที่ผลิตได้ในกะวันนี้ แยกตามใบสั่งผลิตและขั้นตอนการผลิต</p></div></div>'));
    const tw = document.createElement('div'); tw.className='table-wrap';
    let rows=''; let rowIdx=0;
    state.workOrders.filter(function(w){ return w.started && w.status!=='เสร็จสิ้น'; }).forEach(function(w){
      const p = productById(w.productId);
      woActiveSteps(w).forEach(function(s){
        rowIdx++;
        const ctx = subWoStepContext(w, s);
        const done = producedByStep(w.id, s);
        const backlog = Math.max(0, ctx.targetQty-done);
        rows += '<tr><td class="num mono">'+rowIdx+'</td><td class="mono">'+esc(w.id)+'</td><td class="mono">'+esc(ctx.product.id)+'</td><td style="max-width:220px">'+esc(ctx.product.name)+(ctx.isExtra? ' <span class="helptext">🔗 '+esc(p.id)+'</span>':'')+'</td><td>'+s+'</td>'+
          '<td class="num mono">'+fmtNum(ctx.targetQty)+'</td><td class="num mono">'+fmtNum(done)+'</td>'+
          '<td class="num mono'+(backlog>0?' backlog-hi':'')+'">'+fmtNum(backlog)+'</td>'+
          (editable? '<td><input type="number" min="0" class="dailyQtyInput" data-wo="'+w.id+'" data-step="'+s+'" style="width:76px;padding:5px 6px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface)" placeholder="จำนวน"/></td>'+
          '<td><input type="number" min="0" class="dailyDefInput" data-wo="'+w.id+'" data-step="'+s+'" style="width:64px;padding:5px 6px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface)" placeholder="เสีย"/></td>'+
          '<td><button class="btn sm primary" data-act="save-log" data-wo="'+w.id+'" data-step="'+s+'">บันทึก</button></td>' : '<td colspan="3"></td>')+
          '</tr>';
      });
    });
    if(!rows) rows = '<tr><td colspan="11" class="helptext" style="padding:16px">ไม่มีใบสั่งผลิตที่เริ่มเดินไลน์ในขณะนี้</td></tr>';
    tw.innerHTML = '<table><thead><tr><th class="th-num">ลำดับ</th><th>เลขที่ใบสั่งผลิต</th><th>Product SKU</th><th>รายการสินค้า</th><th>ขั้นตอนผลิต</th><th class="th-num">เป้าหมาย</th><th class="th-num">ผลิตแล้ว</th><th class="th-num">ค้างผลิต</th><th class="th-center">จำนวนวันนี้</th><th class="th-center">ของเสีย</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
    card.appendChild(tw);
    if(!editable) card.appendChild(el('<div class="empty-locked">🔒 บทบาทปัจจุบันดูข้อมูลได้อย่างเดียว — สลับเป็น "ฝ่ายผลิต", "หัวหน้ากะ" หรือ "ผู้จัดการโรงงาน" เพื่อบันทึกยอดผลผลิต</div>'));
    wrap.appendChild(card);
  } else if(ui.shopTab==='byWO'){
    // WO-grouped % progress view — sourced from the SAME state.dailyLogs array that both this
    // page's "today" tab AND the Kanban board's per-stage quantity entry write into, so entries
    // recorded on either page show up here automatically.
    const card = el('<div class="card"></div>');
    card.appendChild(el('<div class="card-head"><div><h2>สรุปความคืบหน้าตามใบสั่งงานหลัก</h2><p>ดูว่าแต่ละใบสั่งผลิตผลิตได้เท่าไหร่ในแต่ละขั้นตอน คิดเป็นกี่ % ของเป้าหมาย — รวมข้อมูลจากทั้งหน้านี้และหน้าติดตามหน้างาน (Kanban)</p></div></div>'));
    const relevantWOs = state.workOrders.filter(function(w){ return w.started; }).slice().reverse();
    if(!relevantWOs.length){
      card.appendChild(el('<p class="helptext" style="padding:16px">ยังไม่มีใบสั่งผลิตที่เริ่มเดินไลน์</p>'));
    } else {
      relevantWOs.forEach(function(w){
        const p = productById(w.productId);
        const fin = finishedQtyOfWO(w);
        const overallPct = w.targetQty? Math.min(100, Math.round(fin/w.targetQty*100)) : 0;
        const box = el('<div class="card" style="margin-top:12px;background:var(--surface-2)"></div>');
        box.appendChild(el('<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><div><b class="mono">'+esc(w.id)+'</b> — '+esc(p.name)+' <span class="helptext">Lot '+esc(w.lotNo)+'</span></div><span class="pill '+(w.status==='เสร็จสิ้น'?'good':'warning')+'"><span class="dot"></span>'+esc(w.status)+' ('+overallPct+'%)</span></div>'));
        let stepRows='';
        woActiveSteps(w).forEach(function(s){
          const ctx = subWoStepContext(w, s);
          const done = producedByStep(w.id, s);
          const pct = ctx.targetQty? Math.min(100, Math.round(done/ctx.targetQty*100)) : 0;
          stepRows += '<div style="margin-top:9px">'+
            '<div style="display:flex;justify-content:space-between;font-size:12.5px"><span>'+esc(s)+(ctx.isExtra? ' <span class="helptext">🔗 '+esc(ctx.product.id)+'</span>':'')+'</span><span class="mono">'+fmtNum(done)+' / '+fmtNum(ctx.targetQty)+' ('+pct+'%)</span></div>'+
            '<div style="height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:3px"><div style="height:100%;background:var(--accent);width:'+pct+'%"></div></div>'+
          '</div>';
        });
        box.insertAdjacentHTML('beforeend', stepRows);
        card.appendChild(box);
      });
    }
    wrap.appendChild(card);
  } else {
    const card = el('<div class="card"></div>');
    card.appendChild(el('<div class="card-head"><div><h2>ประวัติการบันทึกสะสมย้อนหลัง</h2><p>รายการบันทึกผลผลิตและของเสียทั้งหมด เรียงล่าสุดก่อน</p></div></div>'));
    const tw = document.createElement('div'); tw.className='table-wrap';
    let rows='';
    // Round K: added Product SKU column, and a "รับเข้าคลัง Ecount" column shown ONLY for QC-step
    // rows — QC is always the LAST production step, so that's the point a batch's output is
    // considered received into stock (the stock credit itself already happened at log time in
    // logProduction; this button only pushes/confirms that record to ECOUNT).
    state.dailyLogs.slice().reverse().slice(0,60).forEach(function(l, i){
      const w = woById(l.woId); const p = w? productById(w.productId): null;
      let ecountCell = '—';
      if(l.step==='QC'){
        ecountCell = l.ecountReceiveSynced
          ? '<span class="pill good" style="font-size:10.5px">✓ ส่งเข้า ECOUNT แล้ว</span>'
          : (canEdit('shopfloor') ? '<button type="button" class="btn sm primary" data-act="save-ecount-receive" data-logid="'+esc(l.id)+'">บันทึก</button>' : '<span class="pill neutral" style="font-size:10.5px">ยังไม่บันทึก</span>');
      }
      rows += '<tr><td class="num mono">'+(i+1)+'</td><td class="mono">'+fmtDateThai(l.date)+'</td><td class="mono">'+l.woId+'</td><td class="mono">'+(p?esc(p.id):'-')+'</td><td>'+(p?esc(p.name):'-')+'</td><td>'+esc(l.step)+'</td><td class="num mono">'+fmtNum(l.qty)+'</td><td class="num mono">'+fmtNum(l.defect||0)+'</td><td>'+ecountCell+'</td></tr>';
    });
    tw.innerHTML = '<table><thead><tr><th class="th-num">ลำดับ</th><th>วันที่</th><th>WO</th><th>Product SKU</th><th>สินค้า</th><th>ขั้นตอน</th><th class="th-num">จำนวนที่ผลิต</th><th class="th-num">ของเสีย</th><th>รับเข้าคลัง Ecount</th></tr></thead><tbody>'+rows+'</tbody></table>';
    card.appendChild(tw);
    wrap.appendChild(card);
  }

  wrap.addEventListener('click', function(e){
    const tabBtn = e.target.closest('[data-tab]');
    if(tabBtn){ ui.shopTab = tabBtn.dataset.tab; render(); return; }
    const saveBtn = e.target.closest('[data-act="save-log"]');
    if(saveBtn){
      const woId = saveBtn.dataset.wo, step = saveBtn.dataset.step;
      const qtyInput = wrap.querySelector('.dailyQtyInput[data-wo="'+woId+'"][data-step="'+step+'"]');
      const defInput = wrap.querySelector('.dailyDefInput[data-wo="'+woId+'"][data-step="'+step+'"]');
      const qty = parseFloat(qtyInput.value)||0;
      const def = parseFloat(defInput.value)||0;
      const msg = logProduction(woId, step, qty, def);
      if(!msg) return toast('กรุณากรอกจำนวนที่ผลิตได้','critical');
      toast(msg,'good');
      render();
      return;
    }
    const ecountBtn = e.target.closest('[data-act="save-ecount-receive"]');
    if(ecountBtn){
      const log = state.dailyLogs.find(function(l){ return l.id===ecountBtn.dataset.logid; });
      if(log) pushProductionReceiveToEcount(log);
      return;
    }
  });
  return wrap;
}

/* ======================= VIEW: STOCK ======================= */
function renderStock(){
  const wrap = document.createElement('div');
  const editable = canEdit('stock');

  const isAdmin = ui.role==='admin';
  // "จำนวนสั่งซื้อขั้นต่ำ" is a narrower privilege than the general 'stock' edit permission — only
  // the ฝ่ายจัดซื้อ (purchasing) role may set it, gated directly here rather than through canEdit().
  const isPurchasing = ui.role==='purchasing';
  // A material with a matching wipItem product belongs to the คลังสินค้าระหว่างทำ page now —
  // even though the material record is kept internally (BOM cost lookups still resolve by
  // materialId), it must show in exactly ONE warehouse page, never both.
  const visibleMaterials = state.materials.filter(function(m){ return !m.pending && !productById(m.id); });
  const counts = { all: visibleMaterials.length, good:0, warning:0, critical:0 };
  visibleMaterials.forEach(function(m){ counts[stockStatus(m)]++; });
  const filterMeta = [
    {key:'all', label:'รายการทั้งหมด', color:null},
    {key:'good', label:'สถานะปกติ', color:'good'},
    {key:'warning', label:'ถึงจุดสั่งซื้อ', color:'warning'},
    {key:'critical', label:'วิกฤต', color:'critical'},
  ];
  const tiles = el('<div class="grid grid-4"></div>');
  tiles.innerHTML = filterMeta.map(function(f){
    const active = ui.stockFilter===f.key;
    return '<div class="stat-tile kpi-filter'+(active?' active':'')+'" data-stockfilter="'+f.key+'">'+
      '<div class="label">'+esc(f.label)+'</div>'+
      '<div class="value"'+(f.color?' style="color:var(--'+f.color+')"':'')+'>'+counts[f.key]+'</div>'+
      '<div class="delta">รายการวัตถุดิบ</div></div>';
  }).join('');
  wrap.appendChild(tiles);

  const filtered = visibleMaterials.filter(function(m){ return ui.stockFilter==='all' || stockStatus(m)===ui.stockFilter; });
  const filteredIds = filtered.map(function(m){ return m.id; });
  const selectedIds = Object.keys(ui.stockSelected).filter(function(id){ return ui.stockSelected[id] && filteredIds.indexOf(id)!==-1; });
  const allFilteredSelected = filtered.length>0 && selectedIds.length===filtered.length;

  const card = el('<div class="card" style="margin-top:16px"></div>');
  card.appendChild(el('<div class="card-head"><div><h2>คลังวัตถุดิบ &amp; ฮาร์ดแวร์</h2><p>สถานะสต็อกเทียบจุดสั่งซื้อซ้ำ (Min Stock) — คลิก KPI ด้านบนหรือลูกศร dropdown ที่คอลัมน์ "สถานะ" เพื่อกรอง แล้วติ๊กเลือกหลายรายการเพื่อขอซื้อพร้อมกันได้</p></div>'+
    '<div class="btn-row">'+(canEdit('pr')? '<button class="btn sm primary" id="bulkRequestBtn" '+(selectedIds.length? '' : 'disabled')+'>🛒 ขอซื้อที่เลือก ('+selectedIds.length+')</button>' : '')+
    '<button class="btn sm" id="exportStockBtn">⇩ CSV</button><button class="btn sm" id="lineTestBtn">🔔 ทดสอบแจ้งเตือน LINE</button></div></div>'));
  const tw = document.createElement('div'); tw.className='table-wrap';
  let rows='';
  filtered.forEach(function(m, i){
    const st = stockStatus(m);
    const eff = effectiveUnitCost(m);
    const costCell = m.bulk? fmtTHB(eff)+'<div class="helptext" style="margin-top:2px">จากแผ่นใหญ่ '+fmtTHB(m.bulk.bulkCost)+'/'+esc(m.bulk.bulkUnit)+'</div>' : fmtTHB(eff);
    const orderQty = suggestedOrderQty(m);
    const minOrderCell = isPurchasing?
      '<input type="number" min="0" class="mono" data-minorderqty="'+m.id+'" value="'+(m.minOrderQty||0)+'" style="width:66px;padding:3px 4px;border-radius:5px;border:1px solid var(--border-strong);background:var(--surface)"/>' :
      fmtNum(m.minOrderQty||0);
    let actionCell = '';
    if(canEdit('pr')) actionCell += '<button class="btn sm primary" data-act="request" data-id="'+m.id+'" title="ขอซื้อ">🛒 ขอซื้อ</button>';
    if(isAdmin){
      actionCell += '<button class="btn sm" data-act="move-wip" data-id="'+m.id+'" title="ย้ายรหัสนี้ไปคลังสินค้าระหว่างทำ (สร้างสูตรการผลิตของตัวเองได้)">⏳ ย้ายไประหว่างทำ</button>';
      actionCell += '<button class="btn sm danger" data-act="del-material" data-id="'+m.id+'" title="ลบวัตถุดิบ">🗑</button>';
    }
    rows += '<tr><td class="checkbox-cell">'+(canEdit('pr')? '<input type="checkbox" data-stocksel="'+m.id+'" '+(ui.stockSelected[m.id]?'checked':'')+'/>' : '')+'</td><td class="num mono">'+(i+1)+'</td><td class="mono">'+m.id+'</td><td>'+esc(m.name)+'</td>'+

const THAI_MONTH_ABBR = {'ม.ค.':1,'ก.พ.':2,'มี.ค.':3,'เม.ย.':4,'พ.ค.':5,'มิ.ย.':6,'ก.ค.':7,'ส.ค.':8,'ก.ย.':9,'ต.ค.':10,'พ.ย.':11,'ธ.ค.':12};
function parseThaiBuddhistDate(str){
  // Handles the Ecount "สถานะการซื้อ" report's date format, e.g. "02 ม.ค. 2569 -1"
  // (DD <Thai-month-abbr> BuddhistYYYY, optionally followed by a " -N" same-day sequence suffix).
  // Returns an ISO "YYYY-MM-DD" string, or '' if it doesn't match.
  if(!str) return '';
  const cleaned = String(str).trim().replace(/\s*-\s*\d+\s*$/, '').trim();
  const m = cleaned.match(/^(\d{1,2})\s+([ก-๙.]+)\s+(\d{4})$/);
  if(!m) return '';
  const month = THAI_MONTH_ABBR[m[2]];
  if(!month) return '';
  const gregYear = parseInt(m[3],10) - 543;
  return gregYear+'-'+String(month).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
}
const PPH_ECOUNT_COLS = ['วันที่-ลำดับ','เลขที่ใบสั่งซื้อ','รหัสสินค้า','ชื่อสินค้า (ข้อมูลจำเพาะ)','หมายเลขการซื้อ','จำนวน','ราคาต่อหน่วย','ส่วนลด%','จำนวนเงิน','ภาษี','ยอดรวม','ชื่อลูกค้า/ผู้ขาย','ชื่อ PIC','เลขที่ใบส่งสินค้า/ใบกำกับภาษี','ชื่อโครงการ','ชื่อกลุ่มสินค้า I','สถานะใบสำคัญ'];

function previewPurchaseHistoryImport(rows){
  // Auto-detect which layout the file uses: the app's own simple 6-column template, or a direct
  // export of the ERP's "รายละเอียดสถานะการซื้อ" report (17 columns, with a title row before the
  // header row, and subtotal/grand-total/footer rows mixed into the data — those are simply skipped
  // below because they always have a blank รหัสสินค้า cell).
  let format = 'simple', headerIdx = -1;
  for(let i=0;i<Math.min(rows.length,5);i++){
    const joined = rows[i].join('|');
    if(/รหัสสินค้า/.test(joined) && /เลขที่ใบสั่งซื้อ/.test(joined)){ format='ecount'; headerIdx=i; break; }
    if(/รหัสวัตถุดิบ/.test(joined) && /วันที่ซื้อ/.test(joined)){ format='simple'; headerIdx=i; break; }
  }
  const dataRows = headerIdx!==-1 ? rows.slice(headerIdx+1) : rows.slice();
  const valid = [], invalid = [];
  dataRows.forEach(function(r, i){
    const rowNo = i+headerIdx+2;
    let materialId, matNameFile, date, price, supplier, qty, ref, status;
    if(format==='ecount'){
      materialId = String(r[2]||'').trim();
      if(!materialId) return; // subtotal / grand-total / footer row — silently skip, not a real data row
      matNameFile = String(r[3]||'').trim();
      date = parseThaiBuddhistDate(r[0]);
      price = parseFloat(r[6]);
      supplier = String(r[11]||'').trim();
      qty = parseFloat(r[5])||0;
      ref = String(r[1]||'').trim() || String(r[13]||'').trim();
      status = String(r[16]||'').trim();
      if(status && status!=='ยืนยัน'){ invalid.push({rowNo:rowNo, reason:'สถานะใบสำคัญ "'+status+'" (ไม่ใช่ "ยืนยัน") จึงไม่นำเข้า'}); return; }
    } else {
      materialId = String(r[0]||'').trim();
      matNameFile = '';
      date = String(r[1]||'').trim();
      price = parseFloat(r[2]);
      supplier = String(r[3]||'').trim();
      qty = parseFloat(r[4])||0;
      ref = String(r[5]||'').trim();
    }
    if(!materialId){ invalid.push({rowNo:rowNo, reason:'ไม่ได้ระบุรหัสวัตถุดิบ'}); return; }
    const mat = materialById(materialId);
    if(!mat){ invalid.push({rowNo:rowNo, reason:'ไม่พบรหัสวัตถุดิบ "'+materialId+'"'+(matNameFile?' ('+matNameFile+')':'')+' ในคลังวัตถุดิบ'}); return; }
    if(!date){ invalid.push({rowNo:rowNo, reason:'วันที่ซื้อไม่ถูกต้องหรือไม่ได้ระบุ'}); return; }
    if(!(price>0)){ invalid.push({rowNo:rowNo, reason:'ราคา/หน่วยต้องมากกว่า 0'}); return; }
    valid.push({materialId:materialId, date:date, price:price, supplier:supplier, qty:qty, ref:ref, matName:mat.name});
  });
  const PREVIEW_CAP = 300;
  const shownValid = valid.slice(0, PREVIEW_CAP);
  const shownInvalid = invalid.slice(0, PREVIEW_CAP);
  openModal('นำเข้าประวัติราคาซื้อ — พบ '+dataRows.length+' แถว'+(format==='ecount'?' (รูปแบบรายงานสถานะการซื้อ)':''),
    '<p class="helptext">พบรายการที่นำเข้าได้ <b style="color:var(--good, var(--accent-strong))">'+valid.length+'</b> แถว'+(invalid.length? ' และข้าม <b style="color:var(--critical)">'+invalid.length+'</b> แถว (ดูเหตุผลด้านล่าง)':'')+'</p>'+
    (valid.length? '<div class="table-wrap" style="margin-top:10px;max-height:260px;overflow:auto"><table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>วันที่</th><th class="th-num">ราคา/หน่วย</th><th>ผู้ขาย</th></tr></thead><tbody>'+
      shownValid.map(function(v){ return '<tr><td class="mono">'+esc(v.materialId)+'</td><td>'+esc(v.matName)+'</td><td class="mono">'+esc(v.date)+'</td><td class="num mono">'+fmtTHB(v.price)+'</td><td>'+esc(v.supplier)+'</td></tr>'; }).join('')+
      (valid.length>PREVIEW_CAP? '<tr><td colspan="5" class="helptext" style="text-align:center">…และอีก '+(valid.length-PREVIEW_CAP)+' แถว</td></tr>':'')+
      '</tbody></table></div>' : '')+
    (invalid.length? '<div class="section-title">แถวที่ข้าม</div><ul style="margin:4px 0 0 18px;font-size:12.5px;max-height:160px;overflow:auto">'+shownInvalid.map(function(x){ return '<li>แถวที่ '+x.rowNo+': '+esc(x.reason)+'</li>'; }).join('')+(invalid.length>PREVIEW_CAP? '<li>…และอีก '+(invalid.length-PREVIEW_CAP)+' แถว</li>':'')+'</ul>' : ''),
    '<button class="btn ghost" id="modalCancel">ยกเลิก</button>'+(valid.length? '<button class="btn primary" id="confirmImportPphBtn">✓ นำเข้า '+valid.length+' แถว</button>' : '')
  );
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  const confirmBtn = document.getElementById('confirmImportPphBtn');
  if(confirmBtn){
    confirmBtn.addEventListener('click', function(){
      valid.forEach(function(v){
        state.purchasePriceHistory.push({materialId:v.materialId, date:v.date, price:v.price, supplier:v.supplier, qty:v.qty, ref:v.ref});
      });
      saveState(); closeModal(); render();
      toast('นำเข้าประวัติราคาซื้อ '+valid.length+' แถวแล้ว — ต้นทุนวัตถุดิบจะคำนวณจากราคาสูงสุดในประวัติโดยอัตโนมัติ','good');
    });
  }
}

  const toolRow = el('<div class="btn-row"></div>');
  toolRow.appendChild(el('<button class="chip-btn" id="downloadPphTemplateBtn">⇩ ดาวน์โหลดเทมเพลต Excel</button>'));
  if(editable) toolRow.appendChild(el('<label class="chip-btn" style="cursor:pointer">⇧ นำเข้าไฟล์ Excel<input type="file" id="importPphInput" accept=".xlsx,.xls" style="display:none"/></label>'));
  toolsCard.appendChild(toolRow);
  wrap.appendChild(toolsCard);

  const materialsWithHist = state.materials.filter(function(m){ return !m.pending; });
  const card = el('<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>ต้นทุนวัตถุดิบตามประวัติราคาซื้อ</h2></div></div></div>');
  let rows = '';
  materialsWithHist.forEach(function(m, i){
    const hist = purchaseHistoryForMaterial(m.id);
    const maxPrice = maxPurchasePrice(m.id);
    const open = !!ui.purchaseHistExpanded[m.id];
    rows += '<tr><td class="num mono">'+(i+1)+'</td><td class="mono">'+esc(m.id)+'</td><td>'+esc(m.name)+'</td>'+
      '<td class="num mono">'+(editable? '<input type="number" min="0" step="0.01" class="pph-manual-cost-input" data-mid="'+esc(m.id)+'" value="'+m.unitCost+'" style="width:100px;text-align:right"/>' : fmtTHB(m.unitCost))+'</td>'+
      '<td class="num mono">'+(maxPrice!==null? fmtTHB(maxPrice) : '—')+'</td>'+
      '<td class="num mono" style="font-weight:700">'+fmtTHB(effectiveUnitCost(m))+'</td>'+
      '<td class="num mono">'+hist.length+'</td>'+
      '<td>'+(hist.length? '<button class="btn sm" data-act="toggle-pph" data-mid="'+esc(m.id)+'">'+(open?'🙈 ซ่อน':'👁 ดูประวัติ')+'</button>' : '')+'</td></tr>';
    if(open && hist.length){
      let subRows = hist.map(function(h){ return '<tr><td class="mono">'+esc(h.date)+'</td><td class="num mono">'+fmtTHB(h.price)+'</td><td>'+esc(h.supplier||'—')+'</td><td class="num mono">'+(h.qty? fmtNum(h.qty):'—')+'</td><td class="mono">'+esc(h.ref||'—')+'</td></tr>'; }).join('');
      rows += '<tr><td></td><td colspan="7" style="padding:6px 6px 12px 24px"><div class="table-wrap"><table><thead><tr><th>วันที่ซื้อ</th><th class="th-num">ราคา/หน่วย</th><th>ผู้ขาย</th><th class="th-num">จำนวนที่ซื้อ</th><th>เอกสารอ้างอิง</th></tr></thead><tbody>'+subRows+'</tbody></table></div></td></tr>';
    }
  });
  if(!rows) rows = '<tr><td colspan="8" class="helptext" style="padding:16px">ไม่มีวัตถุดิบในระบบ</td></tr>';
  const tw = document.createElement('div'); tw.className='table-wrap';
  tw.innerHTML = '<table><thead><tr><th class="th-num">ลำดับ</th><th>รหัส</th><th>ชื่อวัตถุดิบ</th><th class="th-num">ราคา/หน่วย (กรอกเอง)</th><th class="th-num">ราคาสูงสุดจากประวัติ</th><th class="th-num">ต้นทุนที่ใช้จริง</th><th class="th-num">จำนวนประวัติ</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
  card.appendChild(tw);
  if(!editable) card.appendChild(el('<div class="empty-locked">🔒 บทบาทปัจจุบันดูข้อมูลได้อย่างเดียว — สลับเป็น "เจ้าหน้าที่คลัง", "ฝ่ายจัดซื้อ" หรือ "ผู้จัดการโรงงาน" เพื่อนำเข้าประวัติราคาซื้อ</div>'));
  wrap.appendChild(card);

  wrap.addEventListener('click', function(e){
    if(e.target.id==='downloadPphTemplateBtn') return downloadPurchaseHistoryTemplateXlsx();
    const toggleBtn = e.target.closest('[data-act="toggle-pph"]');
    if(toggleBtn){
      const mid = toggleBtn.dataset.mid;
      ui.purchaseHistExpanded[mid] = !ui.purchaseHistExpanded[mid];
      render();
      return;
    }
  });
  const importInput = wrap.querySelector('#importPphInput');
  if(importInput){
    importInput.addEventListener('change', function(e){
      const file = e.target.files[0]; if(!file) return;
      if(!xlsxReady()){ importInput.value=''; return; }
      const reader = new FileReader();
      reader.onload = function(ev){ previewPurchaseHistoryImport(parseWorkbookRows(ev.target.result)); };
      reader.readAsArrayBuffer(file);
      importInput.value='';
    });
  }
  // Manual "(กรอกเอง)" cost input — commits on blur/Enter (change, not input, so a full re-render
  // doesn't steal focus mid-keystroke). This writes straight to m.unitCost, which effectiveUnitCost()
  // already falls back to whenever a material has no imported purchase-price history — so a manually
  // entered number here immediately feeds production-cost/MRP/PR calculations for any material that
  // hasn't had a price imported yet, with no separate field or override logic needed.
  wrap.addEventListener('change', function(e){
    if(e.target.classList.contains('pph-manual-cost-input')){
      const mat = materialById(e.target.dataset.mid);
      if(!mat) return;
      const v = parseFloat(e.target.value);
      mat.unitCost = isNaN(v)||v<0? 0 : v;
      saveState();
      render();
    }
  });
  return wrap;
}

/* ======================= VIEW: WIP (WORK-IN-PROGRESS WAREHOUSE) ======================= */
// ---- Inline add/edit/delete CRUD directly on the คลังสินค้าระหว่างทำ (WIP stock) table — a
// lighter-weight path than going through the full BOM/formula editor just to register a new
// in-process code, edit its basic details, or retire one that's no longer used. ----
function openAddWipItemModal(){
  openModal('เพิ่มรหัสคลังสินค้าระหว่างทำ',
    '<div class="form-grid">'+
    field('รหัส','wipNewId','text','')+
    field('ชื่อสินค้า/ชิ้นงาน','wipNewName','text','')+
    field('หน่วยนับ','wipNewUnit','text','ชิ้น')+
    '<div class="field"><label>หมวดหมู่</label><select id="wipNewCat">'+state.categories.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('')+'</select></div>'+
    field('สต็อกเริ่มต้น','wipNewStock','number',0)+
    '</div>',
    '<button class="btn ghost" id="modalCancel">ยกเลิก</button><button class="btn primary" id="confirmAddWipItemBtn">+ เพิ่มรหัส</button>'
  );
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('confirmAddWipItemBtn').addEventListener('click', function(){
    const id = document.getElementById('wipNewId').value.trim();
    const name = document.getElementById('wipNewName').value.trim();
    const unit = document.getElementById('wipNewUnit').value.trim()||'ชิ้น';
    const category = document.getElementById('wipNewCat').value;
    const stock = parseFloat(document.getElementById('wipNewStock').value)||0;
    if(!id || !name) return toast('กรุณากรอกรหัสและชื่อสินค้า','critical');
    if(productById(id) || materialById(id)) return toast('รหัส "'+id+'" มีอยู่แล้วในระบบ กรุณาใช้รหัสอื่น','critical');
    const p = { id:id, name:name, category:category||state.categories[0]||'อื่นๆ', unit:unit, active:true, stock:stock, bom:[], scrapPct:0, laborByStep:{}, overheadPct:10, markupPct:30, wipItem:true };
    state.products.push(p);
    saveState(); closeModal(); render();
    toast('เพิ่มรหัส '+id+' เข้าคลังสินค้าระหว่างทำแล้ว','good');
  });
}
function openEditWipItemModal(pid){
  const p = productById(pid);
  if(!p) return;
  openModal('แก้ไขรายละเอียด — '+p.id,
    '<div class="form-grid">'+
    field('ชื่อสินค้า/ชิ้นงาน','wipEditName','text',p.name)+
    field('หน่วยนับ','wipEditUnit','text',p.unit)+
    '<div class="field"><label>หมวดหมู่</label><select id="wipEditCat">'+state.categories.map(function(c){ return '<option value="'+esc(c)+'"'+(c===p.category?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'</select></div>'+
    field('สต็อกคงเหลือ','wipEditStock','number',p.stock)+
    '</div>',
    '<button class="btn ghost" id="modalCancel">ยกเลิก</button><button class="btn primary" id="confirmEditWipItemBtn">บันทึก</button>'
  );
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('confirmEditWipItemBtn').addEventListener('click', function(){
    const name = document.getElementById('wipEditName').value.trim();
    if(!name) return toast('กรุณากรอกชื่อสินค้า','critical');
