// Same usage-safety checks as openMoveWipToMaterialConfirm's `reasons` — a WIP item with its own
// formula, WO/log/sales history, or that's referenced as a BOM ingredient elsewhere can't be
// deleted without losing data, so those cases are blocked with an explanation instead.
function wipItemUsageReasons(p){
  const reasons = [];
  if(p.bom && p.bom.length) reasons.push('มีสูตรการผลิต (BOM) ของตัวเอง ('+p.bom.length+' รายการ)');
  if(state.workOrders.some(function(w){ return w.productId===p.id; })) reasons.push('มีใบสั่งผลิต (WO) ที่อ้างอิงรหัสนี้อยู่แล้ว');
  if(state.workOrders.some(function(w){ return w.extraStepInfo && Object.keys(w.extraStepInfo).some(function(s){ return w.extraStepInfo[s].wipProductId===p.id; }); })) reasons.push('มีใบสั่งงานย่อย-ขั้นตอนที่ผูกรหัสนี้เป็นเป้าหมายอยู่');
  if(state.dailyLogs.some(function(l){ const w=woById(l.woId); return w && w.productId===p.id; })) reasons.push('มีประวัติบันทึกผลผลิตรายวันแล้ว');
  if(state.sales.some(function(s){ return s.productId===p.id; })) reasons.push('มีประวัติการขายแล้ว');
  if(state.products.some(function(other){ return other.id!==p.id && (other.bom||[]).some(function(c){ return c.materialId===p.id; }); })) reasons.push('มีสูตรการผลิตอื่นที่ใช้รหัสนี้เป็นวัตถุดิบ/ชิ้นส่วนอยู่');
  return reasons;
}
function openDeleteWipItemConfirm(pid){
  const p = productById(pid);
  if(!p) return;
  const reasons = wipItemUsageReasons(p);
  if(reasons.length){
    openModal('ลบรหัสนี้ไม่ได้ — '+p.id,
      '<p class="helptext">รหัส "'+esc(p.name)+'" ('+esc(pid)+') ยังใช้งานอยู่:</p>'+
      '<ul style="margin:8px 0 0 18px;font-size:13px">'+reasons.map(function(r){ return '<li>'+esc(r)+'</li>'; }).join('')+'</ul>',
      '<button class="btn primary" id="modalCancel">รับทราบ</button>'
    );
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    return;
  }
  openModal('ลบรหัส — '+p.id,
    '<p class="helptext">ยืนยันลบรหัส <b class="mono">'+esc(pid)+'</b> — '+esc(p.name)+' ออกจากคลังสินค้าระหว่างทำ? การลบนี้ย้อนกลับไม่ได้</p>',
    '<button class="btn ghost" id="modalCancel">ยกเลิก</button><button class="btn primary" id="confirmDeleteWipItemBtn" style="background:var(--critical);border-color:var(--critical)">🗑 ยืนยันลบ</button>'
  );
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('confirmDeleteWipItemBtn').addEventListener('click', function(){
    const idx = state.products.findIndex(function(x){ return x.id===pid; });
    if(idx!==-1) state.products.splice(idx,1);
    saveState(); closeModal(); render();
    toast('ลบรหัส '+pid+' ออกจากคลังสินค้าระหว่างทำแล้ว','good');
  });
}
function renderWIP(){
  const wrap = document.createElement('div');
  const isAdmin = ui.role==='admin';
  const editable = canEdit('wip');
  const openWOs = state.workOrders.filter(function(w){ return w.status!=='เสร็จสิ้น'; });
  const startedWOs = openWOs.filter(function(w){ return w.started; });
  const total = computeWipTotal();
  const materialIssued = startedWOs.reduce(function(s,w){
    const p = productById(w.productId);
    const matCost = p.bom.reduce(function(a,c){ return a+c.qty*effectiveUnitCost(materialById(c.materialId)); },0)/productLotSize(p)/(1-p.scrapPct/100);
    return s+matCost*w.targetQty;
  },0);
  const laborAccrued = startedWOs.reduce(function(s,w){ const p=productById(w.productId); return s+laborTotal(p)*finishedQtyOfWO(w); },0);

  const tiles = el('<div class="grid grid-4"></div>');
  tiles.innerHTML =
    statTile('มูลค่างานระหว่างทำ (WIP) รวม', fmtTHB(total), openWOs.length+' ใบสั่งผลิตที่ยังเปิดอยู่') +
    statTile('ต้นทุนวัตถุดิบที่เบิกใช้แล้ว', fmtTHB(materialIssued), startedWOs.length+' ใบที่เริ่มเดินไลน์แล้ว') +
    statTile('ค่าแรงสะสมตามผลผลิตจริง', fmtTHB(laborAccrued), 'ตามยอดผ่าน QC สะสม') +
    statTile('ใบสั่งผลิตยังไม่เริ่มเดินไลน์', openWOs.length-startedWOs.length, 'รอตัดสต็อกวัตถุดิบ');
  wrap.appendChild(tiles);

  /* ---- สต็อกคลังสินค้าระหว่างทำ (รหัสที่ย้ายมาจากคลังวัตถุดิบ หรือสร้างเป็น "+รหัสงานระหว่างทำ") ----
     เพิ่มสต็อกอัตโนมัติทุกครั้งที่บันทึกผลผลิตรายวันผ่านขั้นตอน QC ของรหัสเหล่านี้ (ดู save-log handler
     ที่หน้าบันทึกผลผลิตรายวัน) ไม่ต้องรอให้ครบเป้าหมายทั้งใบสั่งผลิตเหมือนสินค้าสำเร็จรูปทั่วไป */
  const wipItems = state.products.filter(function(p){ return p.wipItem; });
  const wipStockValue = wipItems.reduce(function(s,p){ return s+stdCost(p)*p.stock; },0);
  const stockCard = el('<div class="card" style="margin-top:16px"></div>');
  stockCard.appendChild(el('<div class="card-head"><div><h2>คลังสินค้าระหว่างทำ (สต็อกคงเหลือ)</h2><p>รหัสที่ย้ายมาจากคลังวัตถุดิบ หรือสร้างจาก "+รหัสงานระหว่างทำ" — สต็อกเพิ่มอัตโนมัติทุกครั้งที่บันทึกผลผลิตรายวันผ่าน QC</p></div>'+
    '<div class="btn-row">'+(editable? '<button class="btn sm primary" id="addWipItemBtn">+ เพิ่มรหัส</button>' : '')+'<button class="btn sm" id="exportWipStockBtn">⇩ CSV</button></div></div>'));
  const stw = document.createElement('div'); stw.className='table-wrap';
  let srows='';
  wipItems.forEach(function(p, i){
    const cost = stdCost(p);
    srows += '<tr><td class="num mono">'+(i+1)+'</td><td class="mono">'+p.id+'</td><td>'+esc(p.name)+'</td>'+
      '<td class="num mono">'+fmtNum(p.stock)+' '+p.unit+'</td>'+
      '<td class="num mono">'+fmtTHB(cost)+'</td>'+
      '<td class="num mono" style="font-weight:700">'+fmtTHB(cost*p.stock)+'</td>'+
      '<td>'+esc(p.category||'-')+'</td>'+
      '<td class="btn-row"><button type="button" class="btn sm" data-act="edit-product" data-pid="'+p.id+'">✎ แก้ไขสูตร</button>'+
      (editable? '<button type="button" class="btn sm" data-act="edit-wip-item" data-pid="'+p.id+'">✎ แก้ไขรายละเอียด</button>' : '')+
      (isAdmin? '<button type="button" class="btn sm" data-act="move-to-material" data-pid="'+p.id+'" title="ย้ายรหัสนี้กลับไปคลังวัตถุดิบ">📦 ย้ายไปคลังวัตถุดิบ</button>' : '')+
      (editable? '<button type="button" class="btn sm" data-act="delete-wip-item" data-pid="'+p.id+'" title="ลบรหัสนี้ออกจากคลังสินค้าระหว่างทำ">🗑 ลบ</button>' : '')+

  stockCard.appendChild(stw);
  stockCard.appendChild(el('<p class="helptext" style="margin-top:10px">มูลค่าคลังสินค้าระหว่างทำรวม <b class="mono">'+fmtTHB(wipStockValue)+'</b> ('+wipItems.length+' รหัส)</p>'));
  wrap.appendChild(stockCard);

  const card = el('<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>รายละเอียดงานระหว่างทำ</h2><p>ควบคุมมูลค่าจมในไลน์ผลิต และติดตามความคืบหน้าตามขั้นตอนล่าสุด</p></div></div></div>');

    if(expanded){

        '</td></tr>';

      const headers=['รหัส','สินค้า/ชิ้นงาน','คงเหลือ','หน่วย','ต้นทุน/หน่วย','มูลค่าคลัง','หมวดหมู่'];
      const data = wipItems.map(function(p){ const cost=stdCost(p); return [p.id,p.name,p.stock,p.unit,cost.toFixed(2),(cost*p.stock).toFixed(2),p.category||'-']; });
      showExportModal('wip_warehouse_stock.csv', headers, data);
      return;
    }
    const editBtn = e.target.closest('[data-act="edit-product"]');
    if(editBtn){ openEditFormulaModal(editBtn.dataset.pid); return; }
    const moveToMatBtn = e.target.closest('[data-act="move-to-material"]');

  });

}
/* Moves a wipItem product back to being a plain material in คลังวัตถุดิบ. Blocked if the item has
   its own BOM/formula or any production history (WO/daily logs/sales), since that data would be
   lost. If a material record with the same id already exists (the "dual" pattern used when this
   code is also referenced as a BOM ingredient elsewhere), its stock is merged in and the product
   is removed. Otherwise a new material record is created from the product's stock/unit, then the
   product is removed — mirroring the Stock-page "ย้ายไประหว่างทำ" move in reverse. */
function openMoveWipToMaterialConfirm(pid){
  const p = productById(pid);
  if(!p || !p.wipItem) return;
  const reasons = [];
  if(p.bom && p.bom.length) reasons.push('มีสูตรการผลิต (BOM) ของตัวเองแล้ว ('+p.bom.length+' รายการ) — ย้ายกลับเป็นวัตถุดิบธรรมดาไม่ได้ เพราะจะเสียข้อมูลสูตรการผลิตนี้ไป');
  const usedInWO = state.workOrders.some(function(w){ return w.productId===pid; });
  if(usedInWO) reasons.push('มีใบสั่งผลิต (WO) ที่อ้างอิงรหัสนี้อยู่แล้ว');
  const usedInLogs = state.dailyLogs.some(function(l){ const w=woById(l.woId); return w && w.productId===pid; });
  if(usedInLogs) reasons.push('มีประวัติบันทึกผลผลิตรายวันแล้ว');
  const usedInSales = state.sales.some(function(s){ return s.productId===pid; });
  if(usedInSales) reasons.push('มีประวัติการขายแล้ว');
  if(reasons.length){
    openModal('ย้ายรหัสนี้กลับไปคลังวัตถุดิบไม่ได้',
      '<p class="helptext">รหัส "'+esc(p.name)+'" ('+esc(pid)+') ยังใช้งานอยู่ในคลังสินค้าระหว่างทำ:</p>'+
      '<ul style="margin:8px 0 0 18px;font-size:13px">'+reasons.map(function(r){ return '<li>'+esc(r)+'</li>'; }).join('')+'</ul>',
      '<button class="btn primary" id="modalCancel">รับทราบ</button>'
    );
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    return;
  }
  openModal('ย้ายรหัสไปคลังวัตถุดิบ — '+p.name,
    '<p class="helptext">รหัส <b class="mono">'+esc(pid)+'</b> — '+esc(p.name)+' จะถูก<b>ย้ายออกจากคลังสินค้าระหว่างทำ</b> และไปแสดงที่หน้าคลังวัตถุดิบแทน สต็อกคงเหลือปัจจุบัน ('+fmtNum(p.stock)+' '+p.unit+') จะถูกย้ายไปเป็นสต็อกคลังวัตถุดิบให้ด้วย รหัสนี้จะไม่แสดงที่หน้าคลังสินค้าระหว่างทำอีกต่อไป</p>',
    '<button class="btn ghost" id="modalCancel">ยกเลิก</button><button class="btn primary" id="confirmMoveToMatBtn">📦 ยืนยันย้ายไปคลังวัตถุดิบ</button>'
  );
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('confirmMoveToMatBtn').addEventListener('click', function(){
    let mat = materialById(pid);
    const wasNew = !mat;
    if(mat){
      mat.stock = (mat.stock||0) + (p.stock||0);
    } else {
      mat = { id:pid, name:p.name, category:state.materialCategories[0]||'อื่นๆ', unit:p.unit, unitCost:0, stock:p.stock||0, min:0, safety:0, supplier:'' };
      state.materials.push(mat);
    }
    const idx = state.products.findIndex(function(x){ return x.id===pid; });
    if(idx!==-1) state.products.splice(idx,1);
    saveState(); closeModal(); render();
    toast('ย้ายรหัส '+pid+' ไปคลังวัตถุดิบแล้ว (สต็อก '+fmtNum(mat.stock)+' '+mat.unit+' รวมแล้ว)'+(wasNew? ' — กรุณาไปตรวจสอบ/ปรับปรุงราคาต่อหน่วยที่หน้าคลังวัตถุดิบ':''),'good');
  });
}

/* ======================= VIEW: AI & LINE NOTIFY ======================= */
function renderAI(){
  const wrap = document.createElement('div');
  wrap.appendChild(el('<div class="card"><div class="card-head"><div><h2>AI Production Optimizer</h2><p>คำแนะนำเชิงกฎวิเคราะห์ (rule-based) ที่จำลองการทำงานร่วมกับ AI Engine — ใช้ประกอบการตัดสินใจ ไม่ใช่คำสั่งอัตโนมัติ</p></div></div></div>'));

  const openWOs = state.workOrders.filter(function(w){ return w.status!=='เสร็จสิ้น' && w.started; });
  const backlogByStep = {};
  openWOs.forEach(function(w){
    woActiveSteps(w).forEach(function(s){ backlogByStep[s]=(backlogByStep[s]||0)+Math.max(0, w.targetQty-producedByStep(w.id,s)); });
  });
  let bottleneckStep=null, maxBacklog=0;
  Object.keys(backlogByStep).forEach(function(k){ if(backlogByStep[k]>maxBacklog){ maxBacklog=backlogByStep[k]; bottleneckStep=k; } });

  const grouped = {};
  state.workOrders.filter(function(w){ return !w.started; }).forEach(function(w){ grouped[w.productId]=(grouped[w.productId]||[]).concat(w.id); });
  const changeoverNote = Object.keys(grouped).filter(function(k){ return grouped[k].length>1; });

  const costliest = state.materials.filter(function(m){ return !m.pending; }).sort(function(a,b){ return effectiveUnitCost(b)-effectiveUnitCost(a); })[0];

  const cards = document.createElement('div');
  cards.style.marginTop='16px';
  cards.appendChild(el(
    '<div class="ai-card"><b>🎯 จัดลำดับคิวการผลิต</b><p>'+
    (changeoverNote.length? 'พบใบสั่งผลิตสินค้าเดียวกันหลายใบที่ยังไม่เริ่มเดินไลน์ ('+changeoverNote.map(function(id){return productById(id).name;}).join(', ')+') แนะนำจัดคิวให้ต่อเนื่องกันเพื่อลดจำนวนครั้งการตั้งเครื่อง (setup) ตัด/เชื่อม/พ่นสี' : 'ขณะนี้คิวการผลิตกระจายตัวดี ไม่พบสินค้าเดียวกันที่ควรจัดคิวติดกันเพิ่มเติม')+
    '</p></div>'
  ));
  cards.appendChild(el(
    '<div class="ai-card"><b>⚠️ จุดเสี่ยงคอขวด (Bottleneck)</b><p>'+
    (bottleneckStep? 'ขั้นตอน "'+bottleneckStep+'" มียอดค้างผลิตสะสมสูงสุด ('+fmtNum(maxBacklog)+' หน่วย) จากใบสั่งผลิตที่เปิดอยู่ แนะนำเสริมกำลังคนหรือเครื่องจักรในขั้นตอนนี้เพื่อลดการค้างสะสม' : 'ยังไม่พบขั้นตอนที่มีงานค้างผิดปกติในขณะนี้')+
    '</p></div>'
  ));
  cards.appendChild(el(
    '<div class="ai-card"><b>💡 แนวทางลดต้นทุน</b><p>'+
    (costliest? '"'+costliest.name+'" เป็นวัตถุดิบที่มีต้นทุนต่อหน่วยสูงที่สุด ('+fmtTHB(effectiveUnitCost(costliest))+'/'+costliest.unit+') แนะนำเจรจาสัญญาซื้อล่วงหน้า (Forward Contract) กับ '+esc(costliest.supplier)+' หรือสั่งซื้อปริมาณมากเพื่อรับส่วนลดขั้นบันได' : 'ยังไม่มีข้อมูลวัตถุดิบในระบบ กรุณาเพิ่มวัตถุดิบก่อนเพื่อดูคำแนะนำ')+
    '</p></div>'
  ));
  const shortages = state.materials.filter(function(m){ return !m.pending && stockStatus(m)!=='good'; });
  if(shortages.length){
    cards.appendChild(el(
      '<div class="ai-card"><b>📦 ความเสี่ยงวัตถุดิบขาดสต็อก</b><p>'+
      'วัตถุดิบ '+shortages.map(function(m){return m.name;}).join(', ')+' ใกล้หรือต่ำกว่าจุดสั่งซื้อซ้ำ อาจกระทบกำหนดส่งมอบหากมีใบสั่งผลิตใหม่เข้ามา แนะนำเปิดใบขอซื้อล่วงหน้าก่อนวางแผนผลิตรอบถัดไป'+
      '</p></div>'
    ));
  }
  wrap.appendChild(cards);

  const lineCard = el('<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>LINE Notify ฝ่ายจัดซื้อ</h2><p>ทดสอบข้อความแจ้งเตือนเมื่อวัตถุดิบต่ำกว่า Safety Stock (ไปที่หน้า "คลังวัตถุดิบ" เพื่อทดสอบส่งข้อความ)</p></div></div></div>');
  wrap.appendChild(lineCard);
  return wrap;
}

function categoryInUse(name){ return state.products.some(function(p){ return p.category===name; }); }
function materialCategoryInUse(name){ return state.materials.some(function(m){ return m.category===name; }); }
function stepInUse(name){ return state.products.some(function(p){ return p.bom.some(function(c){ return (c.steps||[]).indexOf(name)!==-1; }); }); }
function operatorInUse(name){ return state.workOrders.some(function(w){ return w.subWoOperator && Object.keys(w.subWoOperator).some(function(k){ return w.subWoOperator[k]===name; }); }); }
function projectInUse(name){
  return state.purchaseRequests.some(function(r){ return r.ecountMeta && r.ecountMeta.project===name; }) ||
    (state.prEcountDefaults && state.prEcountDefaults.project===name);
}
function settingsRenameCategory(oldName, newName){ state.products.forEach(function(p){ if(p.category===oldName) p.category=newName; }); }
function settingsRenameMatCategory(oldName, newName){ state.materials.forEach(function(m){ if(m.category===oldName) m.category=newName; }); }
function settingsRenameProject(oldName, newName){
  state.purchaseRequests.forEach(function(r){ if(r.ecountMeta && r.ecountMeta.project===oldName) r.ecountMeta.project=newName; });
  if(state.prEcountDefaults && state.prEcountDefaults.project===oldName) state.prEcountDefaults.project=newName;
}

    '<div class="table-wrap"><table><thead><tr><th class="th-num">ลำดับ</th><th>รหัส</th><th>ชื่อ</th><th class="th-num">จำนวนวัตถุดิบใน BOM ย่อย</th><th class="th-num">ต้นทุน/หน่วย</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function settingsRenameStep(oldName, newName){
  state.products.forEach(function(p){
    p.bom.forEach(function(c){ c.steps=(c.steps||[]).map(function(s){ return s===oldName?newName:s; }); });
    if(p.laborByStep && Object.prototype.hasOwnProperty.call(p.laborByStep, oldName)){
      p.laborByStep[newName] = p.laborByStep[oldName];
      delete p.laborByStep[oldName];
    }
  });
  state.dailyLogs.forEach(function(l){ if(l.step===oldName) l.step=newName; });
  if(state.stepLaborRates && Object.prototype.hasOwnProperty.call(state.stepLaborRates, oldName)){
    state.stepLaborRates[newName] = state.stepLaborRates[oldName];
    delete state.stepLaborRates[oldName];
  }
}
// Default ค่าแรง/ชม. offered for a step in the create-formula labor grid — pulled from what was set
// at Settings > ขั้นตอนผลิต; falls back to the old flat standard rate (70) when that step's rate at
// Settings hasn't been configured (still 0), so existing behavior/tests are unchanged until a manager
// actually sets a rate there.
function stepDefaultLaborRate(step){
  const r = state.stepLaborRates && state.stepLaborRates[step];

// ---- Round K: Excel import for master lists that are just a single column of names (currently
// only "โครงการ" asked for this, but written generically so it's trivial to offer to other simple
// lists later) ----
function downloadSimpleListTemplateXlsx(label, filename){
  if(!xlsxReady()) return;
  const ws = XLSX.utils.aoa_to_sheet([[label], ['ตัวอย่าง: '+label+' A']]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, label.slice(0,31));
  XLSX.writeFile(wb, filename);
}
function previewSimpleListImport(stateKey, label, rows){
  if(rows.length && new RegExp(label).test(String(rows[0][0]||''))) rows = rows.slice(1);
  const seen = {}, names = [];
  rows.forEach(function(r){
    const v = String(r[0]||'').trim();
    if(v && !seen[v]){ seen[v]=true; names.push(v); }
  });
  const existing = state[stateKey];
  const toAdd = names.filter(function(n){ return existing.indexOf(n)===-1; });
  const dupCount = names.length - toAdd.length;
  openModal('นำเข้ารายชื่อ'+label+' — พบ '+names.length+' รายการ',
    '<p class="helptext">จะเพิ่ม'+label+'ใหม่ <b style="color:var(--good, var(--accent-strong))">'+toAdd.length+'</b> รายการ'+(dupCount? ' (ข้าม '+dupCount+' รายการที่มีอยู่แล้ว)':'')+'</p>'+
    (toAdd.length? '<ul style="margin:8px 0 0 18px;font-size:13px;max-height:240px;overflow:auto">'+toAdd.map(function(n){ return '<li>'+esc(n)+'</li>'; }).join('')+'</ul>' : ''),
    '<button class="btn ghost" id="modalCancel">ยกเลิก</button>'+(toAdd.length? '<button class="btn primary" id="confirmImportSimpleListBtn">✓ นำเข้า '+toAdd.length+' รายการ</button>' : '')
  );
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  const confirmBtn = document.getElementById('confirmImportSimpleListBtn');
  if(confirmBtn){
    confirmBtn.addEventListener('click', function(){
      toAdd.forEach(function(n){ existing.push(n); });
      saveState(); closeModal(); render();
      toast('นำเข้า'+label+' '+toAdd.length+' รายการแล้ว','good');
    });
  }
}

function previewLocationImport(rows){
  if(rows.length && /รหัสสถานที่/.test(String(rows[0][0]||''))) rows = rows.slice(1);
  const existingCodes = {}; state.locations.forEach(function(l){ existingCodes[l.code]=true; });
  const valid = [], skipped = [];
  const seenInFile = {};
  rows.forEach(function(r, i){
    const code = String(r[0]||'').trim(), name = String(r[1]||'').trim(), type = String(r[2]||'').trim();
    const rowNo = i+2;
    if(!code || !name){ skipped.push({rowNo:rowNo, reason:'ไม่ได้ระบุรหัสสถานที่หรือชื่อสถานที่'}); return; }
    if(existingCodes[code] || seenInFile[code]){ skipped.push({rowNo:rowNo, reason:'รหัส "'+code+'" มีอยู่แล้ว'}); return; }
    seenInFile[code]=true;
    valid.push({code:code, name:name, type:type});
  });
  openModal('นำเข้ารายชื่อสถานที่ — พบ '+rows.length+' แถว',
    '<p class="helptext">จะเพิ่มสถานที่ใหม่ <b style="color:var(--good, var(--accent-strong))">'+valid.length+'</b> รายการ'+(skipped.length? ' และข้าม <b style="color:var(--critical)">'+skipped.length+'</b> แถว (ดูเหตุผลด้านล่าง)':'')+'</p>'+
    (valid.length? '<div class="table-wrap" style="margin-top:10px;max-height:240px;overflow:auto"><table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>ประเภท</th></tr></thead><tbody>'+
      valid.map(function(v){ return '<tr><td class="mono">'+esc(v.code)+'</td><td>'+esc(v.name)+'</td><td>'+esc(v.type)+'</td></tr>'; }).join('')+'</tbody></table></div>' : '')+
    (skipped.length? '<div class="section-title">แถวที่ข้าม</div><ul style="margin:4px 0 0 18px;font-size:12.5px;max-height:160px;overflow:auto">'+skipped.map(function(x){ return '<li>แถวที่ '+x.rowNo+': '+esc(x.reason)+'</li>'; }).join('')+'</ul>' : ''),
    '<button class="btn ghost" id="modalCancel">ยกเลิก</button>'+(valid.length? '<button class="btn primary" id="confirmImportLocationsBtn">✓ นำเข้า '+valid.length+' รายการ</button>' : '')
  );
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  const confirmBtn = document.getElementById('confirmImportLocationsBtn');
  if(confirmBtn){
    confirmBtn.addEventListener('click', function(){
      valid.forEach(function(v){ state.locations.push(v); });
      saveState(); closeModal(); render();
      toast('นำเข้าสถานที่ '+valid.length+' รายการแล้ว','good');
    });
  }
}

  // ---- Round K/M: กำหนดสิทธิ์ (module permissions + role management) ----
  // Never let the LAST role holding "edit" access to the "settings" module lose it — that would lock
  // everyone out of ever reopening this tab to undo the change (or add a role back) again.
  function settingsEditHolderCount(exceptRole){
    return state.roles.filter(function(r){
      return r.id!==exceptRole && state.rolePermissions[r.id] && state.rolePermissions[r.id].settings==='edit';
    }).length;
  }
  wrap.addEventListener('change', function(e){
    if(e.target.classList.contains('perm-select')){
      if(!editable) return;
      const role = e.target.dataset.role, mod = e.target.dataset.mod;
      const newVal = e.target.value;
      if(!state.rolePermissions[role]) state.rolePermissions[role] = defaultRolePermissionsFor(role);
      const oldVal = state.rolePermissions[role][mod];
      if(mod==='settings' && oldVal==='edit' && newVal!=='edit' && settingsEditHolderCount(role)===0){
        e.target.value = 'edit';
        return toast('ต้องมีอย่างน้อย 1 บทบาทที่ "แก้ไข" โมดูล "ตั้งค่า" ได้เสมอ — ป้องกันการถูกล็อกออกจากหน้านี้','critical');
      }
      state.rolePermissions[role][mod] = newVal;
      saveState(); render();
      const roleLabel = (state.roles.find(function(r){ return r.id===role; })||{}).label || role;
      const modLabel = (PERMISSION_MODULES.find(function(m){ return m.id===mod; })||{}).label || mod;
      const levelLabel = {edit:'แก้ไข', view:'ใช้งาน', none:'ไม่ใช้งาน (ซ่อนเมนู)'}[newVal] || newVal;
      toast('ปรับสิทธิ์ "'+roleLabel+'" ('+modLabel+') เป็น "'+levelLabel+'" แล้ว','good');
      return;
    }
    if(e.target.classList.contains('role-label-input')){
      if(!editable) return;
      const id = e.target.dataset.role;
      const val = (e.target.value||'').trim();
      const role = state.roles.find(function(r){ return r.id===id; });
      if(!role) return;
      if(!val){ e.target.value = role.label; return toast('ชื่อบทบาทห้ามว่าง','critical'); }
      if(state.roles.some(function(r){ return r.id!==id && r.label===val; })){ e.target.value = role.label; return toast('มีบทบาทชื่อนี้อยู่แล้ว','critical'); }
      role.label = val; saveState(); render();
      return;
    }
  });
  wrap.addEventListener('click', function(e){
    if(e.target.id==='addRoleBtn'){
      if(!editable) return;
      const input = document.getElementById('newRoleInput');
      const label = (input.value||'').trim();
      if(!label) return toast('กรุณาระบุชื่อบทบาทใหม่','critical');
      if(state.roles.some(function(r){ return r.label===label; })) return toast('มีบทบาทชื่อนี้อยู่แล้ว','critical');
      const id = 'role_'+(state.nextRoleSeq++);
      // New custom roles start able to VIEW every module but EDIT none — a safe, visible-but-inert
      // default the admin then dials in per module, rather than either extreme (full access or fully
      // hidden) by surprise.
      state.roles.push({id:id, label:label, builtin:false});
      state.rolePermissions[id] = defaultRolePermissionsFor(id);
      PERMISSION_MODULES.forEach(function(m){ state.rolePermissions[id][m.id] = 'view'; });
      saveState(); render();
      toast('เพิ่มบทบาท "'+label+'" แล้ว — ตั้งค่าสิทธิ์แต่ละโมดูลได้จากตารางด้านล่าง','good');
      return;
    }
    const rmRoleBtn = e.target.closest('[data-rm-role]');
    if(rmRoleBtn){
      if(!editable) return;
      const id = rmRoleBtn.dataset.rmRole;
      const role = state.roles.find(function(r){ return r.id===id; });
      if(!role) return;
      if(role.builtin) return toast('บทบาทหลักของระบบลบไม่ได้','critical');
      if(ui.role===id) return toast('ไม่สามารถลบบทบาทที่กำลังใช้งานอยู่ในขณะนี้ได้ — สลับไปบทบาทอื่นที่มุมซ้ายล่างก่อน','critical');
      if(state.rolePermissions[id] && state.rolePermissions[id].settings==='edit' && settingsEditHolderCount(id)===0){
        return toast('ลบบทบาทนี้ไม่ได้ — เป็นบทบาทเดียวที่เหลือที่ "แก้ไข" โมดูล "ตั้งค่า" ได้ (ป้องกันล็อกทุกคนออกจากหน้านี้)','critical');
      }
      state.roles = state.roles.filter(function(r){ return r.id!==id; });
      delete state.rolePermissions[id];
      saveState(); render();
      toast('ลบบทบาท "'+role.label+'" แล้ว','good');
      return;
    }
  });

  return wrap;
}

const VIEW_RENDERERS = {
  overview: renderOverview, bom: renderBOM, cost: renderCost, mrp: renderMRP, pr: renderPR,
  wo: renderWO, kanban: renderKanban, shopfloor: renderShopfloor, stock: renderStock, purchaseStatus: renderPurchaseStatus, wip: renderWIP, fg: renderFG,
  ai: renderAI, settings: renderSettings,
};
// Round M: roles are user-manageable now (add/rename/delete at ตั้งค่า > กำหนดสิทธิ์), so this
// dropdown's options can no longer be built once at boot — it's rebuilt every render() from the
// live state.roles, but only actually touches the DOM (and re-wires its listener) when the role
// list has actually changed since last time, so it doesn't fight the browser's own <select> focus.
function renderRoleSelect(){
  const sel = document.getElementById('roleSelect');
  if(!sel) return;
  const signature = state.roles.map(function(r){ return r.id+''+r.label; }).join('');
  if(sel.dataset.builtFor !== signature){
    sel.innerHTML = '';
    state.roles.forEach(function(r){ sel.appendChild(el('<option value="'+esc(r.id)+'">'+esc(r.label)+'</option>')); });
    sel.dataset.builtFor = signature;
    if(!sel.dataset.wired){
      sel.addEventListener('change', function(){ ui.role = sel.value; render(); });
      sel.dataset.wired = '1';
    }
  }
  sel.value = ui.role;
}
document.getElementById('themeToggle').addEventListener('click', function(){
  const rootEl = document.documentElement;
  const cur = rootEl.getAttribute('data-theme');
  if(cur==='dark'){ rootEl.setAttribute('data-theme','light'); }
  else if(cur==='light'){ rootEl.removeAttribute('data-theme'); }
  else { rootEl.setAttribute('data-theme','dark'); }
});

      '<h2>ระบบเปิดไม่สำเร็จ</h2>'+

      '<button id="emergencyResetBtn" style="padding:10px 16px;font-size:14px;cursor:pointer;margin-bottom:14px">ล้างข้อมูลเก่าแล้วเริ่มใหม่</button>'+
      '<pre style="white-space:pre-wrap;background:#f3f3f3;padding:12px;border-radius:8px;font-size:12px;color:#333">'+esc(String(bootErr&&bootErr.stack||bootErr))+'</pre>'+
    '</div>';
  const emergencyBtn = document.getElementById('emergencyResetBtn');
  if(emergencyBtn) emergencyBtn.addEventListener('click', function(){
    try{ localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(CONFIG_KEY); }catch(e){}
    location.reload();
  });
}
