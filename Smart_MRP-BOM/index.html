/* ======================= VIEW: KANBAN (ติดตามหน้างาน) ======================= */
const KANBAN_STAGES = ['CNC','เชื่อม','ทำสี','ประกอบ','QC','ส่งมอบเข้าคลัง'];
function kanbanStageOf(w){ return w.kanbanStage || KANBAN_STAGES[0]; }
function deliverWoToFG(w){
  if(w.deliveredToFG) return;
  const p = productById(w.productId);
  p.stock += w.targetQty;
  w.deliveredToFG = true;
  w.status = 'เสร็จสิ้น';
}
function renderKanban(){
  const wrap = document.createElement('div');
  const editable = canEdit('kanban');
  const openWOs = state.workOrders.filter(function(w){ return w.status!=='เสร็จสิ้น' || !w.deliveredToFG; });
  const queued = openWOs.filter(function(w){ return !w.started; });
  const onBoard = openWOs.filter(function(w){ return w.started; });

  const card = el('<div class="card"></div>');
  card.appendChild(el('<div class="card-head"><div><h2>ติดตามหน้างาน (Kanban)</h2><p>ลากความคืบหน้าของแต่ละใบสั่งผลิตผ่านขั้นตอนหน้างาน — เมื่อกด "ส่งมอบเข้าคลัง" ระบบจะเพิ่มสต็อกสินค้าสำเร็จรูปให้อัตโนมัติ (เฉพาะใบที่บันทึกผลผลิตผ่าน QC ครบเป้าหมายแล้วที่หน้า "บันทึกผลผลิตรายวัน")</p></div></div>'));
  wrap.appendChild(card);

  const board = el('<div class="kanban-board" style="margin-top:14px"></div>');

  function cardHtml(w){
    const p = productById(w.productId);
    const fin = finishedQtyOfWO(w);
    return '<div class="kanban-card" data-wo="'+w.id+'">'+
      '<div class="wo-id">'+esc(w.id)+'</div>'+
      '<div class="prod-name">'+esc(p.name)+' • Lot '+esc(w.lotNo)+'</div>'+
      '<div class="mono" style="font-size:12px">ผลิตแล้ว '+fmtNum(fin)+' / '+fmtNum(w.targetQty)+' '+esc(p.unit)+'</div>'+
      '</div>';
  }

  // Queue column (not started yet — informational, not draggable within the board)
  const queueCol = el('<div class="kanban-col"></div>');
  queueCol.appendChild(el('<div class="kanban-col-head"><span>รอเริ่มผลิต</span><span class="pill neutral">'+queued.length+'</span></div>'));
  if(!queued.length) queueCol.appendChild(el('<p class="helptext" style="padding:6px">— ไม่มี —</p>'));
  queued.forEach(function(w){
    const box = el(cardHtml(w));
    if(editable){
      box.appendChild(el('<div class="btn-row"><button type="button" class="btn sm primary" data-act="kanban-start" data-wo="'+w.id+'">ถัดไป → (เบิกวัตถุดิบ+เริ่มผลิต)</button></div>'));
    } else {
      box.appendChild(el('<p class="helptext" style="margin-top:6px">เบิกวัตถุดิบที่หน้าใบสั่งผลิตก่อนเริ่มเดินไลน์</p>'));
    }
    queueCol.appendChild(box);
  });
  board.appendChild(queueCol);

  KANBAN_STAGES.forEach(function(stage, stageIdx){
    const col = el('<div class="kanban-col"></div>');
    const wosHere = onBoard.filter(function(w){ return kanbanStageOf(w)===stage && !(stage===KANBAN_STAGES[KANBAN_STAGES.length-1] && w.deliveredToFG); });
    col.appendChild(el('<div class="kanban-col-head"><span>'+esc(stage)+'</span><span class="pill neutral">'+wosHere.length+'</span></div>'));
    if(!wosHere.length) col.appendChild(el('<p class="helptext" style="padding:6px">— ไม่มี —</p>'));
    wosHere.forEach(function(w){
      const p = productById(w.productId);
      const fin = finishedQtyOfWO(w);
      const isLast = stageIdx===KANBAN_STAGES.length-1;
      const canDeliver = fin>=w.targetQty;
      const box = el(cardHtml(w));
      if(editable){
        const btnRow = el('<div class="btn-row"></div>');
        if(stageIdx>0) btnRow.appendChild(el('<button type="button" class="btn sm" data-act="kanban-back" data-wo="'+w.id+'">← ก่อนหน้า</button>'));
        if(!isLast){
          btnRow.appendChild(el('<button type="button" class="btn sm primary" data-act="kanban-next" data-wo="'+w.id+'">ถัดไป →</button>'));
        } else {
          btnRow.appendChild(el('<button type="button" class="btn sm primary" data-act="kanban-deliver" data-wo="'+w.id+'" '+(canDeliver?'':'disabled title="ยังบันทึกผลผลิตผ่าน QC ไม่ครบเป้าหมาย"')+'>✓ ส่งมอบเข้าคลัง</button>'));
        }
        box.appendChild(btnRow);
        if(isLast && !canDeliver) box.appendChild(el('<p class="helptext" style="margin-top:6px;color:var(--warning)">ผลิตผ่าน QC แล้ว '+fmtNum(fin)+' / '+fmtNum(w.targetQty)+' '+esc(p.unit)+' — บันทึกผลผลิตให้ครบที่หน้า "บันทึกผลผลิตรายวัน" ก่อนส่งมอบ</p>'));
      }
      col.appendChild(box);
    });
    board.appendChild(col);
  });

  wrap.appendChild(board);
  if(!editable) wrap.appendChild(el('<div class="empty-locked" style="margin-top:14px">🔒 บทบาทปัจจุบันดูข้อมูลได้อย่างเดียว — สลับเป็น "ฝ่ายผลิต", "หัวหน้ากะ" หรือ "ผู้จัดการโรงงาน" เพื่อเลื่อนสถานะ</div>'));

  wrap.addEventListener('click', function(e){
    const startBtn = e.target.closest('[data-act="kanban-start"]');
    if(startBtn){
      const w = woById(startBtn.dataset.wo);
      openMaterialRequisitionModal(w);
      return;
    }
    const nextBtn = e.target.closest('[data-act="kanban-next"]');
    if(nextBtn){
      const w = woById(nextBtn.dataset.wo);
      const idx = KANBAN_STAGES.indexOf(kanbanStageOf(w));
      if(idx<KANBAN_STAGES.length-1){ w.kanbanStage = KANBAN_STAGES[idx+1]; saveState(); render(); }
      return;
    }
    const backBtn = e.target.closest('[data-act="kanban-back"]');
    if(backBtn){
      const w = woById(backBtn.dataset.wo);
      const idx = KANBAN_STAGES.indexOf(kanbanStageOf(w));
      if(idx>0){ w.kanbanStage = KANBAN_STAGES[idx-1]; saveState(); render(); }
      return;
    }
    const deliverBtn = e.target.closest('[data-act="kanban-deliver"]');
    if(deliverBtn){
      const w = woById(deliverBtn.dataset.wo);
      const p = productById(w.productId);
      const fin = finishedQtyOfWO(w);
      if(fin<w.targetQty) return toast('ยังบันทึกผลผลิตผ่าน QC ไม่ครบเป้าหมาย ('+fmtNum(fin)+' / '+fmtNum(w.targetQty)+')','critical');
      deliverWoToFG(w);
      saveState(); render();
      toast(w.id+' ส่งมอบเข้าคลังสินค้าสำเร็จรูปแล้ว — เพิ่มสต็อก '+fmtNum(w.targetQty)+' '+p.unit,'good');
      return;
    }
  });

  return wrap;
}

/* ======================= VIEW: SHOP FLOOR DAILY LOG ======================= */
function renderShopfloor(){
  const wrap = document.createElement('div');
  const editable = canEdit('shopfloor');
  const tabs = el('<div class="tabs-row"><button class="tab-btn'+(ui.shopTab==='today'?' active':'')+'" data-tab="today">บันทึกผลผลิตวันนี้</button><button class="tab-btn'+(ui.shopTab==='history'?' active':'')+'" data-tab="history">ประวัติย้อนหลัง</button></div>');
  wrap.appendChild(tabs);

  if(ui.shopTab==='today'){
    const card = el('<div class="card"></div>');
    card.appendChild(el('<div class="card-head"><div><h2>บันทึกยอดผลผลิตรายวัน — '+fmtDateThai(TODAY)+'</h2><p>กรอกจำนวนที่ผลิตได้ในกะวันนี้ แยกตามใบสั่งผลิตและขั้นตอนการผลิต</p></div></div>'));
    const tw = document.createElement('div'); tw.className='table-wrap';
    let rows=''; let rowIdx=0;
    state.workOrders.filter(function(w){ return w.started && w.status!=='เสร็จสิ้น'; }).forEach(function(w){
      const p = productById(w.productId);
      activeSteps(p).forEach(function(s){
        rowIdx++;
        const materialsTxt = p.bom.filter(function(c){ return (c.steps||[]).indexOf(s)!==-1; }).map(function(c){ return materialById(c.materialId).name; }).join(', ');
        const done = producedByStep(w.id, s);
        const backlog = Math.max(0, w.targetQty-done);
        rows += '<tr><td class="num mono">'+rowIdx+'</td><td class="mono">'+p.id+'</td><td style="max-width:220px">'+esc(materialsTxt)+'</td><td>'+s+'</td>'+
          '<td class="num mono">'+fmtNum(w.targetQty)+'</td><td class="num mono">'+fmtNum(done)+'</td>'+
          '<td class="num mono'+(backlog>0?' backlog-hi':'')+'">'+fmtNum(backlog)+'</td>'+
          (editable? '<td><input type="number" min="0" class="dailyQtyInput" data-wo="'+w.id+'" data-step="'+s+'" style="width:76px;padding:5px 6px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface)" placeholder="จำนวน"/></td>'+
          '<td><input type="number" min="0" class="dailyDefInput" data-wo="'+w.id+'" data-step="'+s+'" style="width:64px;padding:5px 6px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface)" placeholder="เสีย"/></td>'+
          '<td><button class="btn sm primary" data-act="save-log" data-wo="'+w.id+'" data-step="'+s+'">บันทึก</button></td>' : '<td colspan="3"></td>')+
          '</tr>';
      });
    });
    if(!rows) rows = '<tr><td colspan="10" class="helptext" style="padding:16px">ไม่มีใบสั่งผลิตที่เริ่มเดินไลน์ในขณะนี้</td></tr>';
    tw.innerHTML = '<table><thead><tr><th class="th-num">ลำดับ</th><th>รหัสสินค้า</th><th>วัตถุดิบ</th><th>ขั้นตอนผลิต</th><th class="th-num">เป้าหมาย</th><th class="th-num">ผลิตแล้ว</th><th class="th-num">ค้างผลิต</th><th class="th-center">จำนวนวันนี้</th><th class="th-center">ของเสีย</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
    card.appendChild(tw);
    if(!editable) card.appendChild(el('<div class="empty-locked">🔒 บทบาทปัจจุบันดูข้อมูลได้อย่างเดียว — สลับเป็น "ฝ่ายผลิต", "หัวหน้ากะ" หรือ "ผู้จัดการโรงงาน" เพื่อบันทึกยอดผลผลิต</div>'));
    wrap.appendChild(card);
  } else {
    const card = el('<div class="card"></div>');
    card.appendChild(el('<div class="card-head"><div><h2>ประวัติการบันทึกสะสมย้อนหลัง</h2><p>รายการบันทึกผลผลิตและของเสียทั้งหมด เรียงล่าสุดก่อน</p></div></div>'));
    const tw = document.createElement('div'); tw.className='table-wrap';
    let rows='';
    state.dailyLogs.slice().reverse().slice(0,60).forEach(function(l, i){
      const w = woById(l.woId); const p = w? productById(w.productId): null;
      rows += '<tr><td class="num mono">'+(i+1)+'</td><td class="mono">'+fmtDateThai(l.date)+'</td><td class="mono">'+l.woId+'</td><td>'+(p?esc(p.name):'-')+'</td><td>'+l.step+'</td><td class="num mono">'+fmtNum(l.qty)+'</td><td class="num mono">'+fmtNum(l.defect||0)+'</td></tr>';
    });
    tw.innerHTML = '<table><thead><tr><th class="th-num">ลำดับ</th><th>วันที่</th><th>WO</th><th>สินค้า</th><th>ขั้นตอน</th><th class="th-num">จำนวนที่ผลิต</th><th class="th-num">ของเสีย</th></tr></thead><tbody>'+rows+'</tbody></table>';
    card.appendChild(tw);
    wrap.appendChild(card);
  }

  wrap.addEventListener('click', function(e){
    const tabBtn = e.target.closest('[data-tab]');
    if(tabBtn){ ui.shopTab = tabBtn.dataset.tab; render(); return; }
    const saveBtn = e.target.closest('[data-act="save-log"]');
    if(saveBtn){
      const woId = saveBtn.dataset.wo, step = saveBtn.dataset.step;
      const qtyInput = wrap.querySelector('.dailyQtyInput[data-wo="'+woId+'"][data-step="'+step+'"]');
      const defInput = wrap.querySelector('.dailyDefInput[data-wo="'+woId+'"][data-step="'+step+'"]');
      const qty = parseFloat(qtyInput.value)||0;
      const def = parseFloat(defInput.value)||0;
      if(qty<=0 && def<=0) return toast('กรุณากรอกจำนวนที่ผลิตได้','critical');
      state.dailyLogs.push({id:'LOG-'+String(state.nextLogSeq++).padStart(4,'0'), date:TODAY, woId:woId, step:step, qty:qty, defect:def});
      const w = woById(woId);
      if(step==='QC'){
        const fin = finishedQtyOfWO(w);
        if(fin>=w.targetQty && !w.deliveredToFG){
          const p = productById(w.productId);
          deliverWoToFG(w);
          toast(w.id+' ผลิตครบเป้าหมาย — เพิ่มสต็อกสินค้าสำเร็จรูป '+fmtNum(w.targetQty)+' '+p.unit,'good');
        }
      }
      saveState(); render();
    }
  });
  return wrap;
}

/* ======================= VIEW: STOCK ======================= */
function renderStock(){

  const editable = canEdit('stock');

  const counts = { all: state.materials.length, good:0, warning:0, critical:0 };
  state.materials.forEach(function(m){ counts[stockStatus(m)]++; });
  const filterMeta = [
    {key:'all', label:'รายการทั้งหมด', color:null},
    {key:'good', label:'สถานะปกติ', color:'good'},
    {key:'warning', label:'ถึงจุดสั่งซื้อ', color:'warning'},
    {key:'critical', label:'วิกฤต', color:'critical'},

  const tiles = el('<div class="grid grid-4"></div>');
  tiles.innerHTML = filterMeta.map(function(f){

    '<div class="btn-row"><button class="btn sm" id="exportStockBtn">⇩ CSV</button><button class="btn sm" id="lineTestBtn">🔔 ทดสอบแจ้งเตือน LINE</button></div></div>'));

    const orderQty = suggestedOrderQty(m);
    rows += '<tr><td class="num mono">'+(i+1)+'</td><td class="mono">'+m.id+'</td><td>'+esc(m.name)+'</td><td class="num mono">'+fmtNum(m.stock,2)+' '+m.unit+'</td>'+
      '<td class="num mono">'+fmtNum(m.min)+'</td>'+
      '<td class="num mono">'+costCell+'</td>'+
      '<td><span class="pill '+st+'"><span class="dot"></span>'+(st==='good'?'ปกติ':st==='warning'?'ถึงจุดสั่งซื้อ':'วิกฤต')+'</span></td>'+
      '<td class="num mono">'+(orderQty>0? '<span style="font-weight:700;color:var(--critical)">'+fmtNum(orderQty)+' '+m.unit+'</span>'+(canEdit('pr')?' <button class="btn sm primary" data-act="request" data-id="'+m.id+'" title="ขอซื้อ">🛒</button>':'') : '—')+'</td>'+
      (editable? '<td class="btn-row"><button class="btn sm" data-act="out" data-id="'+m.id+'">เบิก</button><button class="btn sm" data-act="adj" data-id="'+m.id+'">±ADJ</button><button class="btn sm danger" data-act="del-material" data-id="'+m.id+'" title="ลบวัตถุดิบ">🗑</button></td>' : '<td></td>')+

  card.appendChild(tw);
  if(!editable) card.appendChild(el('<div class="empty-locked">🔒 บทบาทปัจจุบันดูข้อมูลได้อย่างเดียว — สลับเป็น "เจ้าหน้าที่คลัง" หรือ "ผู้จัดการโรงงาน" เพื่อเบิกใช้/ปรับยอด</div>'));
  wrap.appendChild(card);

  wrap.addEventListener('click', function(e){
    const filterBtn = e.target.closest('[data-stockfilter]');
    if(filterBtn){ ui.stockFilter = filterBtn.dataset.stockfilter; render(); return; }

      const headers=['รหัส','วัตถุดิบ','คงเหลือ','หน่วย','Min Stock','Safety Stock','ต้นทุน/หน่วยจริง','จำนวนที่ต้องสั่ง','ผู้จำหน่าย'];
      showExportModal('raw_material_stock.csv', headers, state.materials.map(function(m){ return [m.id,m.name,m.stock,m.unit,m.min,m.safety,effectiveUnitCost(m).toFixed(2),suggestedOrderQty(m),m.supplier]; }));
      return;
    }
    if(e.target.id==='lineTestBtn'){
      const short = state.materials.filter(function(m){ return stockStatus(m)!=='good'; });
      const msg = short.length===0? 'ไม่มีวัตถุดิบที่ต้องแจ้งเตือนในขณะนี้' :
        '[LINE Notify — จัดซื้อ] แจ้งเตือนวัตถุดิบถึงจุดสั่งซื้อซ้ำ:\n'+short.map(function(m){ return '• '+m.name+' คงเหลือ '+fmtNum(m.stock)+' '+m.unit; }).join('\n');
      openModal('ตัวอย่างข้อความแจ้งเตือน LINE (จำลอง)',
        '<p class="helptext">ตัวอย่างข้อความที่ระบบจะส่งเข้ากลุ่ม LINE Notify ฝ่ายจัดซื้อโดยอัตโนมัติเมื่อเชื่อมต่อ Webhook จริงแล้ว (การสาธิตนี้ไม่ได้ส่งข้อความออกจริง)</p>'+
        '<textarea class="code-block" readonly style="min-height:120px">'+esc(msg)+'</textarea>',
        '<button class="btn primary" id="modalCancel">ปิด</button>');
      document.getElementById('modalCancel').addEventListener('click', closeModal);
      return;
    }
    const btn = e.target.closest('[data-act]'); if(!btn) return;
    const m = materialById(btn.dataset.id); const act = btn.dataset.act;
    if(act==='del-material'){
      openDeleteMaterialConfirm(btn.dataset.id);
      return;
    }
    if(act==='request'){
      const suggested = Math.max(1, suggestedOrderQty(m));
      openModal('ขอซื้อวัตถุดิบ — '+m.name,
        '<p class="helptext">รายการนี้จะถูกเพิ่มเข้ารายการรอออกใบขอซื้อที่หน้า "ใบขอซื้อ (PR)" ซึ่งสามารถแก้ไขจำนวนและรวมกับรายการอื่นก่อนออกเป็น PR จริงได้</p>'+
        field('จำนวนที่ขอซื้อ ('+m.unit+')','reqQty','number',suggested),
        '<button class="btn ghost" id="modalCancel">ยกเลิก</button><button class="btn primary" id="confirmRequest">เพิ่มเข้ารายการขอซื้อ</button>');
      document.getElementById('modalCancel').addEventListener('click', closeModal);
      document.getElementById('confirmRequest').addEventListener('click', function(){
        const qty = parseFloat(document.getElementById('reqQty').value)||0;
        if(qty<=0) return toast('กรุณาระบุจำนวนที่มากกว่า 0','critical');
        addToPrDraft(m.id, qty);
        closeModal(); ui.view='pr'; ui.prTab='draft'; render();
        toast('เพิ่ม "'+m.name+'" เข้ารายการรอออกใบขอซื้อแล้ว','good');
      });
      return;
    }
    const titleMap = {out:'เบิกใช้วัตถุดิบ', adj:'ปรับยอดตรวจนับ (Adjust)'};
    openModal(titleMap[act]+' — '+m.name,
      field(act==='adj'? 'ยอดคงเหลือใหม่ ('+m.unit+')':'จำนวน ('+m.unit+')','stockQty','number',act==='adj'? m.stock:0)+
      '<div style="margin-top:10px">'+field('อ้างอิง / เลขที่เอกสาร','stockRef','text','')+'</div>',
      '<button class="btn ghost" id="modalCancel">ยกเลิก</button><button class="btn primary" id="saveStock">บันทึก</button>');
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('saveStock').addEventListener('click', function(){
      const val = parseFloat(document.getElementById('stockQty').value)||0;
      const ref = document.getElementById('stockRef').value||'-';
      if(act==='out'){ m.stock=Math.max(0,m.stock-val); state.stockLog.push({date:TODAY, materialId:m.id, type:'OUT', qty:val, ref:ref}); }
      if(act==='adj'){ const diff=val-m.stock; m.stock=val; state.stockLog.push({date:TODAY, materialId:m.id, type:'ADJUST', qty:diff, ref:ref}); }
      saveState(); closeModal(); render(); toast('บันทึกรายการเคลื่อนไหวสต็อกแล้ว','good');
    });
  });

  const logCard = el('<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>ประวัติการเคลื่อนไหวล่าสุด</h2></div></div></div>');
  const ltw = document.createElement('div'); ltw.className='table-wrap';
  let lrows='';
  state.stockLog.slice().reverse().slice(0,12).forEach(function(l){
    const mat = materialById(l.materialId);
    const typeColor = l.type==='IN'?'good':l.type==='OUT'?'critical':'warning';
    lrows += '<tr><td class="mono">'+fmtDateThai(l.date)+'</td><td>'+esc(mat.name)+'</td><td><span class="pill '+typeColor+'"><span class="dot"></span>'+l.type+'</span></td><td class="num mono">'+fmtNum(l.qty,2)+'</td><td class="mono">'+esc(l.ref)+'</td></tr>';
  });
  ltw.innerHTML = '<table><thead><tr><th class="th-num">ลำดับ</th><th>วันที่</th><th>วัตถุดิบ</th><th class="th-center">ประเภท</th><th class="th-num">จำนวน</th><th>อ้างอิง</th></tr></thead><tbody>'+lrows+'</tbody></table>';
  logCard.appendChild(ltw);
  wrap.appendChild(logCard);
  return wrap;
}

/* ======================= VIEW: WIP (WORK-IN-PROGRESS WAREHOUSE) ======================= */
function renderWIP(){
  const wrap = document.createElement('div');
  const openWOs = state.workOrders.filter(function(w){ return w.status!=='เสร็จสิ้น'; });
  const startedWOs = openWOs.filter(function(w){ return w.started; });
  const total = computeWipTotal();
  const materialIssued = startedWOs.reduce(function(s,w){
    const p = productById(w.productId);
    const matCost = p.bom.reduce(function(a,c){ return a+c.qty*effectiveUnitCost(materialById(c.materialId)); },0)/(1-p.scrapPct/100);
    return s+matCost*w.targetQty;
  },0);
  const laborAccrued = startedWOs.reduce(function(s,w){ const p=productById(w.productId); return s+laborTotal(p)*finishedQtyOfWO(w); },0);

  const tiles = el('<div class="grid grid-4"></div>');
  tiles.innerHTML =
    statTile('มูลค่างานระหว่างทำ (WIP) รวม', fmtTHB(total), openWOs.length+' ใบสั่งผลิตที่ยังเปิดอยู่') +
    statTile('ต้นทุนวัตถุดิบที่เบิกใช้แล้ว', fmtTHB(materialIssued), startedWOs.length+' ใบที่เริ่มเดินไลน์แล้ว') +
    statTile('ค่าแรงสะสมตามผลผลิตจริง', fmtTHB(laborAccrued), 'ตามยอดผ่าน QC สะสม') +
    statTile('ใบสั่งผลิตยังไม่เริ่มเดินไลน์', openWOs.length-startedWOs.length, 'รอตัดสต็อกวัตถุดิบ');
  wrap.appendChild(tiles);

  const card = el('<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>รายละเอียดงานระหว่างทำ</h2><p>ควบคุมมูลค่าจมในไลน์ผลิต และติดตามความคืบหน้าตามขั้นตอนล่าสุด</p></div></div></div>');
  const tw = document.createElement('div'); tw.className='table-wrap';
  let rows='';
  openWOs.forEach(function(w, i){
    const p = productById(w.productId);
    const fin = finishedQtyOfWO(w);
    const pct = Math.min(100, Math.round(fin/w.targetQty*100));
    const statusPill = w.status==='กำลังผลิต'?'warning':'neutral';
    const val = wipValue(w);
    const expanded = !!ui.wipExpanded[w.id];
    rows += '<tr><td class="num mono">'+(i+1)+'</td><td class="mono">'+w.id+'</td><td>'+esc(p.name)+'</td><td class="mono">'+esc(w.lotNo)+'</td>'+
      '<td class="th-center" style="text-align:center"><span class="pill '+statusPill+'"><span class="dot"></span>'+(w.started?w.status:'ยังไม่เริ่ม')+'</span></td>'+
      '<td class="num mono">'+fmtNum(fin)+' / '+fmtNum(w.targetQty)+' ('+pct+'%)</td>'+
      '<td class="num mono" style="font-weight:700">'+fmtTHB(val)+'</td>'+
      '<td><button type="button" class="btn sm" data-act="toggle-wip-detail" data-wo="'+w.id+'">'+(expanded?'▾ ซ่อน':'▸ รายละเอียด')+'</button></td></tr>';
    if(expanded){
      const logs = state.dailyLogs.filter(function(l){ return l.woId===w.id; }).slice().reverse();
      let logRows='';
      logs.forEach(function(l){

/* ======================= VIEW: AI & LINE NOTIFY ======================= */
function renderAI(){
  const wrap = document.createElement('div');
  wrap.appendChild(el('<div class="card"><div class="card-head"><div><h2>AI Production Optimizer</h2><p>คำแนะนำเชิงกฎวิเคราะห์ (rule-based) ที่จำลองการทำงานร่วมกับ AI Engine — ใช้ประกอบการตัดสินใจ ไม่ใช่คำสั่งอัตโนมัติ</p></div></div></div>'));

  const openWOs = state.workOrders.filter(function(w){ return w.status!=='เสร็จสิ้น' && w.started; });
  const backlogByStep = {};
  openWOs.forEach(function(w){
    const p = productById(w.productId);
    activeSteps(p).forEach(function(s){ backlogByStep[s]=(backlogByStep[s]||0)+Math.max(0, w.targetQty-producedByStep(w.id,s)); });
  });
  let bottleneckStep=null, maxBacklog=0;
  Object.keys(backlogByStep).forEach(function(k){ if(backlogByStep[k]>maxBacklog){ maxBacklog=backlogByStep[k]; bottleneckStep=k; } });

  const grouped = {};
  state.workOrders.filter(function(w){ return !w.started; }).forEach(function(w){ grouped[w.productId]=(grouped[w.productId]||[]).concat(w.id); });
  const changeoverNote = Object.keys(grouped).filter(function(k){ return grouped[k].length>1; });

  const costliest = state.materials.slice().sort(function(a,b){ return effectiveUnitCost(b)-effectiveUnitCost(a); })[0];

  const cards = document.createElement('div');
  cards.style.marginTop='16px';
  cards.appendChild(el(
    '<div class="ai-card"><b>🎯 จัดลำดับคิวการผลิต</b><p>'+
    (changeoverNote.length? 'พบใบสั่งผลิตสินค้าเดียวกันหลายใบที่ยังไม่เริ่มเดินไลน์ ('+changeoverNote.map(function(id){return productById(id).name;}).join(', ')+') แนะนำจัดคิวให้ต่อเนื่องกันเพื่อลดจำนวนครั้งการตั้งเครื่อง (setup) ตัด/เชื่อม/พ่นสี' : 'ขณะนี้คิวการผลิตกระจายตัวดี ไม่พบสินค้าเดียวกันที่ควรจัดคิวติดกันเพิ่มเติม')+
    '</p></div>'
  ));
  cards.appendChild(el(
    '<div class="ai-card"><b>⚠️ จุดเสี่ยงคอขวด (Bottleneck)</b><p>'+
    (bottleneckStep? 'ขั้นตอน "'+bottleneckStep+'" มียอดค้างผลิตสะสมสูงสุด ('+fmtNum(maxBacklog)+' หน่วย) จากใบสั่งผลิตที่เปิดอยู่ แนะนำเสริมกำลังคนหรือเครื่องจักรในขั้นตอนนี้เพื่อลดการค้างสะสม' : 'ยังไม่พบขั้นตอนที่มีงานค้างผิดปกติในขณะนี้')+
    '</p></div>'
  ));
  cards.appendChild(el(
    '<div class="ai-card"><b>💡 แนวทางลดต้นทุน</b><p>'+
    '"'+costliest.name+'" เป็นวัตถุดิบที่มีต้นทุนต่อหน่วยสูงที่สุด ('+fmtTHB(effectiveUnitCost(costliest))+'/'+costliest.unit+') แนะนำเจรจาสัญญาซื้อล่วงหน้า (Forward Contract) กับ '+esc(costliest.supplier)+' หรือสั่งซื้อปริมาณมากเพื่อรับส่วนลดขั้นบันได'+
    '</p></div>'
  ));
  const shortages = state.materials.filter(function(m){ return stockStatus(m)!=='good'; });
  if(shortages.length){
    cards.appendChild(el(
      '<div class="ai-card"><b>📦 ความเสี่ยงวัตถุดิบขาดสต็อก</b><p>'+
      'วัตถุดิบ '+shortages.map(function(m){return m.name;}).join(', ')+' ใกล้หรือต่ำกว่าจุดสั่งซื้อซ้ำ อาจกระทบกำหนดส่งมอบหากมีใบสั่งผลิตใหม่เข้ามา แนะนำเปิดใบขอซื้อล่วงหน้าก่อนวางแผนผลิตรอบถัดไป'+
      '</p></div>'
    ));
  }
  wrap.appendChild(cards);

  const lineCard = el('<div class="card" style="margin-top:16px"><div class="card-head"><div><h2>LINE Notify ฝ่ายจัดซื้อ</h2><p>ทดสอบข้อความแจ้งเตือนเมื่อวัตถุดิบต่ำกว่า Safety Stock (ไปที่หน้า "คลังวัตถุดิบ" เพื่อทดสอบส่งข้อความ)</p></div></div></div>');
  wrap.appendChild(lineCard);
  return wrap;
}

function categoryInUse(name){ return state.products.some(function(p){ return p.category===name; }); }
function materialCategoryInUse(name){ return state.materials.some(function(m){ return m.category===name; }); }
function stepInUse(name){ return state.products.some(function(p){ return p.bom.some(function(c){ return (c.steps||[]).indexOf(name)!==-1; }); }); }
function operatorInUse(name){ return state.workOrders.some(function(w){ return w.subWoOperator && Object.keys(w.subWoOperator).some(function(k){ return w.subWoOperator[k]===name; }); }); }
function settingsRenameCategory(oldName, newName){ state.products.forEach(function(p){ if(p.category===oldName) p.category=newName; }); }
function settingsRenameMatCategory(oldName, newName){ state.materials.forEach(function(m){ if(m.category===oldName) m.category=newName; }); }
function settingsRenameStep(oldName, newName){
  state.products.forEach(function(p){
    p.bom.forEach(function(c){ c.steps=(c.steps||[]).map(function(s){ return s===oldName?newName:s; }); });
    if(p.laborByStep && Object.prototype.hasOwnProperty.call(p.laborByStep, oldName)){
      p.laborByStep[newName] = p.laborByStep[oldName];
      delete p.laborByStep[oldName];
    }
  });
  state.dailyLogs.forEach(function(l){ if(l.step===oldName) l.step=newName; });
}

    const listOf = { cat:state.categories, matcat:state.materialCategories, dept:state.departments, step:state.productionSteps, operator:state.operators };
    const inUseOf = { cat:categoryInUse, matcat:materialCategoryInUse, dept:function(){return false;}, step:stepInUse, operator:operatorInUse };
    const labelOf = { cat:'หมวดหมู่สินค้า', matcat:'หมวดหมู่วัตถุดิบ', dept:'แผนก', step:'ขั้นตอนผลิต', operator:'ผู้ปฏิบัติงาน' };

    const addBtn = e.target.closest('[data-add]');
    if(addBtn){
      const key = addBtn.dataset.add;
      const input = document.getElementById('newItem_'+key);
      const val = (input.value||'').trim();
      if(!val) return toast('กรุณาระบุชื่อรายการ','critical');
      const list = listOf[key];
      if(list.indexOf(val)!==-1) return toast('มีรายการนี้อยู่แล้ว','critical');
      list.push(val); saveState(); render(); toast('เพิ่ม'+labelOf[key]+' "'+val+'" แล้ว','good');
      return;
    }
    const rmBtn = e.target.closest('[data-rm]');
    if(rmBtn){
      const key = rmBtn.dataset.rm; const idx = parseInt(rmBtn.dataset.idx,10);
      const list = listOf[key]; const name = list[idx];
      if(key==='step' && name==='QC') return toast('QC เป็นขั้นตอนบังคับสุดท้ายของทุกสินค้า ไม่สามารถลบได้','critical');
      if(list.length<=1) return toast('ต้องมีอย่างน้อย 1 รายการ','critical');
      if(inUseOf[key](name)) return toast('"'+name+'" ถูกใช้งานอยู่ในข้อมูลปัจจุบัน กรุณาเปลี่ยนรายการที่เกี่ยวข้องก่อนลบ','critical');
      list.splice(idx,1); saveState(); render(); toast('ลบ'+labelOf[key]+' "'+name+'" แล้ว','good');
      return;
    }
    const moveBtn = e.target.closest('[data-stepmove]');
    if(moveBtn){
      const idx = parseInt(moveBtn.dataset.idx,10);
      const dir = moveBtn.dataset.stepmove==='up'? -1 : 1;
      const list = state.productionSteps;
      const swapIdx = idx+dir;
      if(swapIdx<0 || swapIdx>=list.length) return;
      const tmp = list[idx]; list[idx]=list[swapIdx]; list[swapIdx]=tmp;
      saveState(); render();
      return;
    }

    if(e.target.id==='saveSheetUrlBtn'){
      const val = (document.getElementById('sheetUrlInput').value||'').trim();
      config.sheetApiUrl = val; saveConfig(); render();
      toast(val? 'บันทึก Web App URL แล้ว' : 'ล้างการเชื่อมต่อ Google Sheet แล้ว', 'good');
      return;
    }
    if(e.target.id==='testSheetBtn'){
      const url = (document.getElementById('sheetUrlInput').value||'').trim();
      if(!url) return toast('กรุณากรอก Apps Script Web App URL ก่อน','critical');
      const resultEl = document.getElementById('ecountTestResult');
      toast('กำลังทดสอบการเชื่อมต่อ...', 'good');
      fetch(url+'?action=ping').then(function(r){ return r.json(); }).then(function(res){
        toast(res.ok? 'เชื่อมต่อ Google Sheet สำเร็จ ✓' : 'เชื่อมต่อไม่สำเร็จ: '+res.message, res.ok?'good':'critical');
      }).catch(function(err){ toast('เชื่อมต่อไม่สำเร็จ: '+err, 'critical'); });
      return;
    }
    if(e.target.id==='pullBtn'){ syncPull(false); return; }
    if(e.target.id==='pushBtn'){ syncPush(false); return; }
    if(e.target.id==='ecountTestBtn'){
      const resultEl = document.getElementById('ecountTestResult');
      resultEl.textContent = 'กำลังทดสอบ...';
      ecountTestConnection().then(function(res){
        resultEl.textContent = (res.ok? '✓ ' : '✗ ') + res.message;
      }).catch(function(err){ resultEl.textContent = '✗ '+err; });
      return;
    }
  });
  wrap.addEventListener('change', function(e){
    if(e.target.id==='autoSyncToggle'){ config.autoSync = e.target.checked; saveConfig(); toast(config.autoSync? 'เปิดซิงค์อัตโนมัติแล้ว':'ปิดซิงค์อัตโนมัติแล้ว','good'); return; }
  });

  wrap.addEventListener('change', function(e){
    if(!editable) return;
    const input = e.target.closest('[data-rename]'); if(!input) return;
    const key = input.dataset.rename; const idx = parseInt(input.dataset.idx,10);
    const listOf = { cat:state.categories, matcat:state.materialCategories, dept:state.departments, step:state.productionSteps, operator:state.operators };
    const list = listOf[key];
    const oldName = list[idx];
    const newName = (input.value||'').trim();
    if(!newName){ input.value=oldName; return toast('ชื่อรายการห้ามว่าง','critical'); }
    if(newName===oldName) return;
    if(list.indexOf(newName)!==-1){ input.value=oldName; return toast('มีรายการนี้อยู่แล้ว','critical'); }
    if(key==='step' && oldName==='QC'){ input.value=oldName; return toast('QC เป็นขั้นตอนบังคับสุดท้ายของทุกสินค้า ไม่สามารถแก้ไขชื่อได้','critical'); }
    list[idx] = newName;
    if(key==='cat') settingsRenameCategory(oldName, newName);
    if(key==='matcat') settingsRenameMatCategory(oldName, newName);
    if(key==='step') settingsRenameStep(oldName, newName);
    if(key==='operator') state.workOrders.forEach(function(w){ if(w.subWoOperator) Object.keys(w.subWoOperator).forEach(function(k){ if(w.subWoOperator[k]===oldName) w.subWoOperator[k]=newName; }); });
    saveState(); render(); toast('เปลี่ยนชื่อเป็น "'+newName+'" แล้ว','good');
  });

  return wrap;
}

/* ======================= WIRING ======================= */
const VIEW_RENDERERS = {
  overview: renderOverview, bom: renderBOM, cost: renderCost, mrp: renderMRP, pr: renderPR,
  wo: renderWO, kanban: renderKanban, shopfloor: renderShopfloor, stock: renderStock, wip: renderWIP, fg: renderFG,
  ai: renderAI, settings: renderSettings,
};
function initRoleSelect(){
  const sel = document.getElementById('roleSelect');
  Object.keys(ROLES).forEach(function(k){ sel.appendChild(el('<option value="'+k+'">'+ROLES[k].label+'</option>')); });
  sel.value = ui.role;
  sel.addEventListener('change', function(){ ui.role = sel.value; render(); });
}
document.getElementById('themeToggle').addEventListener('click', function(){
  const rootEl = document.documentElement;
  const cur = rootEl.getAttribute('data-theme');
  if(cur==='dark'){ rootEl.setAttribute('data-theme','light'); }
  else if(cur==='light'){ rootEl.removeAttribute('data-theme'); }
  else { rootEl.setAttribute('data-theme','dark'); }
});
document.getElementById('resetBtn').addEventListener('click', function(){
  openModal('รีเซ็ตข้อมูลตัวอย่าง','<p class="helptext">การรีเซ็ตจะล้างข้อมูลที่บันทึกไว้ในเบราว์เซอร์นี้ทั้งหมด และกลับไปใช้ข้อมูลตัวอย่างเริ่มต้น ต้องการดำเนินการต่อหรือไม่?</p>',
    '<button class="btn ghost" id="modalCancel">ยกเลิก</button><button class="btn danger" id="confirmReset">รีเซ็ตข้อมูล</button>');
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('confirmReset').addEventListener('click', function(){ closeModal(); resetData(); });
});
document.getElementById('menuBtn').addEventListener('click', function(){ document.getElementById('sidebar').classList.toggle('open'); });
document.getElementById('syncStatusTag').addEventListener('click', function(){ ui.view='settings'; ui.settingsTab='integrations'; render(); });

try{
  initRoleSelect();
  render();
  if(apiConfigured() && config.autoSync){ syncPull(true); }
}catch(bootErr){
  console.error('Fatal boot error:', bootErr);
  document.body.innerHTML =
    '<div style="max-width:640px;margin:60px auto;padding:24px;font-family:sans-serif;line-height:1.6;color:#222">'+
      '<h2>ระบบเปิดไม่สำเร็จ</h2>'+
      '<p>เกิดข้อผิดพลาดที่ทำให้ระบบเริ่มทำงานไม่ได้ กดปุ่มด้านล่างเพื่อล้างข้อมูลเก่าที่อาจค้างอยู่ในเบราว์เซอร์นี้แล้วเริ่มใหม่ (ข้อมูลที่เคยกรอกไว้ในเครื่องนี้จะถูกล้างไปด้วย) หรือคัดลอกข้อความด้านล่างส่งกลับมาเพื่อให้ช่วยตรวจสอบ</p>'+
      '<button id="emergencyResetBtn" style="padding:10px 16px;font-size:14px;cursor:pointer;margin-bottom:14px">ล้างข้อมูลเก่าแล้วเริ่มใหม่</button>'+
      '<pre style="white-space:pre-wrap;background:#f3f3f3;padding:12px;border-radius:8px;font-size:12px;color:#333">'+esc(String(bootErr&&bootErr.stack||bootErr))+'</pre>'+
    '</div>';
  const emergencyBtn = document.getElementById('emergencyResetBtn');
  if(emergencyBtn) emergencyBtn.addEventListener('click', function(){
    try{ localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(CONFIG_KEY); }catch(e){}
    location.reload();
  });
}
</script>
