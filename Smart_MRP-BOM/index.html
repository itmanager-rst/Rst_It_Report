<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart MRP & BOM สูตรการผลิต — RST ASIA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">MRP&nbsp;&amp;<br/>BOM</div>
      <div class="brand-text"><b>Smart MRP & BOM สูตรการผลิต</b><span>RST ASIA — อุปกรณ์ต่อพ่วงรถแทรกเตอร์</span></div>
    </div>
    <div id="nav-list"></div>
    <div class="sidebar-foot">
      <div class="role-picker">
        <label for="roleSelect">บทบาทผู้ใช้งาน (RBAC)</label>
        <select class="role-select" id="roleSelect"></select>
      </div>
      <div class="ghost-btn-row">
        <button class="btn ghost sm" id="themeToggle" style="flex:1" title="สลับโหมดสี">🌓 โหมดสี</button>
        <button class="btn ghost sm" id="resetBtn" style="flex:1" title="รีเซ็ตข้อมูลตัวอย่าง">↺ รีเซ็ต</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="btn ghost sm menu-btn" id="menuBtn">☰</button>
      <div>
        <h1 id="viewTitle">ภาพรวม</h1>
        <div class="sub" id="viewSub">สรุปสถานะโรงงานแบบเรียลไทม์</div>
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-meta">
        <button type="button" class="tag-sync" id="syncStatusTag" title="สถานะการซิงค์กับ Google Sheet — คลิกเพื่อไปตั้งค่า">⚪ ยังไม่เชื่อมต่อ Google Sheet</button>
        <span class="tag-role" id="roleTag">ผู้จัดการโรงงาน</span>
        <span id="todayDate"></span>
      </div>
    </div>
    <div class="view-root" id="viewRoot"></div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>
<div id="modalRoot"></div>
<div id="print-area"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
