<title>Smart MRP & BOM สูตรการผลิต — RST ASIA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#f6f5f0;
    --page:#f0eee6;
    --surface:#fefdfa;
    --surface-2:#f0eee5;
    --surface-3:#e7e4d9;
    --text-primary:#1b1a15;
    --text-secondary:#5c574c;
    --text-muted:#8b8577;
    --border:rgba(27,26,21,0.11);
    --border-strong:rgba(27,26,21,0.20);
    --accent:#2c5f8a;
    --accent-strong:#1d4665;
    --accent-soft:#e4edf5;
    --accent-ink:#ffffff;
    --good:#0ca30c;
    --warning:#c98500;
    --serious:#ec835a;
    --critical:#d03b3b;
    --good-soft:#e5f6e1;
    --warning-soft:#fdf1da;
    --serious-soft:#fce6dc;
    --critical-soft:#fbe3e3;
    --series-1:#2a78d6;
    --series-2:#eb6834;
    --series-3:#1baf7a;
    --series-4:#eda100;
    --series-5:#4a3aa7;
    --shadow:0 1px 2px rgba(27,26,21,0.06), 0 8px 24px -12px rgba(27,26,21,0.18);
    --radius:10px;
    --radius-lg:16px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111411;
      --page:#0c0e0c;
      --surface:#181b18;
      --surface-2:#1f231f;
      --surface-3:#282c27;
      --text-primary:#f4f3ee;
      --text-secondary:#bcb7a9;
      --text-muted:#847f70;
      --border:rgba(255,255,255,0.10);
      --border-strong:rgba(255,255,255,0.18);
      --accent:#5b9bd5;
      --accent-strong:#8fc1e8;
      --accent-soft:rgba(91,155,213,0.16);
      --accent-ink:#0b2338;
      --good:#3fca3f;
      --warning:#fab219;
      --serious:#ec835a;
      --critical:#e66767;
      --good-soft:rgba(63,202,63,0.14);
      --warning-soft:rgba(250,178,25,0.14);
      --serious-soft:rgba(236,131,90,0.14);
      --critical-soft:rgba(230,103,103,0.14);
      --series-1:#3987e5;
      --series-2:#d95926;
      --series-3:#199e70;
      --series-4:#c98500;
      --series-5:#9085e9;
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111411;
    --page:#0c0e0c;
    --surface:#181b18;
    --surface-2:#1f231f;
    --surface-3:#282c27;
    --text-primary:#f4f3ee;
    --text-secondary:#bcb7a9;
    --text-muted:#847f70;
    --border:rgba(255,255,255,0.10);
    --border-strong:rgba(255,255,255,0.18);
    --accent:#5b9bd5;
    --accent-strong:#8fc1e8;
    --accent-soft:rgba(91,155,213,0.16);
    --accent-ink:#0b2338;
    --good:#3fca3f;
    --warning:#fab219;
    --serious:#ec835a;
    --critical:#e66767;
    --good-soft:rgba(63,202,63,0.14);
    --warning-soft:rgba(250,178,25,0.14);
    --serious-soft:rgba(236,131,90,0.14);
    --critical-soft:rgba(230,103,103,0.14);
    --series-1:#3987e5;
    --series-2:#d95926;
    --series-3:#199e70;
    --series-4:#c98500;
    --series-5:#9085e9;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page);
    color:var(--text-primary);
    font-family:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,-apple-system,sans-serif;
    font-size:14.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:"Kanit","IBM Plex Sans Thai",sans-serif;
    font-weight:700;
    margin:0;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
  a{color:var(--accent);}
  ::selection{background:var(--accent-soft);}

  /* ---------- shell layout ---------- */
  .shell{display:flex; min-height:100vh;}
  .sidebar{
    width:252px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 14px; gap:4px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
    transition:transform .2s ease;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 16px; border-bottom:1px solid var(--border); margin-bottom:12px;}
  .brand-mark{
    min-width:38px; height:38px; padding:2px 6px; border-radius:9px; background:linear-gradient(155deg,var(--accent),var(--accent-strong));
    color:var(--accent-ink); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    font-family:"Kanit",sans-serif; font-weight:800; font-size:9.5px; line-height:1.15; letter-spacing:-.2px; flex:none; box-shadow:var(--shadow);
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.2;}
  .brand-text b{font-family:"Kanit",sans-serif; font-size:16px; font-weight:700;}
  .brand-text span{font-size:11px; color:var(--text-muted);}

  .nav-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); padding:14px 10px 6px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; cursor:pointer;
    color:var(--text-secondary); font-weight:500; font-size:13.6px; border:1px solid transparent; user-select:none;
  }
  .nav-item:hover{background:var(--surface-2); color:var(--text-primary);}
  .nav-item.active{background:var(--accent-soft); color:var(--accent-strong); font-weight:600;}
  .nav-item .ic{width:18px; text-align:center; flex:none; font-size:14.5px;}
  .nav-item .badge-mini{
    margin-left:auto; font-size:10.5px; padding:1px 6px; border-radius:99px; background:var(--critical-soft); color:var(--critical); font-weight:600;
  }

  .sidebar-foot{margin-top:auto; padding-top:12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px;}
  .role-picker{display:flex; flex-direction:column; gap:4px;}
  .role-picker label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted);}
  select.role-select{
    width:100%; padding:8px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text-primary);
    font-weight:600; font-size:13px;
  }
  .ghost-btn-row{display:flex; gap:6px;}

  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:14px;
    padding:14px 26px; background:color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
  }
  .topbar h1{font-size:20px;}
  .topbar .sub{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
  .topbar-spacer{flex:1;}
  .topbar-meta{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-secondary);}
  .menu-btn{display:none;}

  .view-root{padding:22px 26px 60px; max-width:1400px; width:100%; margin:0 auto;}

  /* ---------- components ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:18px 20px; box-shadow:var(--shadow);
  }
  .card + .card{margin-top:16px;}
  .card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px;}
  .card-head h2{font-size:16.5px;}
  .card-head p{margin:3px 0 0; font-size:12.5px; color:var(--text-muted); max-width:60ch;}

  .grid{display:grid; gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:1.3fr 1fr;}
  @media (max-width:1080px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr 1fr;} }
  @media (max-width:620px){ .grid-4{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr;} }

  .stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px 18px; box-shadow:var(--shadow);}
  .stat-tile .label{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:600;}
  .stat-tile .value{font-family:"Kanit",sans-serif; font-size:26px; font-weight:700; margin-top:6px; font-variant-numeric:tabular-nums;}
  .stat-tile .delta{font-size:12px; margin-top:5px; display:flex; align-items:center; gap:5px; color:var(--text-secondary);}
  .stat-tile .delta.up{color:var(--good);}
  .stat-tile .delta.down{color:var(--critical);}

  table{width:100%; border-collapse:collapse; font-size:13.3px;}
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted);
    padding:8px 10px; border-bottom:1px solid var(--border-strong); font-weight:600; white-space:nowrap;
  }
  td{padding:10px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr:hover{background:var(--surface-2);}
  .table-wrap{overflow-x:auto; border-radius:10px;}
  .num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right;}

  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600; white-space:nowrap;}
  .pill.good{background:var(--good-soft); color:var(--good);}
  .pill.warning{background:var(--warning-soft); color:var(--warning);}
  .pill.serious{background:var(--serious-soft); color:var(--serious);}
  .pill.critical{background:var(--critical-soft); color:var(--critical);}
  .pill.neutral{background:var(--surface-3); color:var(--text-secondary);}
  .pill .dot{width:6px; height:6px; border-radius:99px; background:currentColor;}

  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:8px; border:1px solid var(--border-strong);
    background:var(--surface); color:var(--text-primary); font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2);}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
  .btn.primary:hover{background:var(--accent-strong);}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--text-secondary);}
  .btn.ghost:hover{background:var(--surface-2); color:var(--text-primary);}
  .btn.sm{padding:5px 10px; font-size:12px; border-radius:7px;}
  .btn[disabled]{opacity:.42; cursor:not-allowed;}
  .btn.danger{color:var(--critical);}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap;}

  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11.5px; font-weight:600; color:var(--text-secondary);}
  .field input, .field select, .field textarea{
    padding:8px 10px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text-primary); width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;}

  .empty-locked{
    display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-muted); background:var(--surface-2);
    border:1px dashed var(--border-strong); border-radius:8px; padding:9px 12px; margin-top:10px;
  }

  .kanban{display:grid; grid-template-columns:repeat(5,minmax(210px,1fr)); gap:12px; overflow-x:auto;}
  @media (max-width:1080px){ .kanban{grid-template-columns:repeat(5,240px);} }
  .kanban-col{background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:9px; min-height:220px;}
  .kanban-col-head{display:flex; align-items:center; justify-content:space-between; padding:2px 4px 6px; border-bottom:1px solid var(--border);}
  .kanban-col-head b{font-size:12.5px;}
  .kanban-count{font-size:11px; color:var(--text-muted); font-family:"IBM Plex Mono",monospace;}
  .kanban-card{background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:10px 11px; box-shadow:var(--shadow);}
  .kanban-card .wo-id{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--text-muted);}
  .kanban-card .prod{font-weight:600; font-size:13px; margin:2px 0 6px;}
  .kanban-card .prog-bar{height:6px; border-radius:99px; background:var(--surface-3); overflow:hidden; margin:6px 0;}
  .kanban-card .prog-bar > i{display:block; height:100%; background:var(--accent);}
  .kanban-card .qty-row{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-secondary); font-family:"IBM Plex Mono",monospace;}
  .kanban-card .card-actions{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px;}

  .alert-row{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; border:1px solid var(--border);}
  .alert-row + .alert-row{margin-top:7px;}
  .alert-row .ic{font-size:15px; flex:none;}
  .alert-row .txt{flex:1; font-size:13px;}
  .alert-row .txt b{font-weight:600;}
  .alert-row .txt span{display:block; font-size:11.5px; color:var(--text-muted);}

  .toast-stack{position:fixed; right:18px; bottom:18px; z-index:200; display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
  .toast{
    background:var(--text-primary); color:var(--bg); padding:10px 15px; border-radius:9px; font-size:12.8px; font-weight:500;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.4); max-width:340px; animation:toastin .18s ease;
  }
  @keyframes toastin{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .modal-overlay{position:fixed; inset:0; background:rgba(10,10,8,0.5); backdrop-filter:blur(2px); z-index:150; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); width:min(560px,100%); max-height:88vh; overflow-y:auto; box-shadow:var(--shadow);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
  .modal-head h3{font-size:16px;}
  .modal-body{padding:18px 20px;}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}
  .close-x{background:none; border:none; font-size:18px; color:var(--text-muted); cursor:pointer; line-height:1;}
  textarea.code-block{
    width:100%; min-height:220px; font-family:"IBM Plex Mono",monospace; font-size:11.8px; border-radius:9px;
    border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text-primary); padding:12px; white-space:pre;
  }

  .tag-role{font-size:11px; padding:2px 8px; border-radius:99px; background:var(--accent-soft); color:var(--accent-strong); font-weight:700;}
  .tag-sync{font-size:11px; padding:2px 8px; border-radius:99px; background:var(--surface-2); color:var(--text-secondary); font-weight:700; border:1px solid var(--border); cursor:pointer; font-family:inherit;}
  .tag-sync:hover{border-color:var(--border-strong);}
  .tag-sync.ok{background:var(--good-soft); color:var(--good);}
  .tag-sync.syncing{background:var(--warning-soft); color:var(--warning);}
  .tag-sync.error{background:var(--critical-soft); color:var(--critical);}

  .bignum{font-family:"Kanit",sans-serif; font-weight:700; font-variant-numeric:tabular-nums;}
  .section-title{font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); font-weight:700; margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .helptext{font-size:12.3px; color:var(--text-muted); line-height:1.55;}
  .divider{height:1px; background:var(--border); margin:16px 0;}

  .ai-card{border-left:3px solid var(--accent); background:var(--accent-soft); border-radius:0 10px 10px 0; padding:12px 14px;}
  .ai-card + .ai-card{margin-top:10px;}
  .ai-card b{display:block; font-size:13.3px; margin-bottom:3px;}
  .ai-card p{margin:0; font-size:12.6px; color:var(--text-secondary); line-height:1.55;}

  .chip-btn{
    border:1px solid var(--border-strong); background:var(--surface); border-radius:7px; padding:6px 10px; font-size:12.3px; font-weight:600; cursor:pointer;
  }
  .chip-btn:hover{background:var(--surface-2);}
  .chip-btn.selected{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
  .step-chips{display:flex; flex-wrap:wrap; gap:4px;}
  .step-chip{font-size:10.5px; padding:2px 7px; border-radius:99px; background:var(--surface-3); color:var(--text-muted); font-weight:600; border:none; font-family:inherit;}
  .step-chip.active{background:var(--accent-soft); color:var(--accent-strong);}
  button.step-chip{cursor:pointer;}
  button.step-chip:hover{background:var(--border-strong); color:var(--text-primary);}
  button.step-chip.active:hover{filter:brightness(0.92);}
  .tabs-row{display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid var(--border);}
  .tab-btn{padding:9px 4px; margin-bottom:-1px; border:none; background:none; border-bottom:2px solid transparent; color:var(--text-muted); font-weight:600; font-size:13.3px; cursor:pointer;}
  .tab-btn.active{color:var(--accent-strong); border-bottom-color:var(--accent);}
  .search-input{padding:8px 12px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text-primary); min-width:220px;}
  .backlog-hi{color:var(--critical); font-weight:700;}
  th.th-num{text-align:right;}
  th.th-center{text-align:center;}
  .active-toggle{display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none;}
  .modal-box.wide{width:min(760px,100%);}
  .modal-box.full{width:min(1680px,96vw); max-height:94vh;}
  .modal-box.full .table-wrap{max-height:56vh; overflow-y:auto;}
  .kanban-board{display:flex; gap:12px; overflow-x:auto; padding-bottom:8px;}
  .kanban-col{flex:0 0 240px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px; min-height:120px;}
  .kanban-col-head{font-weight:700; font-size:13px; display:flex; justify-content:space-between; align-items:center; padding:2px 4px 6px; border-bottom:1px solid var(--border);}
  .kanban-card{background:var(--surface); border:1px solid var(--border-strong); border-radius:10px; padding:10px; box-shadow:var(--shadow-sm,none);}
  .kanban-card .wo-id{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12.5px;}
  .kanban-card .prod-name{font-size:12.5px; margin:2px 0 6px; color:var(--text-secondary);}
  .kanban-card .btn-row{margin-top:8px; gap:6px;}
  .mini-line-form{display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; align-items:end; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px;}
  .checkbox-cell{text-align:center;}
  input[type="checkbox"]{width:16px; height:16px; accent-color:var(--accent);}
  .settings-item{display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2);}
  .settings-item + .settings-item{margin-top:6px;}
  .settings-item input[type="text"]{flex:1; padding:6px 9px; border-radius:6px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text-primary);}
  .settings-item .idx{font-size:11px; color:var(--text-muted); width:20px; text-align:center; flex:none;}
  .kpi-filter{cursor:pointer; user-select:none; transition:border-color .12s,box-shadow .12s;}
  .kpi-filter:hover{border-color:var(--border-strong);}
  .kpi-filter.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), var(--shadow);}

  svg.chart text{font-family:"IBM Plex Mono",monospace; fill:var(--text-muted); font-size:9.5px;}

  #print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block; position:absolute; top:0; left:0; width:100%; padding:16px;}
    .no-print{display:none !important;}
  }
  .print-header{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #111; padding-bottom:10px; margin-bottom:14px;}
  .print-header h2{font-size:20px;}

function loadState(){

/* Backfills any fields missing from an older cached state (from a previous version of this
   app) so newer code that expects them never crashes on load. Every revision that adds a new
   top-level or per-item field to the data model should get a line here. */
function migrateState(s){
  if(!s || typeof s!=='object') return seedData();
  const d = seedData();
  ['materials','products','workOrders','dailyLogs','stockLog','sales'].forEach(function(k){
    if(!Array.isArray(s[k])) s[k] = d[k];
  });
  if(!Array.isArray(s.categories) || !s.categories.length) s.categories = d.categories.slice();
  if(!Array.isArray(s.materialCategories) || !s.materialCategories.length) s.materialCategories = d.materialCategories.slice();
  if(!Array.isArray(s.departments) || !s.departments.length) s.departments = d.departments.slice();
  if(!Array.isArray(s.productionSteps) || !s.productionSteps.length) s.productionSteps = d.productionSteps.slice();
  if(typeof s.webhookUrl!=='string') s.webhookUrl = '';
  if(typeof s.nextWoSeq!=='number') s.nextWoSeq = d.nextWoSeq;
  if(typeof s.nextPrSeq!=='number') s.nextPrSeq = d.nextPrSeq;
  if(typeof s.nextSoSeq!=='number') s.nextSoSeq = d.nextSoSeq;
  if(typeof s.nextLogSeq!=='number') s.nextLogSeq = d.nextLogSeq;

  s.materials.forEach(function(m){
    if(typeof m.category!=='string' || !m.category) m.category = s.materialCategories[0]||'อื่นๆ';
    if(typeof m.min!=='number') m.min = 0;
    if(typeof m.safety!=='number') m.safety = 0;
    if(typeof m.stock!=='number') m.stock = 0;
    if(typeof m.unitCost!=='number') m.unitCost = 0;
    if(typeof m.supplier!=='string') m.supplier = '';
  });
  s.products.forEach(function(p){
    if(typeof p.category!=='string' || !p.category) p.category = s.categories[0]||'อื่นๆ';
    if(!Array.isArray(p.bom)) p.bom = [];
    p.bom.forEach(function(c){ if(!Array.isArray(c.steps)) c.steps = []; });
    if(typeof p.active!=='boolean') p.active = true;
    if(typeof p.stock!=='number') p.stock = 0;
    if(!p.laborByStep || typeof p.laborByStep!=='object'){
      // migrate the old fixed laborWeld/laborAssemble split into per-step labor (hours × rate/ชม.)
      // hours:1 preserves the old flat baht figure exactly as the rate, so stdCost is unchanged
      // until the user edits the hours/rate fields themselves.
      p.laborByStep = {};
      s.productionSteps.forEach(function(step){ p.laborByStep[step] = {hours:0, rate:0}; });
      if('เชื่อม' in p.laborByStep) p.laborByStep['เชื่อม'] = {hours:1, rate:p.laborWeld||0};
      if('ประกอบ' in p.laborByStep) p.laborByStep['ประกอบ'] = {hours:1, rate:p.laborAssemble||0};
    }
  });
  s.workOrders.forEach(function(w){
    if(!w.matDates || typeof w.matDates!=='object') w.matDates = {};
  });
  if(!Array.isArray(s.purchaseRequests)) s.purchaseRequests = [];
  s.purchaseRequests = s.purchaseRequests.map(function(r){
    if(!Array.isArray(r.items)) r = { id:r.id, items: r.materialId? [{materialId:r.materialId, qty:r.qty||0}] : [], requestedDate:r.requestedDate, status:r.status, approvedDate:r.approvedDate||null };
    if(typeof r.neededDate==='undefined') r.neededDate = null;
    return r;
  });
  if(!Array.isArray(s.operators)) s.operators = d.operators.slice();
  s.workOrders.forEach(function(w){
    if(!w.subWoNotes || typeof w.subWoNotes!=='object') w.subWoNotes = {};
    if(!w.subWoOperator || typeof w.subWoOperator!=='object') w.subWoOperator = {};
    if(typeof w.deliveredToFG!=='boolean') w.deliveredToFG = false;
    if(typeof w.kanbanStage!=='string') w.kanbanStage = null;
  });
  return s;
}

/* ======================= GOOGLE SHEET SYNC (Apps Script Web App) =======================
 * ระบบนี้เก็บข้อมูลหลักไว้ใน localStorage ของเบราว์เซอร์เสมอ (ทำงานได้แม้ไม่ได้ต่อเน็ต)
 * และซิงค์ขึ้น/ลง Google Sheet ผ่าน Apps Script Web App เมื่อผู้ใช้ตั้งค่า URL ไว้ที่
 * หน้า "ตั้งค่า > การเชื่อมต่อ" — ตัว URL เดียวกันนี้ยังใช้เป็นช่องทาง proxy ไปยัง ECOUNT API ด้วย

 * publish เป็นเว็บสาธารณะบน GitHub Pages)
 */
const CONFIG_KEY = 'agriforgeMrp_config_v1';
function loadConfig(){
  try{ const raw = localStorage.getItem(CONFIG_KEY); if(raw) return Object.assign({sheetApiUrl:'', autoSync:false}, JSON.parse(raw)); }catch(e){}
  return { sheetApiUrl:'', autoSync:false };
}
function saveConfig(){ try{ localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }catch(e){} }
let config = loadConfig();
let syncState = { status:'idle', lastSyncAt:null, lastError:'' }; // idle | syncing | ok | error
let syncPushTimer = null;
function apiConfigured(){ return !!(config.sheetApiUrl && config.sheetApiUrl.trim()); }
function scheduleAutoSync(){
  if(!config.autoSync || !apiConfigured()) return;
  if(syncPushTimer) clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(function(){ syncPush(true); }, 1500);
}
function renderSyncTag(){
  const tag = document.getElementById('syncStatusTag');
  if(!tag) return;
  tag.classList.remove('ok','syncing','error');
  if(!apiConfigured()){ tag.textContent = '⚪ ยังไม่เชื่อมต่อ Google Sheet'; return; }
  if(syncState.status==='syncing'){ tag.classList.add('syncing'); tag.textContent = '🔄 กำลังซิงค์...'; return; }
  if(syncState.status==='error'){ tag.classList.add('error'); tag.textContent = '⚠ ซิงค์ผิดพลาด (คลิกดูรายละเอียด)'; return; }
  if(syncState.status!=='ok' || !syncState.lastSyncAt){ tag.textContent = '🟡 ตั้งค่าแล้ว ยังไม่เคยซิงค์'; return; }
  const t = new Date(syncState.lastSyncAt).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  tag.classList.add('ok');
  tag.textContent = '🟢 เชื่อมต่อ Google Sheet • ล่าสุด '+t;
}
function syncPull(silent){
  if(!apiConfigured()) return Promise.resolve();
  syncState.status='syncing'; renderSyncTag();
  return fetch(config.sheetApiUrl+'?action=getState')
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(!res.ok) throw new Error(res.message||'ดึงข้อมูลไม่สำเร็จ');
      if(!res.state || !res.state.materials || !res.state.materials.length){
        syncState.status='ok'; syncState.lastSyncAt=Date.now(); syncState.lastError=''; renderSyncTag();
        if(!silent) toast('Google Sheet ยังไม่มีข้อมูล — กด "ส่งข้อมูลขึ้น Sheet" เพื่อสร้างฐานข้อมูลเริ่มต้นจากข้อมูลปัจจุบันก่อน','warning');
        return;
      }
      state = migrateState(res.state);
      persistLocal();
      syncState.status='ok'; syncState.lastSyncAt=Date.now(); syncState.lastError='';
      render();
      if(!silent) toast('ดึงข้อมูลจาก Google Sheet เรียบร้อย','good');
    })
    .catch(function(err){
      syncState.status='error'; syncState.lastError=String(err); renderSyncTag();

function fmtTHB(n){ n=Number(n)||0; return n.toLocaleString('th-TH',{minimumFractionDigits:2, maximumFractionDigits:2}); }

function findSimilarMaterials(name){

}

function activeSteps(product){
  const set=[];
  product.bom.forEach(function(c){ (c.steps||[]).forEach(function(s){ if(set.indexOf(s)===-1) set.push(s); }); });
  if(set.indexOf('QC')===-1) set.push('QC'); // QC is the universal final gating step for every product
  return state.productionSteps.filter(function(s){ return set.indexOf(s)!==-1; });
}
function effectiveUnitCost(mat){
  // Some materials are purchased as large bulk sheets/lengths and cut down per BOM line —
  // their real per-usage-unit cost is derived from the bulk purchase economics, not a flat rate.
  if(mat.bulk && mat.bulk.yieldQty){
    const usable = mat.bulk.yieldQty * (1-((mat.bulk.wastePct||0)/100));
    return usable>0? mat.bulk.bulkCost/usable : mat.unitCost;
  }
  return mat.unitCost;
}
function productLaborByStep(p){
  // Defensive getter (same pattern as matDates/subWoNotes): p.laborByStep may be absent when
  // loadState() returns seedData() directly (bypassing migrateState) on a fresh/first load, or on
  // an older product created before per-step labor existed. Each step resolves to {hours, rate}
  // (เวลาที่ใช้ผลิต ชม. × ค่าแรง/ชม.). A legacy flat baht number per step (from the previous
  // per-step revision) is treated as hours:1 so its total baht cost is unchanged. Falls all the
  // way back to the old fixed laborWeld/laborAssemble split (also as hours:1) for pre-per-step data.
  const o = {};
  state.productionSteps.forEach(function(s){ o[s] = {hours:0, rate:0}; });
  if(p.laborByStep){
    Object.keys(p.laborByStep).forEach(function(k){
      const v = p.laborByStep[k];
      if(v && typeof v==='object') o[k] = {hours:v.hours||0, rate:v.rate||0};
      else o[k] = {hours:1, rate:v||0};
    });
  } else {
    if('เชื่อม' in o) o['เชื่อม'] = {hours:1, rate:p.laborWeld||0};
    if('ประกอบ' in o) o['ประกอบ'] = {hours:1, rate:p.laborAssemble||0};
  }
  return o;
}
function hmToDecimalHours(v){
  // "เวลาที่ใช้ผลิต (ชม.)" is entered clock-style (ชม.นาที), not true decimal hours: the digits
  // after the point ARE minutes, e.g. 0.1 -> 10 นาที (not 6 นาที), 1.30 -> 1 ชม. 30 นาที. Converts
  // to true decimal hours for cost math (0.1 -> 0+10/60 = 0.1667 ชม.). Whole numbers (1, 2, ...) are
  // unaffected since their fractional part is 0 — so legacy hours:1 fallback data still computes
  // the exact same baht totals as before.
  v = Number(v)||0;
  const h = Math.trunc(v);
  const mm = Math.round((Math.abs(v)-Math.abs(h))*100);
  return h + (v<0?-1:1)*(mm/60);
}
function fmtHM(v){
  // Display helper matching hmToDecimalHours' clock-style parsing: 0.1 -> "0 ชม. 10 นาที".
  v = Number(v)||0;
  const h = Math.trunc(v);
  const mm = Math.round((Math.abs(v)-Math.abs(h))*100);
  return h+' ชม. '+mm+' นาที';
}
function laborCostByStep(p){
  const raw = productLaborByStep(p);
  const o = {};
  Object.keys(raw).forEach(function(k){ o[k] = hmToDecimalHours(raw[k].hours||0)*(raw[k].rate||0); });
  return o;
}
function laborTotal(product){
  const o = laborCostByStep(product);
  return Object.keys(o).reduce(function(s,k){ return s+(o[k]||0); },0);
}
function productMaterialCostAfterScrap(p){
  const matCost = p.bom.reduce(function(s,c){ const m=materialById(c.materialId); return m? s+c.qty*effectiveUnitCost(m) : s; },0);
  return matCost/(1-(p.scrapPct||0)/100);
}
function productOverheadPct(p){
  // Defensive getter: overheadPct is a new field (default 10% for every new formula). Older
  // products only ever stored a flat baht `overhead` figure, so back-derive the equivalent
  // percentage of (material-after-scrap + labor) here — this keeps stdCost() identical to
  // before for existing products unless the user explicitly edits the % in the formula popup.
  if(p.overheadPct!==undefined && p.overheadPct!==null) return p.overheadPct;
  const base = productMaterialCostAfterScrap(p)+laborTotal(p);
  return base>0 ? (p.overhead||0)/base*100 : 10;
}
function overheadAmount(p){
  const base = productMaterialCostAfterScrap(p)+laborTotal(p);
  return base*productOverheadPct(p)/100;
}
function stdCost(product){
  return productMaterialCostAfterScrap(product) + laborTotal(product) + overheadAmount(product);
}
function suggestedPrice(product){ return stdCost(product)*(1+product.markupPct/100); }
function sellPrice(product){ return product.price; } // the real, editable selling price (may differ from the markup-suggested price)
function marginInfo(product){
  const cost=stdCost(product), price=sellPrice(product);
  return { cost:cost, price:price, profit:price-cost, pct: price? (price-cost)/price*100 : 0 };
}
function stockStatus(m){
  if(m.stock < m.safety) return 'critical';
  if(m.stock < m.min) return 'warning';

}
function suggestedOrderQty(m){ return Math.max(0, Math.ceil((m.min+m.safety)-m.stock)); }
function producedByStep(woId, step){

function defectByStep(woId, step){

}
function finishedQtyOfWO(wo){
  const p=productById(wo.productId); const steps=activeSteps(p);
  const lastStep = steps[steps.length-1];
  return lastStep? producedByStep(wo.id, lastStep) : 0;
}

function copyText(text){
  function done(ok){ toast(ok? 'คัดลอกไปยังคลิปบอร์ดแล้ว':'คัดลอกไม่สำเร็จ กรุณาคัดลอกด้วยตนเอง', ok?'good':'critical'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }).catch(function(){ done(false); });
  } else {
    try{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(true); }catch(e){ done(false); }
  }
}
function csvEscape(v){ v=String(v===undefined||v===null?'':v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function toCSV(headers, rows){ const lines=[headers.map(csvEscape).join(',')]; rows.forEach(function(r){ lines.push(r.map(csvEscape).join(',')); }); return lines.join('\r\n'); }

  );

function parseCSVLine(line){
  const result=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQ){ if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; } else cur+=ch; }
    else { if(ch==='"') inQ=true; else if(ch===','){ result.push(cur); cur=''; } else cur+=ch; }
  }
  result.push(cur);
  return result.map(function(s){ return s.trim(); });
}
function parseCSV(text){
  return text.split(/\r\n|\n/).filter(function(l){ return l.trim()!==''; }).map(parseCSVLine);
}

/* ======================= SVG CHART HELPERS ======================= */
function barChart(data, opts){
  opts = opts||{};
  const w = opts.width||480, h = opts.height||190, padL=34, padB=30, padT=10, padR=10;
  const max = Math.max.apply(null, data.map(function(d){ return d.value; }).concat([1]));
  const bw = (w-padL-padR)/data.length;
  let bars='', grid='';
  for(let i=0;i<=4;i++){
    const y = padT + (h-padT-padB)*(1-i/4);
    grid += '<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>';
    grid += '<text x="4" y="'+(y+3)+'">'+Math.round(max*i/4)+'</text>';
  }
  data.forEach(function(d,i){
    const bh = (h-padT-padB) * (d.value/max);
    const x = padL + i*bw + bw*0.16;
    const bwid = bw*0.68;
    const y = h-padB-bh;
    bars += '<rect x="'+x+'" y="'+y+'" width="'+bwid+'" height="'+bh+'" rx="4" fill="'+(d.color||'var(--series-1)')+'"><title>'+esc(d.label)+': '+d.value+'</title></rect>';
    bars += '<text x="'+(x+bwid/2)+'" y="'+(h-padB+14)+'" text-anchor="middle">'+esc(d.label)+'</text>';
    bars += '<text x="'+(x+bwid/2)+'" y="'+(y-5)+'" text-anchor="middle" fill="var(--text-secondary)" font-weight="600">'+d.value+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;">'+grid+bars+'</svg>';
}
function sparklineArea(points, opts){
  opts = opts||{};
  const w = opts.width||760, h = opts.height||150, padL=8,padR=8,padT=14,padB=22;
  const max = Math.max.apply(null, points.map(function(p){return p.value;}).concat([1]));
  const stepX = (w-padL-padR) / (points.length-1||1);
  let path='', dots='', labels='';
  points.forEach(function(p,i){
    const x = padL + i*stepX;
    const y = padT + (h-padT-padB) * (1 - (p.value)/(max||1));
    path += (i===0?'M':'L') + x.toFixed(1)+','+y.toFixed(1)+' ';
    if(i===0 || i===points.length-1 || i%3===0) labels += '<text x="'+x+'" y="'+(h-4)+'" text-anchor="middle">'+esc(p.label)+'</text>';
    if(i===points.length-1) dots += '<circle cx="'+x+'" cy="'+y+'" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
  });
  const areaPath = path + 'L'+(padL+(points.length-1)*stepX).toFixed(1)+','+(h-padB)+' L'+padL+','+(h-padB)+' Z';
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;">'+
    '<defs><linearGradient id="sparkfill2" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+areaPath+'" fill="url(#sparkfill2)" stroke="none"/>'+
    '<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+labels+'</svg>';
}

      '<textarea class="code-block" readonly style="min-height:120px">'+esc('หน้า: '+ui.view+'\n'+String(err&&err.stack||err))+'</textarea></div>';

function stepChips(steps, opts){
  opts = opts || {};

      return '<button type="button" class="step-chip'+(active?' active':'')+'" data-toggle-step="1" data-pid="'+esc(opts.pid)+'" data-idx="'+opts.idx+'" data-step="'+esc(s)+'" title="กดเพื่อ'+(active?'เอาออกจาก':'เพิ่มเข้า')+'ขั้นตอนนี้">'+esc(s)+'</button>';
    }).join('')+'</div>';

  return '<div class="step-chips">'+state.productionSteps.map(function(s){
    return '<span class="step-chip'+((steps||[]).indexOf(s)!==-1?' active':'')+'">'+s+'</span>';

function computeSalesSummary(){
  let revenue=0, cogs=0;
  state.sales.forEach(function(s){ const p=productById(s.productId); revenue += sellPrice(p)*s.qty; cogs += stdCost(p)*s.qty; });
  return { revenue:revenue, cogs:cogs, profit:revenue-cogs, pct: revenue? (revenue-cogs)/revenue*100:0 };
}
function computeWipTotal(){
  let total=0;
  state.workOrders.filter(function(w){ return w.status!=='เสร็จสิ้น'; }).forEach(function(w){ total += wipValue(w); });
  return total;
}
function wipValue(w){
  if(!w.started) return 0;
  const p = productById(w.productId);
  const matCost = p.bom.reduce(function(s,c){ return s+c.qty*effectiveUnitCost(materialById(c.materialId)); },0)/(1-p.scrapPct/100);
  const issuedMaterial = matCost*w.targetQty;
  const laborAccrued = laborTotal(p)*finishedQtyOfWO(w);
  return issuedMaterial+laborAccrued;
}

    const stepToggleBtn = e.target.closest('[data-toggle-step]');
    if(stepToggleBtn){
      const p = productById(stepToggleBtn.dataset.pid);
      const line = p.bom[parseInt(stepToggleBtn.dataset.idx,10)];
      const step = stepToggleBtn.dataset.step;
      line.steps = line.steps || [];
      const pos = line.steps.indexOf(step);
      if(pos!==-1) line.steps.splice(pos,1); else line.steps.push(step);
      saveState(); render();
      return;
    }
    const toggleBtn = e.target.closest('[data-act="toggle-active"]');
    if(toggleBtn){
      const p = productById(toggleBtn.dataset.pid);
      p.active = p.active===false? true : false;
      saveState(); render(); toast(p.active? p.name+' เปิดใช้งานแล้ว' : p.name+' ปิดใช้งานแล้ว (จะไม่แสดงในหน้าต้นทุนการผลิต)','good');
      return;
    }
    const applyBtn = e.target.closest('[data-act="apply-suggested"]');
    if(applyBtn){
      const p = productById(applyBtn.dataset.pid);
      p.price = Math.round(suggestedPrice(p)*100)/100;
      saveState(); render(); toast('ใช้ราคาขายแนะนำเป็นราคาขายจริงแล้ว','good');
      return;
    }
    const addBtn = e.target.closest('[data-act="add-line"]');
    if(addBtn) return openAddLineModal(addBtn.dataset.pid);
    const editBtn = e.target.closest('[data-act="edit-line"]');
    if(editBtn) return openAddLineModal(editBtn.dataset.pid, parseInt(editBtn.dataset.idx,10));
    const delBtn = e.target.closest('[data-act="del-line"]');
    if(delBtn){
      const p = productById(delBtn.dataset.pid);
      p.bom.splice(parseInt(delBtn.dataset.idx,10),1);
      saveState(); render(); toast('ลบรายการวัตถุดิบแล้ว','good');
      return;
    }
    const delProductBtn = e.target.closest('[data-act="del-product"]');
    if(delProductBtn){
      openDeleteProductConfirm(delProductBtn.dataset.pid);
      return;
    }
    const editProductBtn = e.target.closest('[data-act="edit-product"]');
    if(editProductBtn){
      openEditFormulaModal(editProductBtn.dataset.pid);
      return;
    }
  });

  const importInput = wrap.querySelector('#importXlsxInput');
  if(importInput){
    importInput.addEventListener('change', function(e){
      const file = e.target.files[0]; if(!file) return;
      if(!xlsxReady()){ importInput.value=''; return; }
      const reader = new FileReader();
      reader.onload = function(ev){ previewExcelImport(parseWorkbookRows(ev.target.result)); };
      reader.readAsArrayBuffer(file);
      importInput.value='';
    });
  }

  return wrap;
}

function downloadBomTemplateXlsx(){
  if(!xlsxReady()) return;
  const data = [
    ['รหัสสินค้า','รหัสวัตถุดิบ','ชื่อวัตถุดิบ','จำนวนที่ใช้','หน่วย','ราคา/หน่วย','ขั้นตอนผลิต'],
    ['TI-101','MAT-201','ตัวอย่าง: เหล็กแผ่น SS400',10,'กก.',32,'ตัด+เจียร์+เชื่อม'],
  ];
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:12},{wch:12},{wch:30},{wch:12},{wch:8},{wch:10},{wch:18}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'BOM Template');
  XLSX.writeFile(wb, 'bom_template.xlsx');
}
function parseWorkbookRows(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
  return rows.filter(function(r){ return r.some(function(v){ return String(v).trim()!==''; }); });
}
function previewExcelImport(rows){
  if(rows.length && /รหัสสินค้า|รหัสวัตถุดิบ|ชื่อวัตถุดิบ/.test(rows[0].join(''))) rows.shift();
  const parsed = rows.map(function(r){
    const pid=String(r[0]||'').trim(), matCode=String(r[1]||'').trim(), matName=String(r[2]||'').trim(),
      qty=parseFloat(r[3])||0, unit=String(r[4]||'').trim(), priceVal=parseFloat(r[5])||0, stepsStr=String(r[6]||'').trim();
    const p = productById(pid);
    const steps = stepsStr.split(/[+\/,]/).map(function(s){ return s.trim(); }).filter(function(s){ return state.productionSteps.indexOf(s)!==-1; });
    if(matCode){
      // "coded" row: the file gives an explicit รหัสวัตถุดิบ, so the row unambiguously means
      // "product (pid) uses this material" — pid auto-resolves/auto-creates silently (no ambiguity there).
      // The real per-row decision is only about the material itself when it doesn't exist yet: should it
      // become a "งานระหว่างทำ" item (its own product record, so it can get its own formula/routing later —
      // still attached to THIS product's BOM either way) or a plain "คลังวัตถุดิบ" purchased material?
      const mat = materialById(matCode);
      const matExistsAsProduct = !mat && !!productById(matCode);
      const willCreate = !mat && !!matName;
      const action = willCreate ? (matExistsAsProduct ? 'wip' : (/^r/i.test(matCode) ? 'material' : 'wip')) : null;
      return { mode:'coded', pid:pid, product:p, matCode:matCode, matName:matName, mat:mat, willCreate:willCreate, matExistsAsProduct:matExistsAsProduct, unit:unit, priceVal:priceVal, steps:steps, qty:qty, action:action };
    }
    // "legacy" row: no material code at all given — the รหัสสินค้า cell itself may just be a bare
    // material/product code (older-format files with no separate material-code column)
    const mat = state.materials.find(function(m){ return m.name.indexOf(matName)!==-1 || matName.indexOf(m.name)!==-1; });
    const willCreate = !mat && !!matName;
    const action = (!p && pid) ? (/^r/i.test(pid) ? 'material' : 'wip') : null;
    return { mode:'legacy', pid:pid, product:p, matCode:'', matName:matName, mat:mat, willCreate:willCreate, unit:unit, priceVal:priceVal, steps:steps, qty:qty, action:action };
  });
  function rowOk(r){
    if(r.mode==='coded'){
      if(!r.pid || r.qty<=0) return false;
      return !!(r.mat || (r.willCreate && r.action));
    }
    if(r.product) return !!((r.mat||r.willCreate) && r.qty>0);
    if(!r.pid) return false;
    if(r.action==='wip') return !!((r.mat||r.willCreate) && r.qty>0);
    if(r.action==='material') return true;
    return false;
  }
  function renderPreview(){
    let rowsHtml='';
    parsed.forEach(function(r, i){
      let statusHtml, actionCell = '<td></td>';
      const autoParentNote = (r.mode==='coded' && !r.product) ? '<br/><span class="helptext" style="font-size:10.5px">🆕 จะสร้างสินค้า '+esc(r.pid)+' ใหม่ด้วย</span>' : '';
      if(r.mode==='coded'){
        if(!r.pid) statusHtml = '<span class="pill critical"><span class="dot"></span>ไม่พบรหัสสินค้า</span>';

        else if(r.mat) statusHtml = '<span class="pill good"><span class="dot"></span>ใช้วัตถุดิบเดิม '+esc(r.mat.id)+'</span>'+autoParentNote;
        else if(r.willCreate){
          statusHtml = (r.action==='wip'
            ? '<span class="pill warning"><span class="dot"></span>🆕 จะสร้างวัตถุดิบใหม่ (งานระหว่างทำ)'+(r.matExistsAsProduct?' — มีสินค้านี้อยู่แล้ว':'')+'</span>'
            : '<span class="pill warning"><span class="dot"></span>🆕 จะสร้างวัตถุดิบใหม่ (คลังวัตถุดิบ)</span>')+autoParentNote;
          actionCell = '<td><select class="pid-action-select" data-idx="'+i+'" style="font-size:12px">'+
            '<option value="wip"'+(r.action==='wip'?' selected':'')+'>+ รหัสงานระหว่างทำ</option>'+
            '<option value="material"'+(r.action==='material'?' selected':'')+'>+ รหัสคลังวัตถุดิบ</option>'+
          '</select></td>';
        } else statusHtml = '<span class="pill critical"><span class="dot"></span>ไม่พบวัตถุดิบ</span>';
      } else if(r.product){
        if(r.qty<=0) statusHtml = '<span class="pill critical"><span class="dot"></span>จำนวนไม่ถูกต้อง</span>';
        else if(r.mat) statusHtml = '<span class="pill good"><span class="dot"></span>ใช้วัตถุดิบเดิม '+esc(r.mat.id)+'</span>';
        else if(r.willCreate) statusHtml = '<span class="pill warning"><span class="dot"></span>🆕 จะสร้างวัตถุดิบใหม่'+(r.matCode?' ('+esc(r.matCode)+')':'')+'</span>';

      } else if(!r.pid){

      } else {

      (needsActionCount? '<div class="btn-row" style="margin-bottom:8px;align-items:center">'+
        '<span class="helptext">ตั้งค่าทั้งหมด ('+needsActionCount+' แถวที่ต้องเลือกประเภท):</span>'+

      '<div class="table-wrap"><table><thead><tr><th class="th-num">ลำดับ</th><th>รหัสสินค้า</th><th>รหัสวัตถุดิบ (จากไฟล์)</th><th>วัตถุดิบ (จากไฟล์)</th><th class="th-num">จำนวน</th><th class="th-center">สถานะ</th><th>การดำเนินการ</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>',
      '<button class="btn ghost" id="modalCancel">ยกเลิก</button><button class="btn primary" id="confirmImportBtn">ยืนยันนำเข้า ('+okCount+' แถว)</button>',

        }
        if(!r.product && r.action==='material'){
          if(!materialById(r.pid)){
            const mat = { id:r.pid, name:r.matName||r.pid, category:state.materialCategories[0], unit:r.unit||'หน่วย', unitCost:r.priceVal||0, stock:0, min:0, safety:0, supplier:'' };
            state.materials.push(mat);
            createdStandaloneMatCount++; createdStandaloneMatIds.push(mat.id);
          }
          return;
        }
        let product = r.product;
        if(!product && r.action==='wip'){
          product = productById(r.pid);
          if(!product){
            product = { id:r.pid, name:r.matName? ('สินค้าใหม่ - '+r.matName) : r.pid, category:state.categories[0]||'อื่นๆ', unit:'ชุด', active:true, stock:0, bom:[], scrapPct:0, laborWeld:0, laborAssemble:0, overhead:0, markupPct:30 };
            state.products.push(product);
            createdParentProductCount++; createdParentProductIds.push(product.id);
          }
        }
        if(!product) return;
        let mat = r.mat || (r.matCode && materialById(r.matCode));
        if(!mat){
          const matId = (r.matCode && !materialById(r.matCode)) ? r.matCode : nextMaterialId();
          mat = { id:matId, name:r.matName, category:state.materialCategories[0], unit:r.unit||'หน่วย', unitCost:r.priceVal||0, stock:0, min:0, safety:0, supplier:'' };
          state.materials.push(mat);
          createdMatCount++; createdMatIds.push(matId);
        }
        product.bom.push({materialId:mat.id, qty:r.qty, steps:r.steps.length? r.steps: ['ประกอบ']});
        count++;
      });
      saveState(); closeModal(); render();
      let msg = 'นำเข้าข้อมูล BOM แล้ว '+count+' แถว';
      if(createdParentProductCount) msg += ' — สร้างสินค้าใหม่ '+createdParentProductCount+' รายการ ('+createdParentProductIds.join(', ')+')';
      if(createdWipComponentCount) msg += ' — สร้างชิ้นงานระหว่างทำใหม่ (มีสูตรของตัวเองได้) '+createdWipComponentCount+' รายการ ('+createdWipComponentIds.join(', ')+')';
      if(createdMatCount) msg += ' — เพิ่มวัตถุดิบใหม่ '+createdMatCount+' รายการ ('+createdMatIds.join(', ')+')';
      if(createdStandaloneMatCount) msg += ' — เพิ่มวัตถุดิบใหม่จากรหัสที่เลือก "+รหัสคลังวัตถุดิบ" '+createdStandaloneMatCount+' รายการ ('+createdStandaloneMatIds.join(', ')+')';
      if(createdParentProductCount||createdWipComponentCount||createdMatCount||createdStandaloneMatCount) msg += ' — สต็อกเริ่มต้น 0 กรุณาไปตรวจสอบ/ปรับปรุงข้อมูล';
      toast(msg,'good');
    });
  }
  renderPreview();
}

function nfReadFieldsIntoDraft(){
  const d = newFormulaDraft;
  d.category = document.getElementById('nfCategory').value;
  d.code = document.getElementById('nfCode').value.trim();
  d.name = document.getElementById('nfName').value.trim();
  d.unit = document.getElementById('nfUnit').value.trim()||'ชุด';
  d.active = document.getElementById('nfActive').value==='1';
  d.scrapPct = parseFloat(document.getElementById('nfScrap').value)||0;
  const laborByStep = {};
  document.querySelectorAll('.nf-labor-hours').forEach(function(inp){
    const step = inp.dataset.step;
    if(!laborByStep[step]) laborByStep[step] = {hours:0, rate:0};
    laborByStep[step].hours = parseFloat(inp.value)||0;
  });
  document.querySelectorAll('.nf-labor-rate').forEach(function(inp){
    const step = inp.dataset.step;
    if(!laborByStep[step]) laborByStep[step] = {hours:0, rate:0};
    laborByStep[step].rate = parseFloat(inp.value)||0;
  });
  d.laborByStep = laborByStep;
  d.overheadPct = parseFloat(document.getElementById('nfOverheadPct').value)||0;
  d.markupPct = parseFloat(document.getElementById('nfMarkup').value)||0;
}
function nfLaborTotal(d){
  return Object.keys(d.laborByStep||{}).reduce(function(s,k){ const hr=d.laborByStep[k]||{hours:0,rate:0}; return s+hmToDecimalHours(hr.hours||0)*(hr.rate||0); },0);
}
function refreshNfLines(){
  const d = newFormulaDraft;
  const wrapEl = document.getElementById('nfLinesWrap');
  if(!wrapEl) return;
  if(!d.lines.length){
    wrapEl.innerHTML = '<div class="helptext">ยังไม่มีรายการวัตถุดิบ — เพิ่มด้วยฟอร์มด้านบน หรือ Import จาก Excel</div>';
  } else {
    let rows='';
    let matCost=0;
    d.lines.forEach(function(l, idx){
      const isNew = !l.materialId && l.newMaterial;
      const code = isNew? (l.newMaterial.code||'(อัตโนมัติ)') : materialById(l.materialId).id;
      const name = isNew? l.newMaterial.name : materialById(l.materialId).name;
      const unit = isNew? (l.newMaterial.unit||'') : materialById(l.materialId).unit;
      const eff = nfLineUnitCost(l);
      matCost += l.qty*eff;
      const badges = (isNew? ' <span class="pill warning" style="font-size:9.5px">🆕 ใหม่</span>' : '') +
        (l.possibleDup? ' <span class="pill critical" style="font-size:9.5px" title="'+esc(l.possibleDup)+'">⚠ คล้ายของเดิม</span>' : '');
      rows += '<tr><td class="num mono">'+(idx+1)+'</td><td class="mono">'+esc(code)+'</td><td>'+esc(name)+badges+'</td><td>'+stepChips(l.steps)+'</td><td class="num mono">'+fmtNum(l.qty,3)+' '+esc(unit)+'</td><td class="num mono">'+fmtTHB(l.qty*eff)+'</td>'+
        '<td><button type="button" class="btn sm danger" data-nfdel="'+idx+'">✕</button></td></tr>';
    });
    wrapEl.innerHTML = '<div class="table-wrap"><table><thead><tr><th class="th-num">ลำดับ</th><th>รหัสสินค้า</th><th>วัตถุดิบ</th><th>ขั้นตอน</th><th class="th-num">จำนวน</th><th class="th-num">ต้นทุน</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  updateNfCostSummary();
}
function nfLineUnitCost(l){
  if(l.materialId) return effectiveUnitCost(materialById(l.materialId));
  if(l.newMaterial) return l.newMaterial.unitCost||0;
  return 0;
}
function updateNfCostSummary(){
  nfReadFieldsIntoDraft();
  const d = newFormulaDraft;
  document.querySelectorAll('.nf-labor-line-total').forEach(function(cell){
    const hr = d.laborByStep[cell.dataset.step]||{hours:0,rate:0};
    cell.textContent = fmtTHB(hmToDecimalHours(hr.hours||0)*(hr.rate||0));
  });
  document.querySelectorAll('.nf-labor-hm-hint').forEach(function(hint){
    const hr = d.laborByStep[hint.dataset.step]||{hours:0,rate:0};
    hint.textContent = fmtHM(hr.hours||0);
  });
  const laborSum = nfLaborTotal(d);
  const grandTotalEl = document.getElementById('nfLaborGrandTotal');
  if(grandTotalEl) grandTotalEl.textContent = fmtTHB(laborSum);
  const matCost = d.lines.reduce(function(s,l){ return s+l.qty*nfLineUnitCost(l); },0);
  const afterScrap = matCost/(1-(d.scrapPct||0)/100);
  const overheadAmt = (afterScrap+laborSum)*(d.overheadPct||0)/100;
  const cost = afterScrap+laborSum+overheadAmt;
  const price = cost*(1+d.markupPct/100);
  const summaryEl = document.getElementById('nfCostSummary');
  if(summaryEl) summaryEl.innerHTML = 'ต้นทุนวัตถุดิบ (หลังหักสูญเสีย) '+fmtTHB(afterScrap)+' &nbsp;+&nbsp; ค่าแรงรวม '+fmtTHB(laborSum)+' &nbsp;+&nbsp; ค่าโสหุ้ย ('+fmtNum(d.overheadPct,1)+'%) '+fmtTHB(overheadAmt)+' &nbsp;=&nbsp; ต้นทุนรวม/หน่วย <span style="color:var(--accent-strong)">'+fmtTHB(cost)+'</span> &nbsp;|&nbsp; ราคาขายแนะนำ '+fmtTHB(price);
}
function wireCreateFormulaModal(){
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('nfDownloadTemplateBtn').addEventListener('click', function(){ downloadBomTemplateXlsx(); });
  document.getElementById('modalOverlay').addEventListener('input', function(e){
    if(e.target.id==='nfScrap'||e.target.classList.contains('nf-labor-hours')||e.target.classList.contains('nf-labor-rate')||e.target.id==='nfOverheadPct'||e.target.id==='nfMarkup'){
      updateNfCostSummary();
    }
  });
  document.getElementById('nfStepChips').addEventListener('click', function(e){
    const btn = e.target.closest('[data-newstep]'); if(!btn) return; btn.classList.toggle('selected');
  });
  document.getElementById('nfLineMat').addEventListener('change', function(e){
    const box = document.getElementById('nfNewMatFields');
    if(box) box.style.display = e.target.value==='__new__' ? '' : 'none';
    const codeField = document.getElementById('nfLineMatCode');
    if(codeField){
      if(e.target.value==='__new__') codeField.value = '(กรอกรหัสวัตถุดิบใหม่ด้านล่าง)';
      else codeField.value = e.target.value || '';
    }
  });
  document.getElementById('nfAddLineBtn').addEventListener('click', function(){
    const matSel = document.getElementById('nfLineMat').value;
    const qty = parseFloat(document.getElementById('nfLineQty').value)||0;
    if(!matSel) return toast('กรุณาเลือกวัตถุดิบ','critical');
    if(qty<=0) return toast('กรุณาระบุจำนวนที่มากกว่า 0','critical');
    const steps = Array.prototype.slice.call(document.querySelectorAll('#nfStepChips .chip-btn.selected')).map(function(b){ return b.dataset.newstep; });

    function finishAdd(materialId, newMaterial){
      newFormulaDraft.lines.push({materialId:materialId||null, newMaterial:newMaterial||null, qty:qty, steps:steps.length?steps:['ประกอบ']});
      refreshNfLines();
    }

    if(matSel==='__new__'){
      const name = (document.getElementById('nfNewMatName').value||'').trim();
      if(!name) return toast('กรุณาระบุชื่อวัตถุดิบใหม่','critical');
      const code = (document.getElementById('nfNewMatCode').value||'').trim();
      if(code && (materialById(code) || newFormulaDraft.lines.some(function(l){ return l.newMaterial && l.newMaterial.code===code; }))){
        return toast('รหัสวัตถุดิบ "'+code+'" มีอยู่แล้ว กรุณาระบุรหัสอื่นหรือเว้นว่างไว้ให้ระบบตั้งให้','critical');
      }
      const unit = (document.getElementById('nfNewMatUnit').value||'').trim()||'หน่วย';
      const unitCost = parseFloat(document.getElementById('nfNewMatCost').value)||0;
      const category = document.getElementById('nfNewMatCategory').value;
      const newMaterial = {code:code||null, name:name, unit:unit, unitCost:unitCost, category:category};
      const similar = findSimilarMaterials(name);
      if(similar.length){
        nfReadFieldsIntoDraft();
        openModal('พบวัตถุดิบที่ชื่อใกล้เคียงกันอยู่แล้ว',

          '<ul style="margin:8px 0 0 18px;font-size:13px">'+similar.map(function(m){ return '<li class="mono">'+esc(m.id)+' — '+esc(m.name)+'</li>'; }).join('')+'</ul>',
          '<button class="btn ghost" id="modalCancel">ยกเลิก กลับไปแก้ไข</button><button class="btn primary" id="confirmNewMatBtn">ยืนยัน เป็นวัตถุดิบใหม่จริง</button>'
        );
        document.getElementById('modalCancel').addEventListener('click', function(){ closeModal(); renderCreateFormulaModal(); });
        document.getElementById('confirmNewMatBtn').addEventListener('click', function(){
          finishAdd(null, newMaterial);
          closeModal(); renderCreateFormulaModal();
        });
        return;
      }
      finishAdd(null, newMaterial);
      document.getElementById('nfNewMatFields').style.display='none';
      ['nfNewMatCode','nfNewMatName','nfNewMatUnit','nfNewMatCost'].forEach(function(id){ const elx=document.getElementById(id); if(elx) elx.value=''; });
    } else {
      finishAdd(matSel, null);
    }
    document.getElementById('nfLineMat').value='';
    document.getElementById('nfLineMatCode').value='';
    document.getElementById('nfLineQty').value='';
    document.querySelectorAll('#nfStepChips .chip-btn.selected').forEach(function(b){ b.classList.remove('selected'); });
  });
  document.getElementById('nfLinesWrap').addEventListener('click', function(e){
    const delBtn = e.target.closest('[data-nfdel]'); if(!delBtn) return;
    newFormulaDraft.lines.splice(parseInt(delBtn.dataset.nfdel,10),1);
    refreshNfLines();
  });
  document.getElementById('nfImportInput').addEventListener('change', function(e){
    const file = e.target.files[0]; if(!file) return;
    if(!xlsxReady()){ document.getElementById('nfImportInput').value=''; return; }
    const reader = new FileReader();
    reader.onload = function(ev){
      const rows = parseWorkbookRows(ev.target.result);
      if(rows.length && /รหัสสินค้า|รหัสวัตถุดิบ|ชื่อวัตถุดิบ/.test(rows[0].join(''))) rows.shift();
      let added=0, addedNew=0, addedDup=0;
      rows.forEach(function(r){
        const matCode = String(r[1]||'').trim();
        const matName = String(r[2]||'').trim();
        const qty = parseFloat(r[3])||0;
        const unit = String(r[4]||'').trim();
        const priceVal = parseFloat(r[5])||0;
        const stepsStr = String(r[6]||'').trim();
        if(!matName || qty<=0) return;
        const steps = stepsStr.split(/[+\/,]/).map(function(s){ return s.trim(); }).filter(function(s){ return state.productionSteps.indexOf(s)!==-1; });
        let mat = matCode? materialById(matCode) : null;
        if(!mat && !matCode) mat = state.materials.find(function(m){ return m.name.indexOf(matName)!==-1 || matName.indexOf(m.name)!==-1; });
        if(mat){
          newFormulaDraft.lines.push({materialId:mat.id, qty:qty, steps:steps.length?steps:['ประกอบ']});
          added++;
        } else {
          let code = matCode || null;
          if(code && (materialById(code) || newFormulaDraft.lines.some(function(l){ return l.newMaterial && l.newMaterial.code===code; }))){
            code = null; // code already used elsewhere -- fall back to auto-assign instead of colliding
          }
          const similar = findSimilarMaterials(matName);
          newFormulaDraft.lines.push({
            materialId:null,
            newMaterial:{code:code, name:matName, unit:unit||'หน่วย', unitCost:priceVal, category:state.materialCategories[0]},
            qty:qty, steps:steps.length?steps:['ประกอบ'],
            possibleDup: similar.length? similar.map(function(m){ return m.id+' — '+m.name; }).join(', ') : null
          });
          added++; addedNew++;
          if(similar.length) addedDup++;
        }
      });
      refreshNfLines();
      let msg = added? 'นำเข้าวัตถุดิบจาก Excel แล้ว '+added+' รายการ' : 'ไม่พบข้อมูลที่นำเข้าได้ในไฟล์';
      if(addedNew) msg += ' (วัตถุดิบใหม่ที่ยังไม่มีในระบบ '+addedNew+' รายการ — จะถูกเพิ่มเข้าคลังวัตถุดิบเมื่อบันทึกสูตรการผลิต)';
      if(addedDup) msg += ' ⚠ พบ '+addedDup+' รายการชื่อคล้ายของเดิม โปรดตรวจสอบในตารางก่อนบันทึก';
      toast(msg, added? (addedDup? 'critical':'good') : 'critical');
      document.getElementById('nfImportInput').value='';
    };
    reader.readAsArrayBuffer(file);
  });
  document.getElementById('nfSaveBtn').addEventListener('click', function(){
    nfReadFieldsIntoDraft();
    const d = newFormulaDraft;
    if(!d.code) return toast('กรุณาระบุรหัสสินค้า','critical');
    if(!d.editingPid && productById(d.code)) return toast('รหัสสินค้านี้มีอยู่แล้ว','critical');
    if(!d.name) return toast('กรุณาระบุรายการสินค้า','critical');
    // Materials can be left empty here — the product/formula shell saves first, and BOM lines
    // can be added later from "✎ แก้ไข" on the BOM page (no forced all-at-once entry).
    const newLines = d.lines.filter(function(l){ return !l.materialId && l.newMaterial; });
    for(let i=0;i<newLines.length;i++){
      const nm = newLines[i].newMaterial;
      if(nm.code && materialById(nm.code)) return toast('รหัสวัตถุดิบใหม่ "'+nm.code+'" มีอยู่แล้วในระบบ กรุณาแก้ไขก่อนบันทึก','critical');
    }

    function finalizeSave(){
      const createdMaterials = [];
      newLines.forEach(function(l){
        const id = l.newMaterial.code || nextMaterialId();
        const mat = { id:id, name:l.newMaterial.name, category:l.newMaterial.category||state.materialCategories[0], unit:l.newMaterial.unit||'หน่วย', unitCost:l.newMaterial.unitCost||0, stock:0, min:0, safety:0, supplier:'' };
        state.materials.push(mat);
        l.materialId = id; l.newMaterial = null;
        createdMaterials.push(mat);
      });
      if(d.editingPid){
        const existing = productById(d.editingPid);
        existing.category = d.category; existing.name = d.name; existing.active = d.active; existing.unit = d.unit;
        existing.markupPct = d.markupPct; existing.scrapPct = d.scrapPct; existing.laborByStep = d.laborByStep; existing.overheadPct = d.overheadPct;
        existing.bom = d.lines;
        saveState(); closeModal(); render();
        let editMsg = 'แก้ไขสูตรการผลิต '+existing.id+' เรียบร้อยแล้ว';
        if(createdMaterials.length) editMsg += ' — เพิ่มวัตถุดิบใหม่เข้าคลังวัตถุดิบ '+createdMaterials.length+' รายการ ('+createdMaterials.map(function(m){return m.id;}).join(', ')+') สต็อกเริ่มต้น 0 กรุณาไปตรวจสอบ/ปรับปรุงข้อมูลที่หน้าคลังวัตถุดิบ';
        toast(editMsg,'good');
        return;
      }
      const cost = (function(){
        const matCost = d.lines.reduce(function(s,l){ return s+l.qty*effectiveUnitCost(materialById(l.materialId)); },0);
        const afterScrap = matCost/(1-(d.scrapPct||0)/100);
        const laborSum = nfLaborTotal(d);
        const overheadAmt = (afterScrap+laborSum)*(d.overheadPct||0)/100;
        return afterScrap+laborSum+overheadAmt;
      })();
      state.products.push({
        id:d.code, name:d.name, category:d.category, active:d.active, unit:d.unit,
        price: Math.round(cost*(1+d.markupPct/100)*100)/100,
        markupPct:d.markupPct, scrapPct:d.scrapPct, laborByStep:d.laborByStep, overheadPct:d.overheadPct,
        stock:0, bom:d.lines
      });
      saveState(); closeModal(); render();
      let msg = 'สร้างสูตรการผลิต '+d.code+' เรียบร้อยแล้ว';
      if(!d.lines.length) msg += ' — ยังไม่มีรายการวัตถุดิบ กด "✎ แก้ไข" ที่การ์ดสินค้านี้เพื่อเพิ่มวัตถุดิบภายหลังได้';
      if(createdMaterials.length) msg += ' — เพิ่มวัตถุดิบใหม่เข้าคลังวัตถุดิบ '+createdMaterials.length+' รายการ ('+createdMaterials.map(function(m){return m.id;}).join(', ')+') สต็อกเริ่มต้น 0 กรุณาไปตรวจสอบ/ปรับปรุงข้อมูลที่หน้าคลังวัตถุดิบ';
      toast(msg,'good');
    }

    const dupWarnings = [];
    newLines.forEach(function(l){
      const similar = findSimilarMaterials(l.newMaterial.name);
      if(similar.length) dupWarnings.push({line:l, similar:similar});
    });
    if(dupWarnings.length){
      openModal('ตรวจพบวัตถุดิบใหม่ที่ชื่อคล้ายของเดิม ('+dupWarnings.length+' รายการ)',
        '<p class="helptext">กรุณาตรวจสอบก่อนบันทึก — อาจเป็นวัตถุดิบเดียวกับที่มีอยู่แล้วในระบบ ไม่ควรสร้างซ้ำ</p>'+
        dupWarnings.map(function(w){ return '<div style="margin-top:8px"><b>'+esc(w.line.newMaterial.name)+'</b><div class="helptext">คล้ายกับ: '+w.similar.map(function(m){ return esc(m.id)+' — '+esc(m.name); }).join(', ')+'</div></div>'; }).join('')+
        '<p class="helptext" style="margin-top:10px">กด "ดำเนินการต่อ" หากยืนยันว่าเป็นวัตถุดิบใหม่จริง ไม่ซ้ำกับของเดิม หรือ "ยกเลิก" เพื่อกลับไปแก้ไขรายการ</p>',
        '<button class="btn ghost" id="modalCancel">ยกเลิก กลับไปแก้ไข</button><button class="btn primary" id="confirmSaveDupBtn">ดำเนินการต่อ บันทึกสูตรการผลิต</button>'
      );
      document.getElementById('modalCancel').addEventListener('click', function(){ closeModal(); renderCreateFormulaModal(); });
      document.getElementById('confirmSaveDupBtn').addEventListener('click', finalizeSave);
      return;
    }
    finalizeSave();
  });
}
function openAddLineModal(pid, idx){
  const p = productById(pid);
  const existing = idx!==undefined? p.bom[idx] : null;
  const matOptions = state.materials.map(function(m){ return '<option value="'+m.id+'"'+(existing&&existing.materialId===m.id?' selected':'')+'>'+esc(m.id)+' — '+esc(m.name)+' ('+m.unit+')</option>'; }).join('');
  const stepChipsHtml = state.productionSteps.map(function(s){
    const sel = existing && existing.steps && existing.steps.indexOf(s)!==-1;
    return '<button type="button" class="chip-btn'+(sel?' selected':'')+'" data-step="'+s+'">'+s+'</button>';
  }).join(' ');
  openModal((existing?'แก้ไข':'เพิ่ม')+'วัตถุดิบ — '+p.name,
    '<div class="field"><label>วัตถุดิบ</label><select id="lineMat">'+matOptions+'</select></div>'+
    '<div class="field" style="margin-top:10px"><label>รหัสสินค้า</label><input id="lineMatCode" type="text" readonly value="'+esc(existing?existing.materialId:'')+'" placeholder="—" style="background:var(--surface-2);color:var(--text-secondary)"/></div>'+
    '<div style="margin-top:10px">'+field('จำนวนที่ใช้ต่อ 1 หน่วยผลิต','lineQty','number',existing?existing.qty:1,'step="0.001"')+'</div>'+
    '<div class="field" style="margin-top:10px"><label>ขั้นตอนผลิตที่เกี่ยวข้อง (กดเลือกได้หลายรายการ)</label><div class="btn-row" id="stepChipRow">'+stepChipsHtml+'</div></div>',
    '<button class="btn ghost" id="modalCancel">ยกเลิก</button><button class="btn primary" id="saveLineBtn">บันทึก</button>'
  );
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('lineMat').addEventListener('change', function(e){
    document.getElementById('lineMatCode').value = e.target.value || '';
  });
  document.getElementById('stepChipRow').addEventListener('click', function(e){
    const btn = e.target.closest('[data-step]'); if(!btn) return; btn.classList.toggle('selected');
  });
  document.getElementById('saveLineBtn').addEventListener('click', function(){
    const matId = document.getElementById('lineMat').value;
    const qty = parseFloat(document.getElementById('lineQty').value)||0;
    const steps = Array.prototype.slice.call(document.querySelectorAll('#stepChipRow .chip-btn.selected')).map(function(b){ return b.dataset.step; });
    const line = { materialId:matId, qty:qty, steps:steps };
    if(existing) p.bom[idx]=line; else p.bom.push(line);
    saveState(); closeModal(); render(); toast('บันทึกรายการวัตถุดิบแล้ว','good');
  });
}

function costBreakdownHtml(p){
  const matCost = p.bom.reduce(function(s,c){ return s+c.qty*effectiveUnitCost(materialById(c.materialId)); },0);
  const afterScrap = matCost/(1-(p.scrapPct||0)/100);
  const m = marginInfo(p);
  const laborRawP = productLaborByStep(p);
  return '<div class="grid grid-2" style="gap:6px 24px">'+
    costLine('ต้นทุนวัตถุดิบ/หน่วย', fmtTHB(matCost)) +
    costLine('อัตราสูญเสีย (Scrap/Loss)', p.scrapPct+'%') +
    costLine('ต้นทุนวัตถุดิบหลังหักสูญเสีย', fmtTHB(afterScrap)) +
    state.productionSteps.filter(function(s){ return (laborRawP[s].hours||0)>0 || (laborRawP[s].rate||0)>0; }).map(function(s){
      const hr = laborRawP[s];
      return costLine('ค่าแรง — '+s+' ('+fmtHM(hr.hours)+' × '+fmtTHB(hr.rate)+'/ชม.)', fmtTHB(hmToDecimalHours(hr.hours)*hr.rate));
    }).join('') +
    costLine('ค่าโสหุ้ยการผลิต (Overhead '+fmtNum(productOverheadPct(p),1)+'%)', fmtTHB(overheadAmount(p))) +
    '</div><div class="divider"></div>' + costLine('ต้นทุนการผลิตจริง/หน่วย', fmtTHB(m.cost), true);
}

      '<td class="num mono" style="font-weight:700;color:'+(m.profit>=0?'var(--good)':'var(--critical)')+'">'+fmtTHB(m.profit)+'</td>'+
      '<td><span class="pill '+marginClass+'"><span class="dot"></span>'+fmtNum(m.pct,1)+'%</span></td>'+
      '<td><button type="button" class="btn sm" data-act="toggle-cost-detail" data-pid="'+p.id+'">'+(expanded?'▾ ซ่อน':'▸ รายละเอียด')+'</button></td></tr>';

  card.appendChild(tw);

      p.price = val;
      saveState(); render(); toast('อัปเดตราคาขาย '+p.name+' แล้ว','good');
      return;
    }
    if(e.target.id==='costCatFilter'){
      ui.costCatFilter = e.target.value;
      render();
    }
  });
  return wrap;
}

function committedDemandForMaterial(materialId){
  // Materials already required by OTHER open work orders that have not yet had stock withdrawn (w.started===false).
  // These are "reserved" against current stock even though they haven't been deducted yet.
  return state.workOrders.filter(function(w){ return !w.started && w.status!=='เสร็จสิ้น'; }).reduce(function(sum, w){
    const wp = productById(w.productId);
    if(!wp || !Array.isArray(wp.bom)) return sum;
    const line = wp.bom.find(function(c){ return c.materialId===materialId; });
    if(!line) return sum;
    return sum + line.qty*w.targetQty/(1-(wp.scrapPct||0)/100);
  }, 0);
}
function pendingSupplyForMaterial(materialId){
  // Quantities already requested (draft cart + non-rejected PRs) count as incoming supply for planning purposes.
  const inDraft = ui.prDraft.filter(function(d){ return d.materialId===materialId; }).reduce(function(s,d){ return s+(d.qty||0); },0);
  const inPr = state.purchaseRequests.filter(function(r){ return r.status==='รออนุมัติ'||r.status==='อนุมัติแล้ว'; }).reduce(function(sum, r){
    const it = r.items.find(function(x){ return x.materialId===materialId; });
    return sum + (it? (it.qty||0) : 0);
  }, 0);
  return inDraft+inPr;
}
function computeMrpRows(productId, qty){
  const p = productById(productId);
  if(!p || !Array.isArray(p.bom)) return [];
  return p.bom.filter(function(c){ return materialById(c.materialId); }).map(function(c){
    const mat = materialById(c.materialId);
    const required = c.qty*qty/(1-(p.scrapPct||0)/100);
    const reserved = committedDemandForMaterial(mat.id);
    const incoming = pendingSupplyForMaterial(mat.id);
    const availableForNewPlan = Math.max(0, (mat.stock||0)-reserved+incoming);
    const shortage = Math.max(0, required-availableForNewPlan);
    const suggestPO = shortage>0? Math.ceil(shortage+(mat.safety||0)) : 0;
    return { mat:mat, required:required, shortage:shortage, suggestPO:suggestPO, reserved:reserved, incoming:incoming, availableForNewPlan:availableForNewPlan };
  });
}

            .then(function(r){ return r.json(); })
            .then(function(res){
              if(res.ok) finish('บันทึก PR เข้า Ecount แล้ว '+selected.length+' ใบ','good');

          finish('บันทึก PR เข้า Ecount แล้ว '+selected.length+' ใบ (จำลอง)','good');

      });
      return;

  return wrap;
}

function routingTable(p, targetQty){
  const steps = activeSteps(p);
  let rows='';
  steps.forEach(function(s){
    const lines = p.bom.filter(function(c){ return (c.steps||[]).indexOf(s)!==-1; });
    const partsTxt = lines.map(function(c){
      const mat = materialById(c.materialId);
      const need = c.qty*targetQty/(1-p.scrapPct/100);
      return esc(mat.name)+' ('+fmtNum(need,2)+' '+mat.unit+')';
    }).join('<br>');
    rows += '<tr><td style="font-weight:700">'+s+'</td><td>'+partsTxt+'</td><td class="mono"></td></tr>';
  });
  return '<table class="print-table"><thead><tr><th>ขั้นตอนผลิต</th><th>วัตถุดิบ/ชิ้นส่วนที่ต้องเบิก</th><th>ผู้เบิก/เวลา</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function setSubWoMaterialDate(w, step, materialId, val){

function startWorkOrder(w){
  if(w.started) return;
  const p = productById(w.productId);
  p.bom.forEach(function(c){
    const mat = materialById(c.materialId);
    const usage = c.qty*w.targetQty/(1-p.scrapPct/100);
    mat.stock = Math.max(0, mat.stock-usage);
    state.stockLog.push({date:TODAY, materialId:mat.id, type:'OUT', qty:usage, ref:w.id});
  });
  w.started = true; w.status='กำลังผลิต';
  saveState();
  toast('เบิกวัตถุดิบและตัดสต็อกสำหรับ '+w.id+' เรียบร้อย — เริ่มเดินไลน์แล้ว','good');
}
