<style>

<script type="text/plain" id="gas">
/**
 * RST 3-Way Matching — Google Apps Script (Code.gs)
 * ฐานข้อมูลและรายงานของระบบ 3-Way Matching บน Google Sheet
 *
 * วิธีติดตั้ง
 *   1. เปิด Google Sheet > Extensions > Apps Script
 *   2. ลบโค้ดเดิม วางไฟล์นี้ทั้งหมด แล้วกด Save
 *   3. Deploy > New deployment > Web app
 *      Execute as: Me   |   Who has access: Anyone
 *   4. นำ URL ที่ลงท้ายด้วย /exec ไปวางในแท็บ "ตั้งค่า" ของหน้าเว็บ
 *
 * โครงสร้างไฟล์
 *   1. CONFIG          ค่าคงที่ของระบบ
 *   2. ENTRY POINTS    doGet / doPost ที่หน้าเว็บเรียก
 *   3. DATABASE        อ่าน เขียน ลบ ข้อมูลในแท็บ DB
 *   4. REPORT          เขียนแท็บรายงานที่อ่านได้
 *   5. UTILITIES       ฟังก์ชันช่วย
 *   6. MANUAL TOOLS    ฟังก์ชันที่กด Run เองจากหน้า Apps Script
 *
 * รูปแบบแท็บ DB (ห้ามแก้ด้วยมือ)
 *   คอลัมน์ A = ชุดข้อมูล (pos, dels, invs, appr, promos, promosets, meta)
 *   คอลัมน์ B = รหัสเอกสาร
 *   คอลัมน์ C = เวลาที่บันทึกล่าสุด
 *   คอลัมน์ D เป็นต้นไป = ข้อมูล JSON ตัดเป็นท่อนละไม่เกิน 45,000 ตัวอักษร
 */

/* ============================================================
 * 1. CONFIG
 * ============================================================ */
var CONFIG = {
  DB_SHEET: 'DB',     // ชื่อแท็บฐานข้อมูล
  CHUNK: 45000,       // ความยาวสูงสุดต่อเซลล์ (Google Sheet จำกัด 50,000)
  META_COLS: 3,       // จำนวนคอลัมน์ก่อนถึงข้อมูล JSON
  LOCK_MS: 25000      // เวลารอคิวเมื่อมีหลายคนบันทึกพร้อมกัน
};

/* ============================================================
 * DATA HUB (อ่านอย่างเดียว)
 * อ่านทุกแท็บที่ชื่อลงท้ายด้วย _LINES จากไฟล์ RST GROUP Data Hub
 * ครั้งแรกหลังเพิ่มส่วนนี้ ต้อง Deploy เวอร์ชันใหม่และอนุญาตสิทธิ์อ่าน Google Sheet อีกครั้ง
 * ============================================================ */
function hubRead_(id) {
  if (!id) return { ok: false, error: 'hub: missing file id' };
  var ss = SpreadsheetApp.openById(id), tz = ss.getSpreadsheetTimeZone(), tabs = {}, names = [];
  ss.getSheets().forEach(function (sh) {
    var n = sh.getName(); names.push(n);
    if (!/_LINES$/i.test(n) || sh.getLastRow() < 1) return;
    var v = sh.getDataRange().getValues();
    for (var r = 1; r < v.length; r++) for (var c = 0; c < v[r].length; c++)
      if (v[r][c] instanceof Date) v[r][c] = Utilities.formatDate(v[r][c], tz, 'yyyy-MM-dd');
    tabs[n] = { headers: v[0], rows: v.slice(1).filter(function (x) { return x.join('') !== ''; }) };
  });
  return { ok: true, names: names, tabs: tabs };
}

/* ============================================================
 * 2. ENTRY POINTS
 * ============================================================ */

/** GET  ?action=hub&id=<รหัสไฟล์ Data Hub>  อ่านแท็บ *_LINES ของ RST GROUP Data Hub
 *  GET  ?action=load  ส่งข้อมูลทั้งหมดกลับไปให้หน้าเว็บ
 *  GET  ?action=ping  ใช้ทดสอบว่าเชื่อมต่อได้ */
function doGet(e) {
  try {
    var action = (e && e.parameter && e.parameter.action) || 'load';
    if (action === 'ping') return json_({ ok: true, time: new Date().toISOString() });
    if (action === 'hub') return json_(hubRead_(e.parameter.id));
    return json_({ ok: true, rows: dbReadAll_() });
  } catch (err) {
    return json_({ ok: false, error: String(err) });
  }
}

/** POST {action:'save',   rows:[{coll,id,json}], deletes:[{coll,id}]}
 *  POST {action:'report', sheets:{ชื่อแท็บ: [[แถว]]}} */
function doPost(e) {
  var lock = LockService.getScriptLock();
  lock.waitLock(CONFIG.LOCK_MS);
  try {
    var body = JSON.parse(e.postData.contents);
    if (body.action === 'save') {
      dbSave_(body.rows || [], body.deletes || []);
      return json_({ ok: true });
    }
    if (body.action === 'report') {
      reportWrite_(body.sheets || {});
      return json_({ ok: true });
    }
    return json_({ ok: false, error: 'unknown action' });
  } catch (err) {
    return json_({ ok: false, error: String(err) });
  } finally {
    lock.releaseLock();
  }
}

/* ============================================================
 * 3. DATABASE
 * ============================================================ */

/** คืนแท็บ DB ถ้ายังไม่มีให้สร้างและตั้งรูปแบบเป็นข้อความ */
function dbSheet_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(CONFIG.DB_SHEET);
  if (!sheet) {
    sheet = ss.insertSheet(CONFIG.DB_SHEET);
    sheet.getRange('A:Z').setNumberFormat('@');
  }
  return sheet;
}

/** อ่านทุกแถวเป็น [{coll, id, json}] */
function dbReadAll_() {
  var values = dbSheet_().getDataRange().getValues();
  var rows = [];
  for (var i = 0; i < values.length; i++) {
    if (!values[i][0]) continue;
    rows.push({
      coll: String(values[i][0]),
      id: String(values[i][1]),
      json: values[i].slice(CONFIG.META_COLS).join('')
    });
  }
  return rows;
}

/** สร้างดัชนี "ชุดข้อมูล/รหัส" -> เลขแถว */
function dbIndex_(sheet) {
  var values = sheet.getDataRange().getValues();
  var index = {};
  for (var i = 0; i < values.length; i++) {
    if (values[i][0]) index[values[i][0] + '/' + values[i][1]] = i + 1;
  }
  return index;
}

/** แปลงเอกสารหนึ่งรายการเป็นหนึ่งแถว โดยตัด JSON เป็นท่อน */
function dbToRow_(doc) {
  var row = [doc.coll, doc.id, new Date().toISOString()];
  var json = String(doc.json || '');
  for (var p = 0; p < json.length; p += CONFIG.CHUNK) row.push(json.slice(p, p + CONFIG.CHUNK));
  return row;
}

/** เขียนหนึ่งแถวลงตำแหน่งที่กำหนด */
function dbWriteRow_(sheet, rowNumber, row) {
  ensureColumns_(sheet, row.length);
  sheet.getRange(rowNumber, 1, 1, row.length).setNumberFormat('@').setValues([row]);
}

/** บันทึกและลบเอกสาร: แก้แถวเดิม > ลบแถว > ต่อท้ายแถวใหม่ */
function dbSave_(rows, deletes) {
  var sheet = dbSheet_();
  var index = dbIndex_(sheet);
  var toAppend = [];
  var toDelete = [];

  rows.forEach(function (doc) {
    var row = dbToRow_(doc);
    var at = index[doc.coll + '/' + doc.id];
    if (at) {
      sheet.getRange(at, 1, 1, sheet.getMaxColumns()).clearContent();
      dbWriteRow_(sheet, at, row);
    } else {
      toAppend.push(row);
    }
  });

  deletes.forEach(function (doc) {
    var at = index[doc.coll + '/' + doc.id];
    if (at) toDelete.push(at);
  });
  toDelete.sort(function (a, b) { return b - a; }).forEach(function (at) { sheet.deleteRow(at); });

  toAppend.forEach(function (row) { dbWriteRow_(sheet, sheet.getLastRow() + 1, row); });
}

/* ============================================================
 * 4. REPORT
 * ============================================================ */

/** เขียนทับแท็บรายงานตามชื่อที่หน้าเว็บส่งมา (ไม่แตะแท็บ DB) */
function reportWrite_(sheets) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  Object.keys(sheets).forEach(function (name) {
    if (name === CONFIG.DB_SHEET) return;
    var sheet = ss.getSheetByName(name) || ss.insertSheet(name);
    var rows = sheets[name] || [];
    sheet.clearContents();
    if (!rows.length) return;
    var width = 1;
    rows.forEach(function (r) { if (r.length > width) width = r.length; });
    rows.forEach(function (r) { while (r.length < width) r.push(''); });
    ensureColumns_(sheet, width);
    sheet.getRange(1, 1, rows.length, width).setValues(rows);
  });
}

/* ============================================================
 * 5. UTILITIES
 * ============================================================ */

/** ตอบกลับเป็น JSON */
function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

/** เพิ่มคอลัมน์ให้พอสำหรับข้อมูล */
function ensureColumns_(sheet, needed) {
  var have = sheet.getMaxColumns();
  if (have < needed) sheet.insertColumnsAfter(have, needed - have);
}

/* ============================================================
 * 6. MANUAL TOOLS  (เลือกชื่อฟังก์ชันแล้วกด Run ในหน้า Apps Script)
 * ============================================================ */

/** สร้างแท็บ DB ล่วงหน้า และขอสิทธิ์ครั้งแรก */
function setup() {
  dbSheet_();
  Logger.log('พร้อมใช้งาน แท็บ ' + CONFIG.DB_SHEET + ' ถูกสร้างแล้ว');
}

/** นับจำนวนเอกสารในแต่ละชุดข้อมูล ดูผลที่ Execution log */
function dbStats() {
  var count = {};
  dbReadAll_().forEach(function (r) { count[r.coll] = (count[r.coll] || 0) + 1; });
  Logger.log(JSON.stringify(count));
  return count;
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ==========================================================================
 * RST 3-Way Matching — โครงสร้างโปรแกรม
 *  01  CORE  —  ค่าคงที่ ค่าเริ่มต้นของเกณฑ์ และฟังก์ชันพื้นฐาน (แปลงตัวเลข เทียบรหัส เทียบชื่อ)
 *  02  MATCHING ENGINE  —  ตรรกะการจับคู่ทั้งหมด: อ้างอิงเอกสาร โปรโมชั่นและส่วนลด ขั้น ① ② ③ ตรวจใบกำกับ และสรุปราย PO

/* ==========================================================================

/* ผลตรวจความถูกต้องของใบกำกับภาษีหนึ่งใบ ตามวัตถุประสงค์ของ 3-way matching:
   สินค้า (ตรงกับ PO) · จำนวน (ไม่เกินที่รับจริง) · ราคา (ตรงกับราคา PO หลังหักส่วนลด) · ยอดเงิน (รวมรายการ ส่วนลด ภาษี ยอดรวม ลงตัว) */
function invVerdict(D,inv){const st=D.set,dp=docPO(D,inv),X=invLines(inv,D),ptol=Math.max(st.priceTol,0.01),tol=Math.max(st.vatTol,0.05),all=D.invs.includes(inv)?D.invs:[...D.invs,inv];
  const rc=new Map(),seen=new Set(),noPO=[],qBad=[],noRecv=[],pBad=[];let net=0,exp=0,expOk=true;
  for(const x of X){const l=x.l,po=linePO(D,l,dp),t=po&&resolveLine(aggLines(po),l);net+=x.net;if(!t){noPO.push(l.code||l.name||'?');expOk=false;continue}
    if(!rc.has(po))rc.set(po,{dl:recv(D,po),iv:tally(D,all,po)});const R=rc.get(po),d=R.dl.m.get(t.k),i=R.iv.m.get(t.k),k=po.poNo+'|'+t.k;
    if(!seen.has(k)){seen.add(k);if(d.qty<EPS)noRecv.push(t.code);else if(i.qty-d.qty>EPS)qBad.push(t.code+' เรียกเก็บรวม '+fq(i.qty)+' รับจริง '+fq(d.qty));else if(i.qty-t.qty>EPS)qBad.push(t.code+' เรียกเก็บรวม '+fq(i.qty)+' เกิน PO '+fq(t.qty))}
    const eff=l.qty?x.net/l.qty:null;if(t.price==null||eff==null){expOk=false;continue}exp+=l.qty*t.price;
    if(eff-t.price>ptol||(t.price-eff>ptol&&!(x.dsc>0.005)))pBad.push(t.code+' '+fm(eff)+' ≠ ราคา PO '+fm(t.price))}
  const n=X.length,sub=num(inv.subtotal),vat=num(inv.vat),tot=num(inv.total),m=[];
  if(sub==null)m.push('ไม่มียอดก่อนภาษี');else if(Math.abs(net-sub)>tol)m.push('รวมรายการหลังหักส่วนลด '+fm(net)+' ≠ ยอดก่อนภาษี '+fm(sub));
  if(sub!=null){const vc=Math.round(sub*st.vatRate)/100;if(vat==null)m.push('ไม่มียอดภาษี');else if(Math.abs(vat-vc)>tol)m.push('ภาษี '+fm(vat)+' ≠ '+st.vatRate+'% ของยอดก่อนภาษี '+fm(vc));
    if(tot==null)m.push('ไม่มียอดรวม');else if(vat!=null&&Math.abs(tot-sub-vat)>tol)m.push('ยอดรวม '+fm(tot)+' ≠ ก่อนภาษี + ภาษี '+fm(sub+vat))}
  const items=[{k:'สินค้า',ok:n>0&&!noPO.length,d:!n?'ไม่มีรายการสินค้า':noPO.length?'ไม่อยู่ใน PO: '+noPO.join(', '):'ทั้ง '+n+' รายการอยู่ใน PO'},
    {k:'จำนวน',ok:n>0&&!noPO.length&&!qBad.length&&!noRecv.length,d:qBad.length?qBad.join(' · '):noRecv.length?'ยังไม่มีเอกสารรับสินค้า: '+noRecv.join(', '):noPO.length?'ตรวจไม่ได้เพราะมีรายการที่ไม่อยู่ใน PO':'ไม่เกินจำนวนที่รับจริงและไม่เกิน PO'},
    {k:'ราคา',ok:n>0&&expOk&&!pBad.length,d:pBad.length?pBad.join(' · '):!expOk?'มีรายการที่ไม่มีราคา PO ให้เทียบ':'ราคาหลังหักส่วนลดตรงกับราคา PO ทุกรายการ'},
    {k:'ยอดเงิน',ok:!m.length,d:m.length?m.join(' · '):'รวมรายการ ส่วนลด ภาษี และยอดรวมลงตัว'+(expOk?' · มูลค่าตาม PO '+fm(exp)+(Math.abs(exp-net)>tol?' ('+(net<exp?'ใบกำกับต่ำกว่า ':'ใบกำกับสูงกว่า ')+fm(Math.abs(exp-net))+')':''):'')}];
  return{items,ok:items.every(x=>x.ok)}}
function verdictHtml(v,compact){if(compact)return `<div style="white-space:nowrap;margin-top:3px">${v.items.map(x=>`<span title="${esc(x.d)}">${pill(x.ok?'ok':'bad',x.k+' '+(x.ok?'✓':'✕'))}</span>`).join('')}</div>`;
  return `<div class="deep-f" style="border:1px solid var(--line);border-radius:6px;margin:6px 0;display:block"><div><b>ผลตรวจความถูกต้องของใบกำกับภาษี</b> ${pill(v.ok?'ok':'bad',v.ok?'ถูกต้องครบถ้วน':'ยังไม่ถูกต้อง')}</div>${v.items.map(x=>`<div style="margin-top:4px">${pill(x.ok?'ok':'bad',x.k+' '+(x.ok?'✓':'✕'))} <span class="sub">${esc(x.d)}</span></div>`).join('')}</div>`}

let RES=null;

    </tbody></table></div>

    <div class="row"><button class="pri" data-act="impGo" ${BUSY?'disabled':''}>นำเข้า</button><button data-act="impCancel">ยกเลิก</button>${BUSY?`<span class="chip">${esc(BUSY)}</span>`:''}</div></section>`:'';

  <section class="card"><h2>โปรโมชั่น</h2><p>มี ${D.sets.length} โปรโมชั่น รวม ${D.promos.length} รายการ นำเข้าเพิ่ม กำหนดช่วงเวลา และลบทั้งโปรได้ที่แท็บ “คลังโปรโมชั่น”</p>

const hn=s=>String(s??'').toLowerCase().replace(/\s+/g,' ').trim();
function autoMap(headers,fields){const H=headers.map(hn),map={},used=new Set();
  for(const pass of[0,1])for(const[f,,syn]of fields){if(map[f]!=null)continue;
    for(const s of syn){const i=H.findIndex((h,ix)=>!used.has(ix)&&(pass===0?h===s:h.includes(s)));if(i>=0){map[f]=i;used.add(i);break}}}
  return map}
async function readXlsx(file,kind){
  const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true});
  const fields=FIELDS[kind];let best=0,bs=-1;
  for(let i=0;i<Math.min(rows.length,25);i++){const n=Object.keys(autoMap(rows[i],fields)).length;if(n>bs){bs=n;best=i}}
  const headers=rows[best].map(x=>String(x??''));
  IMP={kind,fields,headers,map:autoMap(headers,fields),rows:rows.slice(best+1).filter(r=>r.some(c=>c!=='')),file:file.name,name:file.name.replace(/\.[^.]+$/,''),start:'',end:'',discType:'pct'};
  if(kind==='promo')IMP.ptype=(IMP.map.disc==null||/น้ำมัน|oil|lube/i.test(file.name))?'price':'pct';
  tab='docs';render()}
const dstr=v=>{if(v instanceof Date){const d=new Date(v.getTime()-v.getTimezoneOffset()*60000);return d.toISOString().slice(0,10)}const m=String(v||'').match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);if(m)return`${m[1]>2400?m[1]-543:m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;const m2=String(v||'').match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m2)return`${m2[3]>2400?m2[3]-543:m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;return''};
function netPrice(price,qty,netRaw,amtRaw,dRaw,type){const n=num(netRaw),a=num(amtRaw),r4=x=>Math.round(x*1e4)/1e4;
  if(n!=null)return n;if(a!=null&&qty)return r4(a/qty);
  let d=typeof dRaw==='string'?num(dRaw.replace('%','')):num(dRaw);if(d==null||price==null)return price;
  if(typeof dRaw==='string'&&dRaw.includes('%'))return r4(price*(1-d/100));
  if(type==='unit')return r4(price-d);if(type==='line')return qty?r4(price-d/qty):price;
  if(typeof dRaw==='number'&&Math.abs(d)<1)d*=100;return r4(price*(1-d/100))}
function promoPrice(mo,disc,np){mo=num(mo);np=num(np);let d=typeof disc==='string'&&disc.includes('%')?num(disc.replace('%','')):num(disc);

  return{mo,disc:d,price:np}}

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('โหลดไม่ได้: '+src));document.head.appendChild(s)})}

const isPdf=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name);
async function filePages(file){

    for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);
      let text='';try{const tc=await pg.getTextContent(),ln=new Map();for(const it of tc.items){if(!it.str||!it.str.trim())continue;const y=Math.round(it.transform[5]/4);if(!ln.has(y))ln.set(y,[]);ln.get(y).push(it)}
        text=[...ln.entries()].sort((a,b)=>b[0]-a[0]).map(e=>e[1].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join('  ')).join('\n')}catch(e){}

const PROMPT=kind=>`You are reading a Thai procurement document for an accounts-payable check. The document is a ${kind==='inv'?'tax invoice (ใบกำกับภาษี)':'delivery note / packing list (ใบส่งสินค้า / packing attached list)'}. All attached files are pages of the same document.
Transcribe exactly what is printed. Never guess, never correct, never compute a value that is not printed. Copy item codes character by character (watch 0/O, 1/I, 5/S, 8/B). If a character or number is unclear, give your best reading and set "unsure": true on that line. Use null for anything not printed.
Numbers: plain numbers without thousands separators. Dates: YYYY-MM-DD in the Gregorian calendar (subtract 543 from a Buddhist-era year).
Reply with only one JSON object in this shape:
{"docNo":string|null,"date":string|null,"vendor":string|null,"vendorTaxId":string|null,"buyerTaxId":string|null,"poNo":string|null,"refNo":string|null,"creditDays":number|null,"dueDate":string|null,"lines":[{"ref":string|null,"code":string|null,"name":string|null,"qty":number|null,"unit":string|null,"price":number|null,"disc":number|null,"amount":number|null,"unsure":boolean}],"discount":number|null,"subtotal":number|null,"vat":number|null,"total":number|null}

async function aiRead(kind,files,signal){const content=[];

    lines:(o.lines||[]).map(l=>({ref:l.ref?String(l.ref):'',code:l.code||'',name:l.name||'',qty:num(l.qty),price:num(l.price),disc:num(l.disc),amount:num(l.amount),unsure:!!l.unsure}))}))}

/* เติมช่องส่วนลด (บาท) เมื่อเอกสารไม่ได้อ่านยอดส่วนลดมา:

      และส่วนต่างคิดเป็น % จำนวนเต็มหรือ .50 → ส่วนต่างนั้นคือส่วนลด */

const stamp=()=>new Date(Date.now()+7*36e5).toISOString().slice(0,16).replace('T',' ').replace(':','');
function exportX(){try{XLSX.writeFile(buildWB(),'RST-3way-matching-'+stamp().slice(0,10)+'.xlsx')}catch(e){console.error(e);toast('ส่งออกไม่สำเร็จ')}}
async function report(){if(!CFG.gsUrl)return toast('เชื่อมต่อ Google Sheet ที่แท็บ “ตั้งค่า” ก่อน');if(isDemo())return toast('นี่คือข้อมูลตัวอย่าง นำเข้าข้อมูลจริงก่อน');
  const wb=buildWB(),sheets={};for(const n of wb.SheetNames)sheets[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''});
  SYNC.msg='กำลังส่งรายงานไป Google Sheet…';chip();
  try{await gsPost({action:'report',sheets});SYNC.msg='ส่งรายงานไป Google Sheet แล้ว '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});toast('อัปเดตแท็บรายงานใน Google Sheet แล้ว')}
  catch(e){console.error(e);SYNC.msg='ส่งรายงานไม่สำเร็จ';toast('ส่งรายงานไป Google Sheet ไม่สำเร็จ ตรวจ URL และการ Deploy')}
  chip()}

/* ==========================================================================
 * MODULE 19  APP: EVENTS + START
 * ตัวจัดการปุ่มและช่องกรอกทั้งหมด และการเริ่มทำงานของระบบ
 * ฟังก์ชัน: -
 * ========================================================================== */
/* ---------- events ---------- */
let pendKind=null;
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='openPO'&&ev.target.closest('[data-stop]'))return;
  const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id,demo=isDemo();
  const need=()=>{if(demo){toast('นี่คือข้อมูลตัวอย่าง นำเข้าข้อมูลจริงก่อน');return true}return false};
  try{switch(a){
    case'tab':tab=v;F.q='';try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0);break;
    case'openPO':tab='invoice';F.q=v;F.only=false;render();break;
    case'prd':PRD=PRD===v?null:v;render();break;
    case'selInv':SELINV=id&&id!==SELINV?id:null;render();if(SELINV){const e=$('#deepSec');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}break;
    case'openPO2':F.q=v;F.only=false;render();break;
    case'export':exportX();break;
    case'sheet':report();break;
    case'saveCfg':for(const k of['gsUrl','userName','aiKey','aiModel']){const el=$('#c_'+k);if(el)CFG[k]=el.value.trim()}saveCfg();myId=CFG.userName||null;toast('บันทึกแล้ว');render();
      if(CFG.gsUrl){try{SYNC.msg='กำลังดึงข้อมูลจาก Google Sheet…';chip();const n=await gsLoad();SYNC.msg='เชื่อมต่อ Google Sheet แล้ว';if(!n&&!realEmpty())await pushAll();render();toast(n?'ดึงข้อมูลจาก Google Sheet แล้ว':'เชื่อมต่อแล้ว')}catch(e){console.error(e);SYNC.msg='เชื่อมต่อ Google Sheet ไม่ได้';chip();toast('เชื่อมต่อ Google Sheet ไม่ได้ ตรวจ URL และสิทธิ์ Anyone ตอน Deploy')}}break;
    case'gsPull':try{const n=await gsLoad();render();toast(n?'ดึงข้อมูลจาก Google Sheet แล้ว':'Google Sheet ยังไม่มีข้อมูล')}catch(e){toast('ดึงข้อมูลไม่สำเร็จ')}break;
    case'gsPush':if(isDemo()){toast('ยังไม่มีข้อมูลจริงให้ส่ง');break}await pushAll();toast(SYNC.state==='ok'?'ส่งข้อมูลทั้งหมดไป Google Sheet แล้ว':'ส่งข้อมูลไม่สำเร็จ');break;
    case'adminIn':{const v=$('#adminPin').value;if(v&&v===settings().adminPin){try{sessionStorage.setItem('m3_admin',v)}catch(e){}toast('เข้าโหมดผู้ดูแลระบบแล้ว')}else toast('รหัสผู้ดูแลไม่ถูกต้อง');render();break}
    case'adminSet':{if(!isAdmin)break;const v=$('#adminPin').value.trim();if(v.length<4){toast('รหัสต้องยาวอย่างน้อย 4 ตัว');break}await put('meta','settings',{...settings(),adminPin:v});try{sessionStorage.setItem('m3_admin',v)}catch(e){}toast('ตั้งรหัสผู้ดูแลแล้ว');render();break}
    case'adminOut':try{sessionStorage.removeItem('m3_admin')}catch(e){}PE=null;render();break;
    case'copyGas':{const t=$('#gasCode');try{await navigator.clipboard.writeText(t.value);toast('คัดลอกโค้ดแล้ว')}catch(e){t.focus();t.select();toast('กด Ctrl+C เพื่อคัดลอก')}break}
    case'hub':loadHub(false);break;
    case'hubSave':{const fr=$('#s_hubFrom').value.trim(),s={...settings(),hubFileId:$('#s_hubFileId').value.trim(),hubCompany:$('#s_hubCompany').value.trim(),hubFrom:fr,hubVendor:$('#s_hubVendor').value.trim()};
      if(fr&&!/^\d{4}-\d{2}-\d{2}$/.test(fr)){toast('วันที่เริ่มต้องเป็นรูปแบบ ปี ค.ศ.-เดือน-วัน');break}
      if(!readOnly){try{await put('meta','settings',s)}catch(e){wErr(e)}}else S.meta.settings=s;
      loadHub(false);break}
    case'impX':pendKind=v;$('#fileX').value='';$('#fileX').click();break;
    case'impGo':importGo();break;
    case'impCancel':IMP=null;render();break;
    case'scan':pendKind=v;$('#fileS').value='';$('#fileS').click();break;
    case'stop':SQ=null;PEND=[];abortCtl&&abortCtl.abort();break;
    case'sqStop':sqStop();renderEd();break;
    case'manual':openEditor(v,{},[],false);break;
    case'edit':openEditor(v==='invs'?'inv':'del',{...S[v][id],_id:id},[],false);break;
    case'delDoc':if(b.dataset.sure){await rm(v,id);toast('ลบแล้ว');render()}else{b.dataset.sure='1';b.textContent='ยืนยันลบ'}break;
    case'edAdd':ED.lines.push({code:'',name:'',qty:null,price:null,amount:null});renderEd();break;
    case'edAddPo':{const D=DATA(),po=findPO(D,id),inv=ED.kind==='inv';if(!po)break;const cur={...edDoc(true),_id:ED.id||'__new'},coll=inv?'invs':'dels',D2={...D,[coll]:[...D[coll].filter(x=>x._id!==ED.id&&kc(x.docNo)!==kc(cur.docNo)),cur]};delete D2._r1m;
      const R=summary(D2),ag=aggLines(po),have=new Set(ED.lines.map(l=>{const t=resolveLine(ag,l);return t?kc(t.code):kc(l.code)})),hp=docPO(D,ED);let n=0;
      for(const r of (inv?R.r3:R.r2).filter(r=>r.poNo===po.poNo&&!have.has(kc(r.code))&&(v==='*'||kc(r.code)===kc(v)))){const q=inv?Math.max(0,(r.del||0)-(r.inv||0)):(r.out||0),pr=inv?r.poPrice??null:null;
        ED.lines.push({code:r.code,name:r.name,qty:q>0?q:null,price:pr,amount:pr!=null&&q>0?Math.round(q*pr*100)/100:null,ref:!inv&&hp&&hp!==po?po.poNo:'',unsure:true});n++}
      ED.lines=ED.lines.filter(l=>l.code||l.name||l.qty!=null);renderEd();toast(n?'เพิ่ม '+n+' รายการจาก PO แล้ว ตรวจจำนวนกับเอกสารจริงก่อนบันทึก':'ไม่มีรายการให้เพิ่ม');break}
    case'edDel':ED.lines.splice(+b.dataset.i,1);renderEd();break;
    case'edCancel':ED=null;$('#ed').hidden=true;sqAfter(false);break;
    case'edSave':edSave();break;
    case'reOne':if(need())break;sendRE([id]);break;
    case'reAll':{if(need())break;const D=DATA();sendRE(reDocs(D).filter(d=>reState(d).k!=='queued').map(d=>d._id));break}
    case'reManual':if(need())break;await put('res',id,{docNo:(S.dels[id]||{}).docNo||'',status:'manual',at:new Date().toISOString(),by:myId||null});render();break;
    case'reClear':await rm('res',id);render();break;
    case'appr':if(need())break;await put('appr',id,{kind:'ready',note:'',by:myId||null,at:new Date().toISOString()});render();break;
    case'exc':if(need())break;EXC=id;render();$('#excNote')&&$('#excNote').focus();break;
    case'excCancel':EXC=null;render();break;
    case'excSave':{const n=$('#excNote').value.trim();if(!n){toast('ใส่เหตุผลก่อนอนุมัติ');break}await put('appr',id,{kind:'exception',note:n,by:myId||null,at:new Date().toISOString()});EXC=null;render();break}
    case'unappr':await rm('appr',id);render();break;
    case'saveSetRange':{const a=$('#ps_start_'+id).value,z=$('#ps_end_'+id).value,qe=$('#ps_q_'+id),ye=$('#ps_y_'+id),se=$('#ps_s_'+id),q=qe?num(qe.value)||0:0,y=ye?num(ye.value)||0:0,sp=se?num(se.value)||0:0;
      if(a&&z&&a>z){toast('วันเริ่มต้องไม่หลังวันสิ้นสุด');break}
      if(q<0||y<0||sp<0||q+y+sp>100){toast('ส่วนลดเพิ่มต้องอยู่ระหว่าง 0–100');break}
      if(![q,y,sp].every(isHalf)){toast('ส่วนลดต้องเป็นจำนวนเต็มหรือลงท้าย .50 เช่น 1, 1.5, 2');break}
      if(id==='legacy')await put('meta','promo',{...(S.meta.promo||{}),start:a,end:z,dcQ:q,dcY:y,dcS:sp});else await put('promosets',id,{...S.promosets[id],start:a,end:z,dcQ:q,dcY:y,dcS:sp});toast('บันทึกโปรโมชั่นแล้ว'+(q||y||sp?' คำนวณ NP_Promotion ใหม่ด้วยส่วนลดเพิ่ม '+(q+y+sp)+'%':''));render();break}
    case'saveDcType':{const by={};let bad=false;DT_TYPES.forEach((t,n)=>{const qe=$('#dt_q_'+n),ye=$('#dt_y_'+n);if(!qe)return;const se=$('#dt_s_'+n),qs=qe.value.trim(),ys=ye.value.trim(),ss=se?se.value.trim():'';if(qs===''&&ys===''&&ss==='')return;const q=num(qs)||0,y=num(ys)||0,sp=num(ss)||0;if(q<0||y<0||sp<0||q+y+sp>100||![q,y,sp].every(isHalf))bad=true;by[t]={q,y,s:sp}});
      if(bad){toast('ส่วนลดเพิ่มต้องอยู่ระหว่าง 0–100 และเป็นจำนวนเต็มหรือลงท้าย .50');break}
      if(id==='legacy')await put('meta','promo',{...(S.meta.promo||{}),dcByType:by});else await put('promosets',id,{...S.promosets[id],dcByType:by});toast('บันทึกส่วนลดตาม Part Type แล้ว คำนวณ NP_Promotion ใหม่');render();break}
    case'peEdit':PE={k:b.dataset.k,i:+b.dataset.i,dc:+b.dataset.dc||0};render();break;
    case'peCancel':PE=null;render();break;
    case'peSave':{if(!isAdmin||!PE)break;const c=S.promos[PE.k];if(!c||!c.rows[PE.i]){PE=null;render();break}
      const mo=num($('#pe_mo').value),d=num($('#pe_disc').value),np=num($('#pe_price').value);
      if(np==null){toast('ใส่ NP_Promotion หรือใส่ MO กับส่วนลดเพื่อให้ระบบคำนวณ');break}
      if(np<0||(d!=null&&(d<0||d>100))){toast('ตรวจตัวเลข: ส่วนลดต้องอยู่ระหว่าง 0–100 และราคาต้องไม่ติดลบ');break}
      if(d!=null&&!isHalf(d)){toast('ส่วนลดโปรต้องเป็นจำนวนเต็มหรือลงท้าย .50 เช่น 12.5, 13, 15');break}
      const rows=c.rows.slice();rows[PE.i]={...rows[PE.i],ptype:$('#pe_ptype')?$('#pe_ptype').value.trim():rows[PE.i].ptype||'',mo,disc:d,price:Math.round(np*100)/100,editedAt:new Date().toISOString(),editedBy:myId||null};
      await put('promos',PE.k,{...c,rows});PE=null;toast('บันทึกราคาโปรโมชั่นแล้ว');render();break}
    case'delSet':if(!b.dataset.sure){b.dataset.sure='1';b.textContent='ยืนยันลบทั้งโปร';break}
      for(const k of Object.keys(S.promos))if((S.promos[k].set||'legacy')===id)await rm('promos',k);
      if(S.promosets[id])await rm('promosets',id);if(F.set===id)F.set='';toast('ลบโปรโมชั่นทั้งชุดแล้ว');render();break;
    case'saveSet':{const s={...settings(),priceTol:num($('#s_priceTol').value)??DEF.priceTol,vatRate:num($('#s_vatRate').value)??DEF.vatRate,vatTol:num($('#s_vatTol').value)??DEF.vatTol,vendorAlias:$('#s_vendorAlias').value,buyerNames:$('#s_buyerNames').value,buyerTaxId:$('#s_buyerTaxId').value.trim(),poIncVat:$('#s_poIncVat').value==='1',promoVendor:$('#s_promoVendor').value.trim(),promoProject:$('#s_promoProject').value.trim()};await put('meta','settings',s);toast('บันทึกเกณฑ์แล้ว');render();break}
  }}catch(e){wErr(e)}});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='q'){F.q=t.value;clearTimeout(rT);rT=setTimeout(()=>{render();const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},250)}
  else if(t.id==='only'){F.only=t.checked;render()}
  else if(IMP&&t.id&&t.id.startsWith('imp_')){IMP[t.id.slice(4)]=t.value}
  else if(t.id==='pe_mo'||t.id==='pe_disc'){const m=num($('#pe_mo').value),d=num($('#pe_disc').value);if(m!=null&&d!=null)$('#pe_price').value=Math.round(m*(100-d-((PE&&PE.dc)||0)))/100}
  else if(ED&&t.dataset.f){ED[t.dataset.f]=t.value;ED.dupOk=false;if(t.dataset.f==='dueDate')ED.dueAuto=false;else if(ED.kind==='inv'&&ED.dueAuto&&(t.dataset.f==='date'||t.dataset.f==='creditDays')){ED.dueDate=addDays(ED.date,num(ED.creditDays)??settings().creditDays??30);const e=$('#ed_dueDate');if(e)e.value=ED.dueDate}}
  else if(ED&&t.dataset.k){const l=ED.lines[+t.dataset.i],k=t.dataset.k;l[k]=['qty','price','amount','disc'].includes(k)?num(t.value):t.value}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='vend'){F.vendor=t.value;render()}
  else if(t.id==='proj'){F.project=t.value;render()}
  else if(t.id==='mon'){F.month=t.value;render()}
  else if(t.id==='setF'){F.set=t.value;F.ptype='';render()}
  else if(t.id==='ptF'){F.ptype=t.value;render()}
  else if(t.id==='fileX'&&t.files[0])readXlsx(t.files[0],pendKind).catch(e=>{console.error(e);toast('เปิดไฟล์ Excel ไม่ได้')});
  else if(t.id==='fileS'&&t.files.length)scanPick(pendKind,[...t.files]);
  else if(ED&&(t.dataset.f||t.dataset.k))edRefresh()});
init();
</script>
