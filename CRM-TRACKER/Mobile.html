<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RST CRM Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* ===== เวอร์ชันมือถือ: เบา เร็ว เน้นงานหลัก 2 อย่างของเซลล์ — เพิ่มลูกค้าใหม่ / ค้นหา-ติดตาม =====
       ตัด export CSV, ตั้งค่าคอลัมน์, ปฏิทิน, รายงาน, สมาชิก, ประวัติการใช้งาน ออกทั้งหมด
       (ฟีเจอร์เหล่านี้เป็นงานบริหาร/office ทำบนคอมพิวเตอร์สะดวกกว่า) เชื่อมต่อ backend ตัวเดียวกับ
       เวอร์ชันเดสก์ท็อป — ไม่ต้องแก้ Code.js ใดๆ เพิ่มเติม */
    :root {
        --primary-color: #0284c7;
        --bg-color: #f1f5f9;
        --text-color: #1e293b;
        --border-color: #cbd5e1;
        --accent-color: #f97316;
        color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior-y: contain; }
    body { background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; }

    /* แถบบนสุด */
    #topbar {
        position: sticky; top: 0; z-index: 20; background: var(--primary-color); color: #fff;
        padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;
        box-shadow: 0 2px 6px rgba(0,0,0,.12);
    }
    #topbar .title { font-weight: 700; font-size: 16px; }
    #topbar .user-badge { font-size: 11.5px; opacity: .92; display: flex; align-items: center; gap: 8px; }
    #topbar button.logout { background: rgba(255,255,255,.18); border: none; color: #fff; padding: 5px 10px; border-radius: 7px; font-size: 11.5px; }

    main { flex: 1; overflow-y: auto; padding: 12px 12px 84px; }

    /* แท็บล่าง (thumb-friendly) */
    #bottom-nav {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex;
        background: #fff; border-top: 1px solid var(--border-color); box-shadow: 0 -2px 10px rgba(0,0,0,.06);
        padding-bottom: env(safe-area-inset-bottom);
    }
    #bottom-nav button {
        flex: 1; border: none; background: none; padding: 10px 4px 8px; font-size: 12px; color: #94a3b8;
        display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 56px;
    }
    #bottom-nav button .ic { font-size: 21px; }
    #bottom-nav button.active { color: var(--primary-color); font-weight: 600; }

    .page { display: none; }
    .page.active { display: block; }

    label { display: block; font-size: 12.5px; color: #475569; margin: 12px 0 4px; font-weight: 500; }
    label:first-child { margin-top: 0; }
    .form-control {
        width: 100%; padding: 11px 12px; border: 1px solid var(--border-color); border-radius: 9px;
        font-size: 15px; background: #fff; color: var(--text-color); min-height: 44px;
    }
    textarea.form-control { min-height: 70px; resize: vertical; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    .card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 12px; }
    .card-title { font-weight: 600; font-size: 14.5px; margin-bottom: 8px; color: #0f172a; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 9px; font-size: 14px; font-weight: 600; padding: 11px 14px; min-height: 44px; cursor: pointer; }
    .btn-primary { background: var(--primary-color); color: #fff; width: 100%; }
    .btn-accent { background: var(--accent-color); color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-sm { padding: 7px 10px; font-size: 12.5px; min-height: 36px; }
    .btn:disabled { opacity: .55; }

    /* ผลค้นหา: การ์ดแทนตาราง (มือถือปัดนิ้วอ่านง่ายกว่า) */
    .search-bar { display: flex; gap: 8px; margin-bottom: 12px; }
    .search-bar input { flex: 1; }
    .customer-card { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); border-left: 4px solid var(--border-color); }
    .customer-card.type-เป้าหมาย { border-left-color: #a855f7; }
    .customer-card.type-จอง { border-left-color: #f59e0b; }
    .customer-card.type-ติดตาม { border-left-color: #0284c7; }
    .customer-card.type-ทำสัญญา { border-left-color: #16a34a; }
    .customer-card.type-ส่งมอบ { border-left-color: #64748b; }
    .cc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .cc-name { font-weight: 700; font-size: 15px; }
    .cc-badge { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: #f1f5f9; color: #475569; white-space: nowrap; }
    .cc-meta { font-size: 12.5px; color: #64748b; margin-top: 3px; }
    .cc-meta a { color: var(--primary-color); text-decoration: none; }
    .cc-actions { display: flex; gap: 8px; margin-top: 10px; }
    .cc-actions .btn { flex: 1; }
    .empty-hint { text-align: center; color: #94a3b8; font-size: 13px; padding: 30px 10px; }

    /* ===== แบนเนอร์หน้าหลัก ===== */
    #home-banner {
        background: linear-gradient(135deg, #3b0a0a 0%, #7a1414 55%, #a91f1f 100%);
        border-radius: 16px; padding: 26px 20px 20px; margin-bottom: 14px; text-align: center;
        box-shadow: 0 8px 20px rgba(122,20,20,.28);
    }
    #home-logo { max-width: 220px; width: 78%; height: auto; display: block; margin: 0 auto 12px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); border-radius: 6px; }
    #home-banner-sub { color: rgba(255,255,255,.88); font-size: 12px; letter-spacing: .2px; }
    #home-greeting-card { display: flex; flex-direction: column; }
    .home-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
    .home-action-btn {
        display: flex; align-items: center; gap: 14px; text-align: left; background: #fff; border: 1px solid var(--border-color);
        border-radius: 14px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .home-action-btn .haic { font-size: 26px; flex: 0 0 auto; line-height: 1; }
    .home-action-btn .hatext { display: flex; flex-direction: column; }
    .home-action-btn .hatxt { font-weight: 700; font-size: 15px; color: #0f172a; }
    .home-action-btn .hasub { font-size: 11.5px; color: #94a3b8; margin-top: 2px; }
    .home-action-btn.accent { border-color: #fed7aa; background: #fff7ed; }

    /* Modal (bottom-sheet style บนมือถือ) */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 50; display: none; align-items: flex-end; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; width: 100%; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .modal-header span { font-weight: 700; font-size: 15.5px; }
    .modal-header button { background: none; border: none; font-size: 20px; color: #94a3b8; line-height: 1; padding: 4px; }

    .followup-type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .followup-type-btn { padding: 10px 6px; border: 1px solid var(--border-color); border-radius: 9px; background: #fff; font-size: 12.5px; }
    .followup-type-btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

    .timeline-item { border-left: 2px solid var(--border-color); padding: 6px 0 10px 12px; margin-left: 4px; position: relative; }
    .timeline-item::before { content: ''; position: absolute; left: -5px; top: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary-color); }
    .timeline-date { font-size: 12px; color: #475569; font-weight: 600; }
    .timeline-by { float: right; font-size: 10.5px; color: #94a3b8; font-weight: normal; }
    .timeline-note { font-size: 13px; margin-top: 3px; white-space: pre-line; }
    .timeline-type-tag { display: inline-block; margin-left: 6px; font-size: 10px; background: #f1f5f9; padding: 1px 7px; border-radius: 999px; color: #64748b; }

    #login-screen {
        position: fixed; inset: 0; z-index: 100; background: linear-gradient(160deg, var(--primary-color), #075985);
        display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    #login-screen .box { background: #fff; border-radius: 16px; padding: 26px 22px; width: 100%; max-width: 360px; box-shadow: 0 20px 40px rgba(0,0,0,.25); }
    #login-screen h1 { font-size: 19px; text-align: center; margin-bottom: 4px; }
    #login-screen p.sub { text-align: center; font-size: 12px; color: #94a3b8; margin-bottom: 18px; }
    #login-status { font-size: 12.5px; text-align: center; margin-top: 10px; color: #ef4444; min-height: 16px; }

    /* ===== ลายน้ำกันข้อมูลรั่ว (เหมือนเวอร์ชันเดสก์ท็อป แต่เบากว่า — ไม่มีระบบเบลอเมื่อสลับแท็บ
       เพราะมือถือสลับแอปบ่อยเป็นปกติ จะทำให้ใช้งานลำบากเกินไป) ===== */
    #wm-overlay { position: fixed; inset: 0; z-index: 15; pointer-events: none; display: none; overflow: hidden; }
    #wm-overlay .wm-row { display: flex; white-space: nowrap; opacity: .06; transform: rotate(-25deg); }
    #wm-overlay .wm-item { font-size: 11px; font-weight: 700; padding: 46px 60px; }
    .no-select { -webkit-user-select: none; user-select: none; }

    #phone-check-msg { display: block; font-size: 11.5px; margin-top: 4px; }
    .duplicate-warn { background: #fef2f2; border: 1px solid #fecaca; border-radius: 9px; padding: 10px; font-size: 12.5px; color: #991b1b; margin-top: 6px; }
    .field-locked { background: #f8fafc !important; color: #94a3b8 !important; }
    .sale-restrict-note { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; font-size: 12px; padding: 8px 10px; border-radius: 9px; margin-bottom: 12px; }
</style>
</head>
<body>

<div id="wm-overlay"></div>

<div id="login-screen">
    <div class="box">
        <h1>🚜 RST CRM</h1>
        <p class="sub">เวอร์ชันมือถือ — สำหรับเพิ่ม/ติดตามลูกค้าภาคสนาม</p>
        <label>ชื่อผู้ใช้งาน</label>
        <input id="login-username" class="form-control" placeholder="username" autocomplete="username">
        <label>รหัสผ่าน</label>
        <input id="login-password" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password">
        <div style="margin-top:16px;"></div>
        <button class="btn btn-primary" onclick="loginUser()">เข้าสู่ระบบ</button>
        <div id="login-status"></div>
    </div>
</div>

<div id="app" style="display:none;">
    <div id="topbar">
        <span class="title">🚜 RST CRM</span>
        <span class="user-badge">
            <span id="current-user-name"></span>
            <button class="logout" onclick="logoutUser()">ออกจากระบบ</button>
        </span>
    </div>

    <main>

        <!-- ===== หน้าเพิ่มลูกค้าใหม่ / แก้ไข ===== -->
        <div class="page" id="page-add">
            <div class="card">
                <div class="card-title" id="add-form-title">➕ เพิ่มลูกค้าใหม่</div>
                <div id="sale-restrict-notice" class="sale-restrict-note" style="display:none;">
                    สิทธิ์ของคุณแก้ไขได้เฉพาะ "ชื่อ-นามสกุล" และ "ที่อยู่" เท่านั้น
                </div>
                <input type="hidden" id="form-row-index" value="">
                <input type="hidden" id="cust-date" value="">

                <div class="row2">
                    <div><label>ชื่อ *</label><input id="cust-fname" class="form-control" placeholder="ชื่อจริง"></div>
                    <div><label>นามสกุล</label><input id="cust-lname" class="form-control" placeholder="นามสกุล"></div>
                </div>
                <label>เบอร์โทรศัพท์ *</label>
                <input id="cust-phone" class="form-control" inputmode="tel" placeholder="08xxxxxxxx" onblur="checkDuplicatePhone()">
                <span id="phone-check-msg"></span>

                <label>ประเภท</label>
                <select id="cust-type" class="form-control">
                    <option value="ลงทะเบียน">ลงทะเบียน</option>
                    <option value="เป้าหมาย">เป้าหมาย</option>
                    <option value="จอง">จอง</option>
                    <option value="ติดตาม">ติดตาม</option>
                </select>

                <label>วันที่นัดหมายครั้งถัดไป</label>
                <input type="date" id="cust-appdate" class="form-control">

                <div class="row2">
                    <div><label>ประเภทสินค้า</label><select id="cust-product-category" class="form-control" onchange="onCustProductCategoryChange()"></select></div>
                    <div><label>รุ่น</label>
                        <select id="cust-product-model" class="form-control"></select>
                        <input id="cust-product-model-text" class="form-control" style="display:none; margin-top:6px;" placeholder="ระบุรุ่น/ชื่อสินค้า">
                    </div>
                </div>

                <label>ที่อยู่</label>
                <div class="row3">
                    <input id="cust-addressno" class="form-control" placeholder="เลขที่">
                    <input id="cust-moo" class="form-control" placeholder="หมู่ที่">
                    <input id="cust-village" class="form-control" placeholder="หมู่บ้าน">
                </div>
                <div class="row3" style="margin-top:8px;">
                    <input id="cust-subdistrict" class="form-control" placeholder="ตำบล">
                    <input id="cust-district" class="form-control" placeholder="อำเภอ">
                    <input id="cust-province" class="form-control" placeholder="จังหวัด" value="อุบลราชธานี">
                </div>
                <input id="cust-zipcode" class="form-control" placeholder="รหัสไปรษณีย์" style="margin-top:8px;">

                <div class="row2">
                    <div><label>LINE ID</label><input id="cust-line" class="form-control"></div>
                    <div><label>Facebook</label><input id="cust-facebook" class="form-control"></div>
                </div>

                <label>หมายเหตุ</label>
                <textarea id="cust-note" class="form-control" placeholder="บันทึกรายละเอียดเพิ่มเติม..."></textarea>

                <div style="margin-top:16px; display:flex; gap:8px;">
                    <button class="btn btn-primary" id="btn-submit" onclick="onFormSubmit()" style="flex:1;">💾 บันทึก</button>
                    <button class="btn btn-secondary" id="btn-cancel-edit" style="display:none;" onclick="resetFormState()">ยกเลิก</button>
                </div>
            </div>
        </div>

        <!-- ===== หน้าค้นหา / ติดตาม ===== -->
        <div class="page" id="page-search">
            <div class="search-bar">
                <input id="search-keyword" class="form-control" placeholder="ค้นหาชื่อหรือเบอร์โทร..." onkeydown="if(event.key==='Enter')doSearch()">
                <button class="btn btn-primary" style="width:auto; padding:11px 16px;" onclick="doSearch()">🔍</button>
            </div>
            <div id="search-results"><div class="empty-hint">พิมพ์ชื่อหรือเบอร์โทรแล้วกดค้นหา</div></div>
        </div>
    </main>

            <button type="button" class="followup-type-btn" data-value="ส่งโปร / ใบเสนอราคา" onclick="selectFollowupType(this)">📄 ส่งโปร/ใบเสนอ</button>
            <button type="button" class="followup-type-btn" data-value="นัดทดลองรถ / ดูสินค้า" onclick="selectFollowupType(this)">🚜 นัดทดลอง/ดูสินค้า</button>
            <button type="button" class="followup-type-btn" data-value="อื่น ๆ" onclick="selectFollowupType(this)">🔁 อื่น ๆ</button>
        </div>
        <label>หมายเหตุ (คุยเรื่องอะไร ผลเป็นอย่างไร)</label>
        <textarea id="history-new-note" class="form-control" placeholder="เช่น โทรเสนอโปรโมชั่น Solis30 ลูกค้าขอคิดดูก่อน 1 สัปดาห์"></textarea>
        <button class="btn btn-accent" id="btn-submit-followup" style="width:100%; margin-top:12px;" onclick="submitFollowUpEntry()">💾 บันทึกการติดตามนี้</button>
    </div>
</div>

<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyJG7iZcsOYRUBjpWO9NkGZelBT4PvPaGIiGyXNEEpsu6KQITULI4RxT1xGb5vyyAzV/exec';
    const authTokenKey = 'crm_tracker_token';
    const nativeFetch = window.fetch.bind(window);
    window.fetch = function(url, options) {
        options = options || {};
        if (typeof options.body === 'string') {
            try {
                const parsed = JSON.parse(options.body);
                if (parsed && parsed.action && parsed.action !== 'login') {
                    parsed.token = parsed.token || localStorage.getItem(authTokenKey) || '';
                    options.body = JSON.stringify(parsed);
                }
            } catch (e) { }
        }
        return nativeFetch(url, options);
    };

    let currentRole = 'user';
    let currentUserDisplayName = '';
    let duplicatePhoneMatch = null;
    let editOriginalPhone = '';
    let searchResultsData = [];

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str === null || str === undefined ? '' : String(str);
        return div.innerHTML;
    }
    function todayStr() { return new Date().toISOString().split('T')[0]; }

    // ===== Login / Logout =====
    function loginUser() {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value.trim();
        const status = document.getElementById('login-status');
        status.style.color = '#64748b';
        status.innerText = 'กำลังเข้าสู่ระบบ...';
        fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'login', payload: { username, password } })
        })
        .then(res => res.json())
        .then(resData => {
            if (resData && resData.success && resData.token) {
                localStorage.setItem(authTokenKey, resData.token);
                currentRole = resData.user && resData.user.role ? resData.user.role : 'user';
                currentUserDisplayName = (resData.user && (resData.user.name || resData.user.username)) || username;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                document.getElementById('current-user-name').innerText = currentUserDisplayName;
                document.getElementById('home-user-display').innerText = currentUserDisplayName + (currentRole === 'sale' ? ' (Sale)' : currentRole === 'admin' ? ' (admin)' : ' (พนักงาน)');
                document.getElementById('home-date-display').innerText = new Date().toLocaleDateString('th-TH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                document.getElementById('sale-restrict-notice').style.display = (currentRole === 'sale') ? '' : 'none';
                populateProductCategorySelect();
                document.getElementById('cust-date').value = todayStr();
                activateWatermark_();
                return;
            }
            status.style.color = '#ef4444';
            const message = resData && resData.message ? resData.message : '';
            status.innerText = message.indexOf('Invalid Action') !== -1
                ? 'ระบบยังใช้ deployment เก่า กรุณา Deploy Code.js เวอร์ชันใหม่ก่อน'
                : (message || 'เข้าสู่ระบบไม่สำเร็จ');
        })
        .catch(() => { status.style.color = '#ef4444'; status.innerText = 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ'; });
    }
    function logoutUser() {
        if (!confirm('ต้องการออกจากระบบใช่หรือไม่?')) return;
        const token = localStorage.getItem(authTokenKey) || '';
        fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'logout', token }) })
            .catch(() => {})
            .finally(() => {
                localStorage.removeItem(authTokenKey);
                location.reload();
            });
    }

    // ===== Nav =====
    function switchPage(name) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + name).classList.add('active');
        document.getElementById('nav-home').classList.toggle('active', name === 'home');
        document.getElementById('nav-add').classList.toggle('active', name === 'add');
        document.getElementById('nav-search').classList.toggle('active', name === 'search');
        window.scrollTo({ top: 0 });
    }

    // ===== สินค้า (เหมือนเวอร์ชันเดสก์ท็อป) =====
    const FREE_TEXT_CATEGORY = 'อื่นๆ (ระบุเอง)';
    const PRODUCT_CATALOG = {
        'Yanmar': ['EF393A / EF393T-45th', 'YM351R', 'YM358R', 'YM358R-L1', 'EF725T'],
        'Solis': ['Solis 26', 'Solis26', 'YM-Solis22', 'YM-Solis26', 'YM-Solis30', 'YM-Solis30-45th', 'YM-Solis50', 'YM-Solis50-45th', 'YM-Solis 65', 'YM-Solis75', 'YM-Solis75-45th', 'YM-Solis90', 'YM-Solis105', 'YM-Solis 105 Cabin'],
        'รถเกี่ยว': ['AW82V', 'YH700', 'YH700 Cabin', 'YH850GUW 2.3', 'YH850 Cabin', 'YH1180G26WU-TH'],
        'รถขุด': ['Vio17', 'Vio23', 'Vio30-7', 'Vio30-Air-7', 'Vio35-7', 'Vio35-Air-7', 'Vio50', 'Vio55 Air', 'Vio80', 'Vio100'],
        'รถแทรกเตอร์มือ 2': ['EF353T', 'EF393T', 'EF453T', 'EF494T', 'EF514T', 'YM351R', 'YM358R', 'EF725', 'Solis22', 'Solis26', 'Solis30', 'Solis50', 'Solis75', 'Solis90'],
        'รถเกี่ยวมือ 2': ['AW82V', 'YH700', 'YH700 Cabin', 'YH850GUW 2.3', 'YH850 Cabin', 'YH1180G26WU-TH'],
        [FREE_TEXT_CATEGORY]: [],
        'อื่นๆ': ['เครื่องอัดฟาง', 'Drone']
    };
    function populateProductCategorySelect() {
        const sel = document.getElementById('cust-product-category');
        sel.innerHTML = '<option value="">-- เลือกประเภทสินค้า --</option>' + Object.keys(PRODUCT_CATALOG).map(c => `<option value="${c}">${c}</option>`).join('');
        onCustProductCategoryChange();
    }
    function populateProductModelSelect(category, selected) {
        const sel = document.getElementById('cust-product-model');
        const models = PRODUCT_CATALOG[category] || [];
        sel.innerHTML = '<option value="">-- เลือกรุ่น --</option>' + models.map(m => `<option value="${m}">${m}</option>`).join('');
        if (selected && models.includes(selected)) sel.value = selected;
    }
    function onCustProductCategoryChange() {
        const category = document.getElementById('cust-product-category').value;
        const isFreeText = category === FREE_TEXT_CATEGORY;
        document.getElementById('cust-product-model').style.display = isFreeText ? 'none' : '';
        document.getElementById('cust-product-model-text').style.display = isFreeText ? '' : 'none';
        if (!isFreeText) populateProductModelSelect(category, '');
    }
    function getProductModelValue() {
        const textEl = document.getElementById('cust-product-model-text');
        if (textEl.style.display !== 'none') return textEl.value.trim();
        return document.getElementById('cust-product-model').value;
    }

    // ===== เช็คเบอร์ซ้ำ =====
    function checkDuplicatePhone() {
        const phoneVal = document.getElementById('cust-phone').value.trim();
        const msgSpan = document.getElementById('phone-check-msg');
        const editRowIndex = document.getElementById('form-row-index').value;
        duplicatePhoneMatch = null;
        if (editRowIndex || phoneVal.length < 9) { msgSpan.innerHTML = ''; return; }
        msgSpan.innerHTML = '⚡ กำลังเช็ก...';
        fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'checkDuplicatePhone', payload: { phone: phoneVal } }) })
            .then(res => res.json())
            .then(resData => {
                if (resData && resData.success && resData.isDuplicate) {
                    duplicatePhoneMatch = { phone: phoneVal, name: resData.customerName };
                    msgSpan.innerHTML = `<b style="color:#ef4444;">⚠️ มีในระบบแล้ว (${escapeHtml(resData.customerName)})</b>`;
                } else {
                    msgSpan.innerHTML = '<b style="color:#10b981;">✓ เบอร์ใช้งานได้</b>';
                }
            }).catch(() => { msgSpan.innerHTML = ''; });
    }

    // ===== เพิ่ม/แก้ไขลูกค้า =====
    const SALE_LOCKED_FIELDS = ['cust-phone', 'cust-type', 'cust-appdate', 'cust-product-category', 'cust-product-model', 'cust-product-model-text', 'cust-line', 'cust-facebook', 'cust-note'];
    function applySaleRestriction_(restricted) {
        SALE_LOCKED_FIELDS.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            el.disabled = restricted;
            el.classList.toggle('field-locked', restricted);
        });
    }
    function resetFormState() {
        document.getElementById('form-row-index').value = '';
        editOriginalPhone = '';
        ['cust-fname','cust-lname','cust-phone','cust-line','cust-facebook','cust-note','cust-addressno','cust-moo','cust-village','cust-subdistrict','cust-district','cust-zipcode'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('cust-province').value = 'อุบลราชธานี';
        document.getElementById('cust-date').value = todayStr();
        document.getElementById('cust-appdate').value = '';
        document.getElementById('cust-type').value = 'ลงทะเบียน';
        document.getElementById('phone-check-msg').innerHTML = '';
        populateProductCategorySelect();
        document.getElementById('add-form-title').innerText = '➕ เพิ่มลูกค้าใหม่';
        document.getElementById('btn-submit').innerText = '💾 บันทึก';
        document.getElementById('btn-cancel-edit').style.display = 'none';
        applySaleRestriction_(false);
    }
    function editCustomerFromCard(idx) {
        const row = searchResultsData[idx];
        if (!row) return;
        resetFormState();
        document.getElementById('form-row-index').value = row.raw_key || row.sheetRowIndex || row.phone || '';
        editOriginalPhone = row.phone || row.phone1 || '';
        document.getElementById('cust-date').value = row.date || todayStr();
        const nm = (row.name || '').split(' ');
        document.getElementById('cust-fname').value = row.firstName || row.firstname || nm[0] || '';
        document.getElementById('cust-lname').value = row.lastName || row.lastname || nm.slice(1).join(' ') || '';
        document.getElementById('cust-phone').value = row.phone || '';
        document.getElementById('cust-appdate').value = row.booking_date || '';
        document.getElementById('cust-type').value = row.type || 'ลงทะเบียน';
        const parts = String(row.product || '').split(' | ');
        populateProductCategorySelect();
        if (parts[0]) { document.getElementById('cust-product-category').value = parts[0]; onCustProductCategoryChange(); }
        if (parts[1]) {
            const modelSel = document.getElementById('cust-product-model');
            if (modelSel.style.display !== 'none') modelSel.value = parts[1]; else document.getElementById('cust-product-model-text').value = parts[1];
        }
        document.getElementById('cust-addressno').value = row.addressNo || row.addressno || '';
        document.getElementById('cust-moo').value = row.moo || '';
        document.getElementById('cust-village').value = row.village || '';
        document.getElementById('cust-subdistrict').value = row.subdistrict || '';
        document.getElementById('cust-district').value = row.district || '';
        document.getElementById('cust-province').value = row.province || '';
        document.getElementById('cust-zipcode').value = row.zipcode || '';
        document.getElementById('cust-line').value = row.line || '';
        document.getElementById('cust-facebook').value = row.facebook || '';
        document.getElementById('cust-note').value = row.remark || '';
        applySaleRestriction_(currentRole === 'sale');
        document.getElementById('add-form-title').innerText = currentRole === 'sale' ? '✏️ แก้ไขชื่อ/ที่อยู่' : '✏️ แก้ไขข้อมูลลูกค้า';
        document.getElementById('btn-submit').innerText = '💾 บันทึกการแก้ไข';
        document.getElementById('btn-cancel-edit').style.display = '';
        switchPage('add');
        window.scrollTo({ top: 0 });
    }
    function onFormSubmit() {
        const rid = document.getElementById('form-row-index').value;
        const fname = document.getElementById('cust-fname').value.trim();
        const phone = document.getElementById('cust-phone').value.trim();
        if (!fname || !phone) { alert('กรุณากรอกชื่อและเบอร์โทรศัพท์'); return; }
        if (!rid && duplicatePhoneMatch && duplicatePhoneMatch.phone === phone) {
            if (!confirm(`⚠️ เบอร์นี้มีในระบบแล้ว (${duplicatePhoneMatch.name})\nกด "ตกลง" เพื่อเพิ่มซ้ำต่อไป หรือ "ยกเลิก" เพื่อไปค้นหารายเดิมแทน`)) {
                switchPage('search');
                document.getElementById('search-keyword').value = phone;
                doSearch();
                return;
            }
        }
        const lname = document.getElementById('cust-lname').value.trim();
        const addrNo = document.getElementById('cust-addressno').value.trim();
        const moo = document.getElementById('cust-moo').value.trim();
        const village = document.getElementById('cust-village').value.trim();
        const packData = {
            date: document.getElementById('cust-date').value || todayStr(),
            booking_date: document.getElementById('cust-appdate').value,
            appdate: document.getElementById('cust-appdate').value,
            firstname: fname, lastname: lname, name: `${fname} ${lname}`.trim(),
            phone: phone,
            type: document.getElementById('cust-type').value,
            productCategory: document.getElementById('cust-product-category').value,
            productModel: getProductModelValue(),
            product: [document.getElementById('cust-product-category').value, getProductModelValue()].filter(Boolean).join(' | '),
            addressno: addrNo, moo: moo, village: village,
            address: [addrNo, moo ? `หมู่ ${moo}` : '', village].filter(Boolean).join(' '),
            subdistrict: document.getElementById('cust-subdistrict').value,
            district: document.getElementById('cust-district').value,
            province: document.getElementById('cust-province').value,
            zipcode: document.getElementById('cust-zipcode').value,
            remark: document.getElementById('cust-note').value,
            line: document.getElementById('cust-line').value,
            facebook: document.getElementById('cust-facebook').value,
            financialInfo: '{}'
        };
        const actionType = rid ? 'update' : 'add';
        const payloadReq = rid ? { rowIndex: rid, cust: packData, phoneHint: editOriginalPhone } : packData;
        const btn = document.getElementById('btn-submit');
        const originalHtml = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = '⏳ กำลังบันทึก...';
        fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: actionType, payload: payloadReq }) })
            .then(res => res.json())
            .then(resData => {
                if (resData && resData.success) {
                    alert('💾 บันทึกข้อมูลสำเร็จ!');
                    resetFormState();
                } else {
                    alert('❌ เกิดข้อผิดพลาดในการบันทึก: ' + (resData ? resData.message : 'ไม่ทราบสาเหตุ'));
                }
            })
            .catch(() => alert('🛑 เชื่อมต่อกับเซิร์ฟเวอร์ล้มเหลว ลองใหม่อีกครั้ง'))
            .finally(() => { btn.disabled = false; btn.innerHTML = originalHtml; });
    }

    // ===== ค้นหา (การ์ดแทนตาราง) =====
    function doSearch() {
        const keyword = document.getElementById('search-keyword').value.trim();
        const box = document.getElementById('search-results');
        if (!keyword) { box.innerHTML = '<div class="empty-hint">พิมพ์ชื่อหรือเบอร์โทรแล้วกดค้นหา</div>'; return; }
        box.innerHTML = '<div class="empty-hint">⚡ กำลังค้นหา...</div>';
        fetch(WEB_APP_URL, {
            method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'search', page: 1, pageSize: 30, sortBy: 'date_desc', filters: { keyword, exactPhone: '', types: [], startDate: '', endDate: '', appdate: '', followupStartDate: '', followupEndDate: '', productCategory: '', productModel: '', province: '', subdistrict: '', district: '', note: '' } })
        })
        .then(res => res.json())
        .then(resData => {
            if (!resData || !resData.success) { box.innerHTML = `<div class="empty-hint">❌ ${resData ? resData.message : 'เกิดข้อผิดพลาด'}</div>`; return; }
            searchResultsData = resData.data || [];
            if (!searchResultsData.length) { box.innerHTML = '<div class="empty-hint">❌ ไม่พบข้อมูลที่ตรงเงื่อนไข</div>'; return; }
            box.innerHTML = searchResultsData.map((row, idx) => {
                const followCount = Array.isArray(row.followUpLog) ? row.followUpLog.length : (row.followUpCount || 0);
                return `<div class="customer-card type-${escapeHtml(row.type || '')}">
                    <div class="cc-top">
                        <span class="cc-name">${escapeHtml(row.name || '-')}</span>
                        <span class="cc-badge">${escapeHtml(row.type || '-')}</span>
                    </div>
                    <div class="cc-meta">📞 <a href="tel:${escapeHtml(row.phone || '')}">${escapeHtml(row.phone || '-')}</a>${row.product ? ' · ' + escapeHtml(row.product) : ''}</div>
                    <div class="cc-meta">นัดหมาย: ${escapeHtml(row.booking_date || '-')} · ติดตามล่าสุด: ${escapeHtml(row.lastFollowupDate || '-')}${row.created_by ? ' · 👤 ' + escapeHtml(row.created_by) : ''}</div>
                    <div class="cc-actions">
                        <button class="btn btn-primary btn-sm" onclick="openHistoryModal(${idx})">🕓 ติดตาม${followCount ? ' (' + followCount + ')' : ''}</button>
                        <button class="btn btn-secondary btn-sm" onclick="editCustomerFromCard(${idx})">✏️ แก้ไข</button>
                    </div>
                </div>`;
            }).join('');
        })
        .catch(() => { box.innerHTML = '<div class="empty-hint">🛑 เชื่อมต่อเซิร์ฟเวอร์ล้มเหลว</div>'; });
    }

    // ===== ไทม์ไลน์การติดตาม =====
    let historyModalKey = null, historyModalPhoneHint = '', historyModalRowIdx = null, historyModalEntries = [];
    function openHistoryModal(idx) {
        const row = searchResultsData[idx];
        if (!row) return;
        historyModalRowIdx = idx;
        historyModalKey = row.raw_key || row.sheetRowIndex || row.phone;
        historyModalPhoneHint = row.phone || row.phone1 || '';
        historyModalEntries = Array.isArray(row.followUpLog) ? row.followUpLog.slice() : [];
        document.getElementById('history-modal-name').innerText = `🕓 ${row.name || '-'} · ${row.phone || ''}`;
        document.getElementById('history-new-date').value = todayStr();
        document.getElementById('history-next-followup-date').value = '';
        document.getElementById('history-new-note').value = '';
        document.getElementById('history-followup-type').value = '';
        document.querySelectorAll('#history-followup-type-grid .followup-type-btn').forEach(b => b.classList.remove('active'));
        renderHistoryTimeline();
        document.getElementById('history-modal-overlay').classList.add('show');
    }
    function closeHistoryModal() { document.getElementById('history-modal-overlay').classList.remove('show'); }
    function selectFollowupType(btn) {
        document.querySelectorAll('#history-followup-type-grid .followup-type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('history-followup-type').value = btn.dataset.value;
    }
    function renderHistoryTimeline() {
        const container = document.getElementById('history-timeline-list');
        if (!historyModalEntries.length) { container.innerHTML = '<div class="empty-hint" style="padding:14px;">ยังไม่มีประวัติการติดตาม</div>'; return; }
        const sorted = historyModalEntries.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        container.innerHTML = sorted.map(e => `
            <div class="timeline-item">
                <div class="timeline-date">📅 ${escapeHtml(e.date)}${e.followupType ? `<span class="timeline-type-tag">${escapeHtml(e.followupType)}</span>` : ''}${e.by ? `<span class="timeline-by">👤 ${escapeHtml(e.by)}</span>` : ''}</div>
                <div class="timeline-note">${escapeHtml(e.note || '')}</div>
            </div>
        `).join('');
    }
    function submitFollowUpEntry() {
        const btn = document.getElementById('btn-submit-followup');
        if (btn.disabled) return;
        const dateVal = document.getElementById('history-new-date').value;
        const noteVal = document.getElementById('history-new-note').value.trim();
        const nextFollowUpVal = document.getElementById('history-next-followup-date').value;
        const followupTypeVal = document.getElementById('history-followup-type').value;
        if (!dateVal || !followupTypeVal || !noteVal) { alert('กรุณาระบุวันที่ ประเภท และหมายเหตุการติดตามให้ครบ'); return; }
        if (!historyModalKey) { alert('ไม่พบข้อมูลอ้างอิงลูกค้ารายนี้'); return; }
        const originalHtml = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = '⏳ กำลังบันทึก...';
        const newEntry = { date: dateVal, followupType: followupTypeVal, note: noteVal, nextFollowUpDate: nextFollowUpVal };
        fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'addFollowUp', payload: { key: historyModalKey, entry: newEntry, phoneHint: historyModalPhoneHint } }) })
            .then(res => res.json())
            .then(resData => {
                if (resData && resData.success) {
                    historyModalEntries.push(newEntry);
                    if (searchResultsData[historyModalRowIdx]) {
                        searchResultsData[historyModalRowIdx].followUpLog = historyModalEntries.slice();
                        searchResultsData[historyModalRowIdx].lastFollowupDate = dateVal;
                        searchResultsData[historyModalRowIdx].booking_date = resData.nextFollowUpDate || nextFollowUpVal;
                    }
                    renderHistoryTimeline();
                    document.getElementById('history-new-note').value = '';
                    document.getElementById('history-followup-type').value = '';
                    document.querySelectorAll('#history-followup-type-grid .followup-type-btn').forEach(b => b.classList.remove('active'));
                } else {
                    alert('❌ บันทึกการติดตามไม่สำเร็จ: ' + (resData ? resData.message : 'ไม่ทราบสาเหตุ'));
                }
            })
            .catch(() => alert('🛑 เชื่อมต่อกับเซิร์ฟเวอร์ล้มเหลว ลองใหม่อีกครั้ง'))
            .finally(() => { btn.disabled = false; btn.innerHTML = originalHtml; });
    }

    // ===== ลายน้ำกันข้อมูลรั่ว (เบาแรง เฉพาะลายน้ำ ไม่มีเบลอ/ดักคีย์ เพื่อความลื่นไหลบนมือถือ) =====
    function activateWatermark_() {
        const overlay = document.getElementById('wm-overlay');
        const text = `${currentUserDisplayName} · ${new Date().toLocaleString('th-TH', { hour12: false })}`;
        let rowsHtml = '';
        for (let r = 0; r < 8; r++) {
            let itemsHtml = '';
            for (let c = 0; c < 3; c++) itemsHtml += `<span class="wm-item">${escapeHtml(text)}</span>`;
            rowsHtml += `<div class="wm-row">${itemsHtml}</div>`;
        }
        overlay.innerHTML = rowsHtml;
        overlay.style.display = 'block';
        document.addEventListener('contextmenu', e => e.preventDefault());
    }
</script>
