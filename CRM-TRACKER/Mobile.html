<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>RST CRM Mobile</title>
<!--
  (r52) RST CRM Mobile — ไฟล์นี้ "ไม่มีโค้ดระบบในตัว" แต่จะโหลด index.html (เวอร์ชันคอม) ที่อยู่โฟลเดอร์เดียวกัน
  มาใหม่ทุกครั้งที่เปิด แล้วเสริมหน้าตาสำหรับมือถือ (แถบเมนูล่าง, ผลค้นหาเป็นการ์ด, ปฏิทินพอดีจอ)
  => ฟีเจอร์และสิทธิ์ตรงกับเวอร์ชันคอมเสมอ อีกทีมแก้/อัป index.html เมื่อไหร่ มือถือได้ของใหม่ทันที ไม่ต้องแก้ไฟล์นี้
  ข้อตกลงกับทีมที่แก้ index.html: อย่าเปลี่ยน id ของปุ่มเมนู (nav-btn-*), หน้า (page-*), ฟังก์ชัน switchPage /
  renderTableRows / editCustomerByIndex / openHistoryModal / printRowByIndex — ถ้าเปลี่ยน ให้แจ้งเพื่อแก้ mobile layer
  ต้องวางไว้โฟลเดอร์เดียวกับ index.html บน GitHub Pages (เปิดจากไฟล์ในเครื่องตรงๆ จะโหลดไม่ได้)
-->
<style>
  html,body{margin:0;height:100%;background:#0f172a;font-family:'Prompt',system-ui,sans-serif}
  #m-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#e2e8f0;font-size:14px;text-align:center;padding:24px}
  #m-boot .sp{width:34px;height:34px;border:3px solid rgba(255,255,255,.2);border-top-color:#38bdf8;border-radius:50%;animation:s .8s linear infinite}
  #m-boot button{background:#0284c7;color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:15px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="m-boot"><div class="sp"></div><div>กำลังเปิด RST CRM...</div></div>
<script type="text/plain" id="m-layer-css">
        :root { --m-nav-h: 62px; }
        html { -webkit-text-size-adjust: 100%; }
        body { padding: 0 0 calc(var(--m-nav-h) + env(safe-area-inset-bottom) + 8px) !important; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
        /* หัวเว็บ: ติดบน กะทัดรัด */
        .header { position: sticky; top: 0; z-index: 1500; margin: 0 0 8px !important; border-radius: 0 !important; padding: 10px 12px !important;
                  flex-direction: row !important; align-items: center !important; flex-wrap: wrap; gap: 6px !important; padding-top: calc(10px + env(safe-area-inset-top)) !important; }
        .header h1 { font-size: 15px !important; flex: 1 1 auto; }
        .stats-container { flex: 1 1 100%; flex-wrap: wrap; gap: 6px !important; font-size: 11px !important; align-items: center; }
        .stat-item { padding: 3px 8px !important; }
        .stats-container > .stat-item:nth-child(1), .stats-container > .stat-item:nth-child(2), .stats-container > .stat-item:nth-child(3) { display: none; }
        .stats-container { flex-wrap: nowrap !important; }
        #current-user-badge { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #btn-settings-menu, #logout-btn { padding: 6px 10px !important; font-size: 12px !important; }
        .settings-dropdown { position: fixed !important; top: 56px !important; right: 10px !important; left: auto; width: min(260px, calc(100vw - 20px)) !important; }
        .settings-dropdown-item { padding: 13px 14px !important; font-size: 14px !important; }
        .main-layout { padding: 0 10px; gap: 10px !important; }
        .page-view { gap: 10px !important; }
        /* แถบเมนูล่าง (นิ้วโป้งกดถึง) — ใช้ปุ่มเดิมของเวอร์ชันคอม ทุกปุ่มยังเรียก switchPage() ตัวเดิม */
        .page-nav { position: fixed !important; left: 0; right: 0; bottom: 0; z-index: 1600; margin: 0 !important; gap: 0 !important; flex-wrap: nowrap !important;
                    background: #fff; border-top: 1px solid #e2e8f0; box-shadow: 0 -2px 12px rgba(15,23,42,.08); padding-bottom: env(safe-area-inset-bottom); }
        .page-nav-btn { flex: 1 1 0 !important; min-width: 0; min-height: var(--m-nav-h); border-radius: 0 !important; background: none !important; color: #94a3b8 !important;
                        padding: 6px 2px !important; font-size: 11px !important; font-weight: 500 !important; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
        .page-nav-btn .m-ic { font-size: 20px; line-height: 1; }
        .page-nav-btn.active { color: var(--primary-color) !important; font-weight: 700 !important; box-shadow: inset 0 3px 0 var(--primary-color); }
        /* ฟอร์ม: 2 คอลัมน์สำหรับช่องสั้น ช่องยาวเต็มแถว */
        .form-page-wrap { max-width: none; }
        .form-grid-compact { grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
        .form-grid-compact > .form-group:nth-child(-n+2), .form-grid-compact > .form-group-phone { grid-column: auto; }
        .form-grid-compact > .form-group-phone { grid-column: 1 / -1 !important; }
        .form-control, select.form-control, textarea.form-control { font-size: 16px !important; min-height: 44px; }
        textarea.form-control { min-height: 70px; }
        .btn { min-height: 40px; }
        #customer-form .form-group:last-child { position: sticky; bottom: calc(var(--m-nav-h) + env(safe-area-inset-bottom)); background: #fff; padding: 8px 0 4px; z-index: 5; }
        #customer-form .form-group:last-child .btn { flex: 1 1 0; justify-content: center; white-space: nowrap; font-size: 14px; padding: 10px 6px; }
        #customer-form .form-group:last-child #btn-submit { flex: 1.6 1 0; }
        /* ค้นหา: ตัวกรอง 2 คอลัมน์ */
        .filter-grid .form-group { flex: 1 1 calc(50% - 10px) !important; min-width: 0 !important; }
        .filter-grid .form-group.wide { flex: 1 1 100% !important; }
        .search-actions > div { flex-wrap: wrap; }
        .search-actions .btn-primary { flex: 1 1 100%; justify-content: center; }
        /* ผลค้นหา: แสดงเป็นการ์ด (ซ่อนตารางกว้าง 1950px) */
        .table-container { padding: 8px !important; background: transparent !important; box-shadow: none !important; }
        .table-container > .table-responsive { display: none !important; }
        button[onclick="openTableSettingsModal()"] { display: none !important; }
        .pagination-container { flex-wrap: wrap; gap: 8px; background: #fff; border-radius: 10px; padding: 8px !important; }
        .pagination-container > div:last-child { flex: 1 1 100%; }
        .pagination-container > div:last-child .btn { flex: 1 1 0; justify-content: center; }
        .m-cards { display: flex; flex-direction: column; gap: 10px; }
        .m-card { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 1px 3px rgba(15,23,42,.08); border: 1px solid #eef2f7; }
        .m-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .m-card-name { font-size: 15px; font-weight: 600; color: #0f172a; word-break: break-word; }
        .m-card-phone { display: inline-flex; align-items: center; gap: 4px; margin-top: 3px; font-size: 14px; color: #0369a1; text-decoration: none; font-weight: 500; }
        .m-card-meta { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 12px; color: #475569; }
        .m-card-meta .full { grid-column: 1 / -1; }
        .m-card-meta b { color: #94a3b8; font-weight: 500; margin-right: 4px; }
        .m-card-remark { margin-top: 8px; font-size: 12px; color: #334155; background: #f8fafc; border-radius: 8px; padding: 6px 8px; white-space: pre-line; word-break: break-word;
                         display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .m-card-actions { display: flex; gap: 6px; margin-top: 10px; }
        .m-card-actions .btn { flex: 1 1 0; justify-content: center; padding: 8px 4px; font-size: 13px; min-height: 40px; }
        .m-card-actions .has-log { background: #f3e8ff; color: #6b21a8; font-weight: 600; }
        .m-empty { text-align: center; padding: 28px 10px; color: #94a3b8; background: #fff; border-radius: 12px; }
        /* ปฏิทิน: พอดีจอ ไม่ต้องเลื่อนข้าง */
        .calendar-layout { grid-template-columns: 1fr !important; }
        .calendar-scroll { overflow-x: visible !important; }
        .calendar-grid { min-width: 0 !important; grid-template-columns: repeat(7, minmax(0, 1fr)) !important; }
        .calendar-weekday { padding: 6px 0 !important; font-size: 11px !important; }
        .calendar-day { min-height: 54px !important; padding: 4px 3px !important; }
        .calendar-date-number { font-size: 12px; }
        .calendar-count { margin-top: 3px !important; padding: 1px 5px !important; font-size: 10px !important; }
        .calendar-toolbar { flex-wrap: wrap; }
        .calendar-toolbar .calendar-month-title { order: -1; flex: 1 1 100%; font-size: 16px !important; }
        .calendar-toolbar > .btn, .calendar-toolbar > div { flex: 1 1 auto; justify-content: center; }
        .calendar-customer { grid-template-columns: 1fr !important; }
        /* รายงาน/ตารางอื่นๆ: เลื่อนข้างได้ในตัว */
        table:not(#main-table) { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
        .report-row { flex-direction: column !important; }
        .staff-dash-grid { grid-template-columns: 1fr !important; }
        .staff-dash-canvas-wrap { height: 260px !important; }
        .customer-detail-grid { grid-template-columns: 1fr !important; }
        .customer-detail-card.full { grid-column: auto !important; }
        /* modal: เต็มความกว้าง เลื่อนได้ในตัว */
        .modal-overlay { padding: 10px 8px calc(var(--m-nav-h) + 10px) !important; z-index: 2100 !important; }
        .modal-box { width: 100% !important; max-width: 100% !important; }
        .item-fields { grid-template-columns: 1fr !important; }
        .item-fields .full { grid-column: auto !important; }
        .followup-type-btn { padding: 10px 8px !important; font-size: 13px !important; }
        .checkboxes-dropdown { max-width: calc(100vw - 20px); }
        .fab-container { bottom: calc(var(--m-nav-h) + env(safe-area-inset-bottom) + 14px) !important; right: 14px !important; }
        /* สมาชิก / ประวัติการใช้งาน / นำเข้า Excel */
        .mem-layout { grid-template-columns: minmax(0, 1fr) !important; }
        .mem-form-panel { position: static !important; }
        .mem-row-2 { grid-template-columns: 1fr !important; }
        .bi-options { grid-template-columns: 1fr !important; }
        .bi-options > div { grid-column: auto !important; }

        /* เปิด Mobile.html บนจอคอม/แท็บเล็ต: แสดงเป็นกรอบมือถือกลางจอ (ไม่ยืดเต็มจอ) */
        @media (min-width: 700px) {
            html { background: #e2e8f0; }
            body { max-width: 480px; margin: 0 auto !important; min-height: 100vh; box-shadow: 0 0 30px rgba(15,23,42,.12); background: var(--bg-color); }
            .page-nav { max-width: 480px; margin: 0 auto !important; }
            .settings-dropdown { right: calc(50vw - 230px) !important; }
            .fab-container { right: calc(50vw - 226px) !important; }
        }
        @media print { .page-nav, .m-cards, .header { display: none !important; } }
    </script>
<script type="text/plain" id="m-layer-js">
/* (r52) MOBILE LAYER — ตกแต่งหน้าจอมือถือเท่านั้น ไม่เปลี่ยน logic/สิทธิ์ของเวอร์ชันคอม
   (สิทธิ์ export/ลบ ยังตัดสินโดยโค้ดเดิม + backend Code.js เสมอ) */
(function () {
    // 1) ป้ายแถบเมนูล่างให้สั้นพอดีจอมือถือ
    const NAV = { 'nav-btn-add': ['➕', 'เพิ่มลูกค้า'], 'nav-btn-history': ['🔍', 'ค้นหา'], 'nav-btn-calendar': ['📅', 'ปฏิทิน'],
                  'nav-btn-report': ['📈', 'รายงาน'], 'nav-btn-import': ['📥', 'นำเข้า'] };
    Object.keys(NAV).forEach(function (id) {
        const b = document.getElementById(id);
        if (b) b.innerHTML = '<span class="m-ic">' + NAV[id][0] + '</span><span>' + NAV[id][1] + '</span>';
    });

    const lo = document.getElementById('logout-btn');
    if (lo) { lo.innerHTML = '🚪 ออก'; lo.title = 'ออกจากระบบ'; }
    const pl = document.getElementById('btn-print-last');
    if (pl) pl.innerHTML = '🖨️ พิมพ์';
    const sm = document.getElementById('btn-settings-menu');
    if (sm) sm.innerHTML = '⚙️';

    // 2) ผลค้นหาเป็นการ์ด — สร้างจากข้อมูลชุดเดียวกับตาราง (currentRenderedData) และปุ่มเรียกฟังก์ชันเดิมทั้งหมด
    const tableContainer = document.querySelector('#page-history .table-container');
    const cardsBox = document.createElement('div');
    cardsBox.className = 'm-cards';
    cardsBox.id = 'm-cards';
    if (tableContainer) {
        const resp = tableContainer.querySelector('.table-responsive');
        tableContainer.insertBefore(cardsBox, resp);
    }
    function esc(v) { return (typeof escapeHtml === 'function') ? escapeHtml(v == null ? '' : String(v)) : String(v == null ? '' : v); }
    function badgeOf(type) {
        return ({ 'เป้าหมาย': 'badge-target', 'จอง': 'badge-book', 'ติดตาม': 'badge-track', 'ทำสัญญา': 'badge-contract', 'ส่งมอบ': 'badge-deliver' })[type] || 'badge-reg';
    }
    function renderMobileCards_(data) {
        if (!data || !data.length) { cardsBox.innerHTML = '<div class="m-empty">❌ ไม่พบข้อมูลรายชื่อลูกค้าที่ตรงเงื่อนไข</div>'; return; }
        const role = (typeof currentRole !== 'undefined') ? currentRole : 'user';
        const canEdit = role === 'admin' || role === 'staff' || role === 'sale';
        const canDelete = role === 'admin';
        cardsBox.innerHTML = data.map(function (row, idx) {
            let prod = { category: '-', model: '-' };
            try { prod = getRowProductParts(row); } catch (e) {}
            const follow = Array.isArray(row.followUpLog) ? row.followUpLog.length : (row.followUpCount || 0);
            const phone = String(row.phone || '').replace(/[^0-9+]/g, '');
            const addr = [row.subdistrict && ('ต.' + row.subdistrict), row.district && ('อ.' + row.district), row.province && ('จ.' + row.province)].filter(Boolean).join(' ');
            return '<div class="m-card">'
                + '<div class="m-card-top"><div style="min-width:0">'
                +   '<div class="m-card-name">' + esc(row.name || '-') + '</div>'
                +   (phone ? '<a class="m-card-phone" href="tel:' + esc(phone) + '">📞 ' + esc(row.phone) + '</a>' : '')
                + '</div><span class="badge ' + badgeOf(row.type) + '">' + esc(row.type || '-') + '</span></div>'
                + '<div class="m-card-meta">'
                +   '<div><b>บันทึก</b>' + esc(row.date || '-') + '</div>'
                +   '<div><b>นัด</b><span style="color:#ea580c;font-weight:600">' + esc(row.booking_date || '-') + '</span></div>'
                +   '<div class="full"><b>สินค้า</b>' + esc(prod.category) + (prod.model && prod.model !== '-' ? ' · ' + esc(prod.model) : '') + '</div>'
                +   (addr ? '<div class="full"><b>พื้นที่</b>' + esc(addr) + '</div>' : '')
                +   (row.lastFollowupDate ? '<div class="full"><b>ติดตามล่าสุด</b>' + esc(row.lastFollowupDate) + '</div>' : '')
                + '</div>'
                + (row.remark ? '<div class="m-card-remark">' + esc(row.remark) + '</div>' : '')
                + '<div class="m-card-actions">'
                +   (canEdit ? '<button class="btn btn-accent" onclick="editCustomerByIndex(' + idx + ')">✏️ แก้ไข</button>' : '')
                +   '<button class="btn btn-secondary' + (follow ? ' has-log' : '') + '" onclick="openHistoryModal(' + idx + ')">🕓 ติดตาม' + (follow ? ' (' + follow + ')' : '') + '</button>'
                +   '<button class="btn btn-secondary" onclick="printRowByIndex(' + idx + ')" title="พิมพ์แบบฟอร์ม">🖨️</button>'
                +   (canDelete ? '<button class="btn btn-danger" style="background:#ef4444;color:#fff;flex:0 0 46px" onclick="deleteCustomerByIndex(' + idx + ')" title="ลบ">🗑️</button>' : '')
                + '</div></div>';
        }).join('');
    }
    if (typeof window.renderTableRows === 'function') {
        const origRender = window.renderTableRows;
        window.renderTableRows = function (data) {
            origRender.apply(this, arguments);
            try { renderMobileCards_(data); } catch (e) { console.error('mobile cards:', e); }
        };
    }

    // 3) เปลี่ยนหน้าแล้วเลื่อนขึ้นบนสุด (มือถือจอสั้น)
    if (typeof window.switchPage === 'function') {
        const origSwitch = window.switchPage;
        window.switchPage = function () {
            const r = origSwitch.apply(this, arguments);
            try { window.scrollTo({ top: 0 }); } catch (e) {}
            return r;
        };
    }

})();
</script>
<script>
/* กันค้างหน้าโหลด: ถ้า 25 วิแล้วยังไม่เปิด ให้แสดงสาเหตุ + ปุ่มลองใหม่
   (หมายเหตุ: ห้ามพิมพ์แท็กปิด body/head ตรงๆ ในสคริปต์ไฟล์นี้ — VS Code Live Server จะแทรกโค้ดของมันกลางสคริปต์จนพัง จึงใช้ <\/...> แทน) */
window.__mBootTimer = setTimeout(function () {
    var b = document.getElementById('m-boot');
    if (b) b.innerHTML = '<div style="font-size:30px">⚠️</div><div>เปิดระบบไม่สำเร็จ (หมดเวลา)<br><small style="opacity:.7">ต้องมีไฟล์ index.html อยู่โฟลเดอร์เดียวกับ Mobile.html และเปิดผ่านเว็บ (GitHub Pages / Live Server)</small></div><button onclick="location.reload()">ลองใหม่</button>';
}, 25000);
</script>
<script>
(function () {
    var SRC = 'index.html';
    function fail(msg) {
        document.getElementById('m-boot').innerHTML =
            '<div style="font-size:30px">⚠️</div><div>เปิดระบบไม่สำเร็จ<br><small style="opacity:.7">' + msg + '</small></div>' +
            '<button onclick="location.reload()">ลองใหม่</button>';
    }
    fetch(SRC + '?m=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function (html) {
            if (html.indexOf('id="page-add"') === -1) throw new Error('ไฟล์ index.html ไม่ใช่หน้า CRM');
            // VS Code Live Server แทรกสคริปต์ live-reload ไว้ที่ "แท็กปิด body ตัวแรก" ซึ่งใน index.html อาจอยู่ในคอมเมนต์
            // ทำให้คอมเมนต์แตก ข้อความ ===== ยาวๆ หลุดออกมาดันหน้าจอให้กว้างเกินจอมือถือ — ตัดทิ้งก่อน (บน GitHub Pages ไม่มีผล)
            html = html.replace(/<!-- Code injected by live-server -->\s*<script[\s\S]*?<\/script>/gi, '');
            var css = document.getElementById('m-layer-css').textContent;
            var js = document.getElementById('m-layer-js').textContent;
            html = html.replace(/<meta\s+name=["']viewport["'][^>]*>/i,
                '<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#0f172a">');
            html = html.replace(/<title>[\s\S]*?<\/title>/i, '<title>RST CRM Mobile</title>');
            // ต่อ CSS/JS ของมือถือไว้ "ท้ายสุด" ของเอกสาร (ไม่อิงตำแหน่งแท็กปิด body ซึ่งอาจหายถ้าไฟล์ถูกตัดท้าย)
            // ถ้าท้ายไฟล์มีคอมเมนต์ที่เปิดค้างไว้ ให้ตัดทิ้งก่อน ไม่งั้นโค้ดที่ต่อท้ายจะกลายเป็นคอมเมนต์ไปด้วย
            var lo = html.lastIndexOf('<!--'), lc = html.lastIndexOf('-->');
            if (lo > lc) html = html.slice(0, lo);
            html += '\n<style id="mobile-layer">' + css + '<\/style>\n<script id="mobile-layer-js">' + js + '<\/script>\n';
            clearTimeout(window.__mBootTimer);
            document.open();
            document.write(html);
            document.close();
        })
        .catch(function (e) { fail((e && e.message) || 'เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่'); });
})();
</script>
</body>
</html>
